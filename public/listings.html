<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your shelf</title>
<style>
  /* The portal's palette, so this page belongs to the same product. */
  :root {
    --bg: #08080A;
    --panel: #121215;
    --panel-2: #17171B;
    --border: #26262B;
    --text: #E9E9EE;
    --muted: #8B8B95;
    --primary: #2F80ED;
    --primary-soft: #66B3FF;
    --green: #22C55E;
    --amber: #F5A524;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); font-size: 13px; margin: 2px 0 18px; max-width: 62ch; }
  a.back { color: var(--muted); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--text); }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }

  .input, .select {
    height: 36px; padding: 0 11px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font: inherit; outline: none;
  }
  .input:focus, .select:focus { border-color: var(--primary); }
  #search { flex: 1 1 260px; min-width: 200px; }

  .count { color: var(--muted); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }

  .rows { display: flex; flex-direction: column; gap: 8px; }

  .style { border: 1px solid var(--border); border-radius: 11px; background: var(--panel); overflow: hidden; }
  .style.open { border-color: #34343B; }

  /* The whole header line opens the shoe, so nothing has to be aimed at. */
  .head {
    display: flex; gap: 12px; align-items: center;
    padding: 10px 12px; cursor: pointer; width: 100%;
    background: none; border: 0; color: inherit; font: inherit; text-align: left;
  }
  .head:hover { background: var(--panel-2); }
  .head:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

  .head img, .head .blank {
    width: 44px; height: 44px; flex: 0 0 44px; border-radius: 8px; object-fit: cover;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .what { flex: 1 1 auto; min-width: 0; }
  .what strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; }

  .range { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; }

  .chev { flex: 0 0 auto; color: var(--muted); transition: transform 0.15s ease; font-size: 11px; }
  .style.open .chev { transform: rotate(90deg); }

  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .pill.custom { color: var(--primary-soft); border-color: rgba(47, 128, 237, 0.45); }
  .pill.some { color: var(--amber); border-color: rgba(245, 165, 36, 0.45); }

  .body { border-top: 1px solid var(--border); padding: 12px; background: var(--panel-2); }

  .all {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 10px; border-bottom: 1px dashed var(--border);
  }
  .all .label { color: var(--muted); font-size: 12.5px; margin-right: 2px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 0 8px 6px 0;
  }
  td { padding: 4px 8px 4px 0; vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* The last column takes the slack, so five controls do not drift apart
     across a wide screen. */
  th.fill, td.fill { width: 100%; }
  .sizecell { font-weight: 600; white-space: nowrap; }

  .amount { width: 96px; text-align: right; }
  .mode { width: 102px; }

  .btn {
    height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--primary); }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .empty, .problem, .loading { padding: 28px 12px; text-align: center; color: var(--muted); }
  .problem { color: #F87171; }
  .body .loading, .body .problem { padding: 10px 0; text-align: left; }

  .note { margin-top: 18px; color: var(--muted); font-size: 12.5px; }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 14px; border-radius: 9px; font-size: 13px; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }

  @media (max-width: 680px) {
    .head { flex-wrap: wrap; }
    .range { width: 100%; text-align: left; }
    th.hide, td.hide { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Your shelf</h1>
      <a class="back" href="/portal">&larr; Back to the portal</a>
    </header>

    <p class="lead">
      Every shoe of ours standing in your shop. Open one to see its sizes.
      Leave a price on Auto and we work it out; set it to Custom and your
      number is the one that stands.
    </p>

    <div class="tools">
      <input class="input" id="search" type="search" placeholder="Shoe or style code" autocomplete="off">
      <select class="select" id="only">
        <option value="">All shoes</option>
        <option value="custom">With your own prices</option>
        <option value="auto">Priced by Lojiq</option>
      </select>
      <span class="count" id="count"></span>
    </div>

    <div class="rows" id="rows"><p class="loading">Loading&hellip;</p></div>

    <p class="note" id="note" hidden></p>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const euro = (v) => v === null || v === undefined || v === "" ? "—" : new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" }).format(Number(v));

  const store = JSON.parse(localStorage.getItem("lojiq_merchant") || "null");

  /* The shoes as they came down, and the sizes of the ones opened so far.
     Keyed on the tidied style code, which is what the shelf groups on. */
  let styles = [];
  const sizesBySku = new Map();
  const open = new Set();

  let timer = null;

  function say(message) {
    const old = document.querySelector(".toast");
    if (old) old.remove();

    const box = document.createElement("div");
    box.className = "toast";
    box.textContent = message;
    document.body.append(box);
    setTimeout(() => box.remove(), 3200);
  }

  /* 38 2/3 belongs between 38 1/3 and 39, which only a numeric read gets
     right - sorted as words, 4 lands after 39. */
  function bySize(a, b) {
    const read = (size) => {
      const match = String(size).match(/^\s*(\d+(?:[.,]\d+)?)/);

      return match ? Number(match[1].replace(",", ".")) : Number.POSITIVE_INFINITY;
    };

    return read(a.size) - read(b.size) || String(a.size).localeCompare(String(b.size), "nl");
  }

  function priceSummary(style) {
    if (!(style.price_low > 0) && !(style.price_high > 0)) return "—";
    if (Number(style.price_low) === Number(style.price_high)) return euro(style.price_low);

    return euro(style.price_low) + " – " + euro(style.price_high);
  }

  function customPill(style) {
    if (!style.custom_pairs) return "";
    if (style.custom_pairs === style.pairs) return '<span class="pill custom">Your price</span>';

    return '<span class="pill some">' + style.custom_pairs + " of " + style.pairs + " yours</span>";
  }

  function styleHtml(style) {
    const isOpen = open.has(style.sku);

    return (
      '<div class="style' + (isOpen ? " open" : "") + '" data-sku="' + esc(style.sku) + '">' +
        '<button class="head" type="button" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
          (style.picture ? '<img src="' + esc(style.picture) + '" alt="">' : '<span class="blank"></span>') +
          '<span class="what">' +
            "<strong>" + esc(style.name) + "</strong>" +
            '<span class="sub">' + esc(style.sku) +
              (style.brand ? " · " + esc(style.brand) : "") +
              " · " + style.pairs + (style.pairs === 1 ? " size" : " sizes") +
            "</span>" +
          "</span>" +
          '<span class="range">' + priceSummary(style) + "<br>" + customPill(style) + "</span>" +
          '<span class="chev">&#9654;</span>' +
        "</button>" +
        (isOpen ? '<div class="body" data-body><p class="loading">Reading the sizes&hellip;</p></div>' : "") +
      "</div>"
    );
  }

  function sizesHtml(style, sizes) {
    const rows = [...sizes].sort(bySize).map((row) => {
      const custom = row.mode === "custom";

      return (
        '<tr data-id="' + row.id + '">' +
          '<td class="sizecell">' + esc(row.size) + "</td>" +
          '<td class="num hide">' + esc(euro(row.price)) + "</td>" +
          "<td>" +
            '<select class="select mode" data-mode>' +
              '<option value="auto"' + (custom ? "" : " selected") + ">Auto</option>" +
              '<option value="custom"' + (custom ? " selected" : "") + ">Custom</option>" +
            "</select>" +
          "</td>" +
          "<td>" +
            '<input class="input amount" type="number" step="0.01" min="0" placeholder="Price" data-amount' +
              ' value="' + (custom && row.custom_price ? row.custom_price : "") + '"' +
              (custom ? "" : " disabled") + ">" +
          "</td>" +
          '<td><button class="btn" type="button" data-save disabled>Save</button></td>' +
          '<td class="fill"></td>' +
        "</tr>"
      );
    }).join("");

    return (
      '<div class="all">' +
        '<span class="label">All ' + style.pairs + " sizes:</span>" +
        '<select class="select mode" data-all-mode>' +
          '<option value="custom">Custom</option>' +
          '<option value="auto">Auto</option>' +
        "</select>" +
        '<input class="input amount" type="number" step="0.01" min="0" placeholder="Price" data-all-amount>' +
        '<button class="btn" type="button" data-all-save>Apply to this shoe</button>' +
      "</div>" +
      "<table>" +
        "<thead><tr>" +
          "<th>Size</th>" +
          '<th class="num hide">In your shop</th>' +
          "<th>Priced by</th><th>Your price</th><th></th>" +
          '<th class="fill"></th>' +
        "</tr></thead>" +
        "<tbody>" + rows + "</tbody>" +
      "</table>"
    );
  }

  function paint(sku) {
    const card = document.querySelector('.style[data-sku="' + CSS.escape(sku) + '"]');
    const body = card && card.querySelector("[data-body]");
    const style = styles.find((row) => row.sku === sku);

    if (!body || !style) return;

    body.innerHTML = sizesHtml(style, sizesBySku.get(sku) || []);
  }

  function draw() {
    const only = $("only").value;

    const shown = styles.filter((style) =>
      only === "custom" ? style.custom_pairs > 0
      : only === "auto" ? style.custom_pairs < style.pairs
      : true
    );

    $("count").textContent = shown.length
      ? shown.length + (shown.length === 1 ? " shoe · " : " shoes · ") +
        shown.reduce((sum, style) => sum + style.pairs, 0) + " sizes"
      : "";

    $("rows").innerHTML = shown.length
      ? shown.map(styleHtml).join("")
      : '<p class="empty">' +
        ($("search").value.trim() || only
          ? "Nothing of ours matches that."
          : "Nothing of ours is in your shop yet. It appears here once we have supplied a pair.") +
        "</p>";

    for (const sku of open) if (sizesBySku.has(sku)) paint(sku);
  }

  async function openStyle(sku) {
    open.add(sku);
    draw();

    if (sizesBySku.has(sku)) return;

    const query = new URLSearchParams({ merchant_id: store.id, sku });

    try {
      const answer = await fetch("/api/listings/sizes?" + query).then((r) => r.json());

      if (!answer.ok) throw new Error(answer.error || "Could not read the sizes.");

      sizesBySku.set(sku, answer.sizes || []);

      if (open.has(sku)) paint(sku);
    } catch (err) {
      const body = document.querySelector('.style[data-sku="' + CSS.escape(sku) + '"] [data-body]');

      if (body) body.innerHTML = '<p class="problem">' + esc(err.message) + "</p>";
    }
  }

  async function load() {
    if (!store?.id) {
      $("rows").innerHTML = '<p class="problem">Sign in to the portal first, then come back to this page.</p>';
      return;
    }

    const query = new URLSearchParams({ merchant_id: store.id });
    const search = $("search").value.trim();

    if (search) query.set("search", search);

    try {
      const answer = await fetch("/api/listings?" + query).then((r) => r.json());

      if (!answer.ok) throw new Error(answer.error || "Could not read your shelf.");

      styles = answer.styles || [];
      sizesBySku.clear();
      open.clear();

      $("note").hidden = !styles.length;

      // With Price Sync off we never touch this shop's prices, so a custom
      // one would be a number nobody reads.
      $("note").textContent = answer.price_sync
        ? "A price you set here reaches your shop on the next pass, within half an hour."
        : "Lojiq does not set prices for this shop, so these are yours to change in Shopify. A price here would not be used.";

      draw();
    } catch (err) {
      $("rows").innerHTML = '<p class="problem">' + esc(err.message) + "</p>";
    }
  }

  /* Saving, for one size or for the whole shoe. The shelf is read again
     afterwards so the range on the closed line is never a stale number, and
     whatever was open is opened again. */
  async function save(payload, button, done) {
    button.disabled = true;

    try {
      const answer = await fetch("/api/listings/price", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ merchant_id: store.id, ...payload })
      }).then((r) => r.json());

      if (!answer.ok) throw new Error(answer.error || "Could not save that.");

      say(done(answer));

      const reopen = [...open];

      await load();

      for (const sku of reopen) await openStyle(sku);
    } catch (err) {
      say(err.message);
      button.disabled = false;
    }
  }

  $("rows").addEventListener("click", async (event) => {
    const head = event.target.closest(".head");

    if (head) {
      const sku = head.closest(".style").dataset.sku;

      if (open.has(sku)) { open.delete(sku); draw(); } else { await openStyle(sku); }

      return;
    }

    const card = event.target.closest(".style");
    if (!card) return;

    const sku = card.dataset.sku;
    const all = event.target.closest("[data-all-save]");

    if (all) {
      const mode = card.querySelector("[data-all-mode]").value;
      const amount = card.querySelector("[data-all-amount]").value;

      if (mode === "custom" && !(Number(amount) > 0)) {
        say("What should this shoe cost?");
        card.querySelector("[data-all-amount]").focus();
        return;
      }

      await save(
        { sku, mode, price: Number(amount) },
        all,
        (answer) => (mode === "custom" ? "Saved on " : "Back to Lojiq pricing on ") +
          answer.changed + (answer.changed === 1 ? " size." : " sizes.")
      );

      return;
    }

    const one = event.target.closest("[data-save]");
    if (!one) return;

    const row = one.closest("tr");
    const mode = row.querySelector("[data-mode]").value;
    const amount = row.querySelector("[data-amount]").value;

    if (mode === "custom" && !(Number(amount) > 0)) {
      say("What should this size cost?");
      row.querySelector("[data-amount]").focus();
      return;
    }

    await save(
      { id: Number(row.dataset.id), mode, price: Number(amount) },
      one,
      () => mode === "custom" ? "Saved. Your shop has it within half an hour." : "Back to Lojiq pricing."
    );
  });

  /* Switching to Custom only opens the field; nothing is saved until the
     shop says what the price is. */
  $("rows").addEventListener("change", (event) => {
    const mode = event.target.closest("[data-mode]");
    if (!mode) return;

    const row = mode.closest("tr");
    if (!row) return;

    const custom = mode.value === "custom";

    row.querySelector("[data-amount]").disabled = !custom;
    row.querySelector("[data-save]").disabled = false;

    if (custom) row.querySelector("[data-amount]").focus();
  });

  $("rows").addEventListener("input", (event) => {
    const row = event.target.closest("tr");

    if (row && event.target.closest("[data-amount]")) row.querySelector("[data-save]").disabled = false;
  });

  $("search").addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(load, 250);
  });

  $("only").addEventListener("change", draw);

  load();
</script>
</body>
</html>

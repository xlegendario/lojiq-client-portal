<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lojiq Portal - Shop</title>
<link rel="icon" href="/logo.png">
<style>
  /* The palette is the portal's, value for value. A second page that drifts
     a shade off reads as a different product. */
  :root {
    --bg: #08080A;
    --bg-rgb: 8, 8, 10;

    --panel: #121215;
    --panel-rgb: 18, 18, 21;

    --panel-2: #17171B;
    --panel-2-rgb: 23, 23, 27;

    --border: #26262B;
    --border-rgb: 38, 38, 43;

    --text: #E9E9EE;
    --text-rgb: 233, 233, 238;

    --muted: #8B8B95;
    --muted-rgb: 139, 139, 149;

    --nav-item: #A8A8AF;

    --primary: #2F80ED;
    --primary-rgb: 47, 128, 237;

    --primary-soft: #66B3FF;
    --primary-soft-rgb: 102, 179, 255;

    --green: #16B364;
    --green-rgb: 22, 179, 100;

    --red: #F04438;
    --red-rgb: 240, 68, 56;

    --warning: #F59E0B;
    --warning-rgb: 245, 158, 11;

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
  }

  /* ---- top bar ------------------------------------------------------ */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;

    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(var(--bg-rgb), 0.72);

    position: sticky;
    top: 0;
    z-index: 20;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .logo-img { width: 122px; height: auto; display: block; }

  .topbar-title { font-size: 17px; font-weight: 900; letter-spacing: -0.2px; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
  }

  .store-name { font-size: 13px; font-weight: 800; color: var(--muted); }

  .btn {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 9px 15px;
    font-size: 12.5px;
    font-weight: 900;
    color: #fff;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;

    transition: box-shadow 0.18s ease, transform 0.12s ease, filter 0.18s ease;
  }

  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-soft));
    box-shadow: 0 4px 16px rgba(var(--primary-rgb), 0.32);
  }

  .btn.green {
    background: var(--green);
    box-shadow: 0 4px 16px rgba(var(--green-rgb), 0.26);
  }

  .btn.ghost {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn.primary:hover { box-shadow: 0 6px 22px rgba(var(--primary-rgb), 0.44); }
  .btn.green:hover { box-shadow: 0 6px 22px rgba(var(--green-rgb), 0.36); }

  .btn.primary:hover, .btn.green:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
  }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ---- toolbar ------------------------------------------------------ */

  .page { padding: 20px 22px 40px; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .search {
    flex: 1 1 260px;
    min-width: 0;
    height: 42px;
    padding: 0 14px;

    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);

    font-size: 14px;
    font-weight: 700;
    outline: none;
  }

  .search:focus,
  select:focus {
    border-color: var(--primary-soft);
    box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.18);
  }

  select {
    height: 42px;
    padding: 0 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    outline: none;
    cursor: pointer;
  }

  .segment { display: flex; gap: 6px; }

  .segment button {
    height: 42px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
  }

  .segment button.active {
    border-color: var(--primary);
    background: rgba(var(--primary-rgb), 0.18);
    color: #fff;
  }

  .count-line { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }

  /* ---- action summary ------------------------------------------------- */

  /* Label left, value right, one line each - the same shape the Kickz
     Caviar buying page uses, so a store that knows one portal reads the
     other without relearning it. */
  .action-summary {
    margin: 4px 0 16px;
    border-top: 1px solid var(--border);
  }

  .action-summary > div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;

    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .action-summary span {
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    white-space: nowrap;
  }

  .action-summary strong {
    font-size: 13.5px;
    font-weight: 900;
    text-align: right;
    min-width: 0;
  }

  /* ---- hero + post a want to buy -------------------------------------- */

  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    margin-bottom: 24px;
  }

  .hero-text { min-width: 0; }

  .hero-title {
    font-size: 34px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.8px;
    margin: 0 0 10px;
    text-wrap: balance;
  }

  .hero-line { font-size: 14px; color: var(--muted); font-weight: 700; margin: 0; }

  @media (max-width: 860px) {
    .hero { flex-direction: column; align-items: stretch; gap: 18px; }
    .hero-title { font-size: 26px; }
  }

  /* Sat in the toolbar first, where it read as a fourth filter. A store
     that cannot find something is about to leave, so this is the one thing
     on the page that has to catch the eye before the search box does. */
  .wtb-card {
    display: flex;
    align-items: center;
    gap: 16px;

    flex: none;
    max-width: 420px;

    padding: 16px 18px;

    border: 1px solid rgba(var(--primary-rgb), 0.45);
    border-radius: 16px;
    background:
      linear-gradient(135deg, rgba(var(--primary-rgb), 0.14), rgba(var(--panel-rgb), 0.9));
    box-shadow: 0 4px 22px rgba(var(--primary-rgb), 0.14);
  }

  .wtb-card-title {
    font-size: 19px;
    font-weight: 900;
    color: var(--primary-soft);
    letter-spacing: -0.2px;
    margin-bottom: 3px;
  }

  .wtb-card-line { font-size: 12.5px; color: var(--muted); font-weight: 700; line-height: 1.5; }

  .wtb-card-button {
    flex: none;
    width: 46px;
    height: 46px;

    border: none;
    border-radius: 12px;
    cursor: pointer;

    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    color: #fff;

    background: linear-gradient(135deg, var(--primary), var(--primary-soft));
    box-shadow: 0 4px 16px rgba(var(--primary-rgb), 0.34);

    transition: box-shadow 0.18s ease, transform 0.12s ease, filter 0.18s ease;
  }

  .wtb-card-button:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(var(--primary-rgb), 0.46);
  }

  @media (max-width: 560px) {
    .wtb-card { padding: 14px; gap: 12px; }
    .wtb-card-title { font-size: 17px; }
  }

  /* ---- product grid -------------------------------------------------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--panel);
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    padding: 0;
    color: inherit;
    font: inherit;

    display: flex;
    flex-direction: column;

    transition: border-color 0.18s ease, transform 0.12s ease;
  }

  .card:hover { border-color: rgba(var(--primary-soft-rgb), 0.45); transform: translateY(-2px); }

  .card-image {
    aspect-ratio: 4 / 3;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-image img { width: 100%; height: 100%; object-fit: contain; }

  .card-body { padding: 12px 13px 14px; display: flex; flex-direction: column; gap: 3px; flex: 1; }

  .card-name {
    font-size: 13px;
    font-weight: 900;
    line-height: 1.28;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta { font-size: 11.5px; color: var(--muted); font-weight: 700; }

  .card-foot {
    margin-top: auto;
    padding-top: 9px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
  }

  .card-price { font-size: 15px; font-weight: 900; }
  .card-from { font-size: 10px; color: var(--muted); font-weight: 800;
               text-transform: uppercase; letter-spacing: 0.06em; }
  .card-sizes { font-size: 11.5px; color: var(--muted); font-weight: 700; }

  .state {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
  }

  /* ---- modal --------------------------------------------------------- */

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.72);

    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 22px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .backdrop.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 560px;
    margin: auto;

    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
    padding: 20px;
  }

  .modal-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }

  .modal-thumb {
    width: 76px; height: 76px; flex: none;
    border-radius: 12px; background: #fff; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  .modal-thumb img { width: 100%; height: 100%; object-fit: contain; }

  .modal-title { font-size: 15px; font-weight: 900; line-height: 1.3; }
  .modal-sub { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 4px; }

  .size-row {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 11px 0;
    border-bottom: 1px solid rgba(var(--muted-rgb), 0.14);
  }

  .size-row:last-child { border-bottom: none; }

  .size-name { width: 66px; flex: none; font-size: 14px; font-weight: 900; }

  .size-meta { flex: 1; min-width: 0; font-size: 11.5px; color: var(--muted); font-weight: 700; }

  .size-price { font-size: 14px; font-weight: 900; margin-right: 4px; white-space: nowrap; }

  .size-actions { display: flex; gap: 6px; flex: none; }

  .size-actions .btn { padding: 8px 12px; font-size: 11.5px; border-radius: 9px; }

  .modal-close {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
  }

  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  .field {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-weight: 800;
    outline: none;
  }

  .note {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    margin: 12px 0 0;
  }

  .error { color: #ff9b95; font-size: 12.5px; font-weight: 800; margin-top: 12px; min-height: 1em; }
  .ok { color: #83e6ad; font-size: 12.5px; font-weight: 800; margin-top: 12px; }

  @media (max-width: 768px) {
    .page { padding: 14px 12px 34px; }
    .topbar { padding: 12px 14px; }
    .logo-img { width: 96px; }
    .topbar-title { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .size-row { flex-wrap: wrap; }
    .size-meta { order: 3; width: 100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <img src="/logo.png" alt="Lojiq" class="logo-img">
    <div class="topbar-title">Shop</div>
  </div>

  <div class="topbar-right">
    <span class="store-name" id="storeName"></span>
    <a class="btn ghost" href="/portal">Back to orders</a>
  </div>
</header>

<main class="page">
  <div class="hero">
    <div class="hero-text">
      <h1 class="hero-title">Buy stock directly from the Lojiq network</h1>
      <p class="hero-line">Browse available stock, view sizes and source inventory for your business.</p>
    </div>

    <div class="wtb-card">
      <div style="flex:1; min-width:0">
        <div class="wtb-card-title">Post WTBs</div>
        <div class="wtb-card-line">Looking for a specific pair?</div>
        <div class="wtb-card-line">Receive offers directly from sellers.</div>
      </div>

      <button type="button" class="wtb-card-button" id="wtbOpen" aria-label="Post a want to buy">+</button>
    </div>
  </div>

  <div class="toolbar">
    <input id="search" class="search" type="text" placeholder="Search SKU or product..." autocomplete="off" spellcheck="false">

    <select id="brand"><option value="">All brands</option></select>

    <select id="size">
      <option value="">All sizes</option>
    </select>

    <select id="sort">
      <option value="price_low">Price: low to high</option>
      <option value="price_high">Price: high to low</option>
      <option value="az">Name: A-Z</option>
      <option value="za">Name: Z-A</option>
    </select>

    <div class="segment" id="inventoryType">
      <button type="button" data-type="all" class="active">All stock</button>
      <button type="button" data-type="b2b">B2B only</button>
      <button type="button" data-type="private">Margin only</button>
    </div>
  </div>

  <div class="count-line" id="countLine"></div>

  <div class="grid" id="grid"></div>
  <div class="state" id="state" hidden></div>
</main>

<div class="backdrop" id="productBackdrop">
  <div class="modal" id="productModal"></div>
</div>

<div class="backdrop" id="actionBackdrop">
  <div class="modal" id="actionModal"></div>
</div>

<script>
  // ---- session ------------------------------------------------------

  let merchant = null;

  (function requireLogin() {
    const raw = localStorage.getItem("lojiq_merchant");

    if (!raw) {
      window.location.href = "/";
      return;
    }

    merchant = JSON.parse(raw);

    // Same rule the server enforces. Only bounce when we POSITIVELY know
    // this is an API store: a merchant stored before order_intake was part
    // of the login response has no such field, and locking those stores out
    // of a page they are entitled to would be worse than letting the server
    // answer for them.
    if (merchant.order_intake && merchant.order_intake !== "manual") {
      window.location.href = "/portal";
      return;
    }

    document.getElementById("storeName").textContent =
      merchant.store_name || merchant.portal_email || "Merchant";
  })();

  // ---- state --------------------------------------------------------

  const grid = document.getElementById("grid");
  const state = document.getElementById("state");
  const countLine = document.getElementById("countLine");
  const searchInput = document.getElementById("search");
  const brandSelect = document.getElementById("brand");
  const sizeSelect = document.getElementById("size");
  const sortSelect = document.getElementById("sort");

  let products = [];
  let inventoryType = "all";
  let loadSequence = 0;

  function escapeHtml(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Whole amounts stay whole; decimals show only when the number really has
  // them. Same rule as the portal, so a price reads the same in both.
  function money(value) {
    const n = Number(value);

    if (!Number.isFinite(n)) return "";

    const isWhole = Math.abs(n - Math.round(n)) < 0.005;

    return new Intl.NumberFormat("nl-NL", {
      style: "currency",
      currency: "EUR",
      minimumFractionDigits: isWhole ? 0 : 2,
      maximumFractionDigits: isWhole ? 0 : 2
    }).format(n);
  }

  // A size in the product list carries the lowest offer across its sources:
  // lowest_price, not price. The per-source fields sit one level deeper -
  // reading those here would show a price nobody is asking.

  // How many sources answer for this size.
  //
  // CHANGED - this read size.sources.length. That array was 72% of the
  // whole feed, 2.19 MB of 3.06, and this count was the only thing anyone
  // ever did with it. KC now sends the number instead of the array.
  //
  // The fallback keeps both shapes working, so the two services can be
  // deployed in either order without a gap where the count reads zero.
  //
  // Note this is NOT size.source_count, which is also in the feed and
  // counts groups rather than entries; the two differ on some sizes. This
  // keeps showing exactly the number that was shown before.
  function sourceCount(size) {
    if (Number.isFinite(size.source_entry_count)) return size.source_entry_count;

    return (size.sources || []).length;
  }
  function sizePrice(size) {
    return size.lowest_price ?? size.display_price ?? size.price;
  }

  // The VAT type of a size is deliberately NOT shown, matching the Kickz
  // Caviar buying page.
  //
  // It describes the current lowest source, not what ends up filling the
  // deal: an offer on All inventory goes to every matching source and a
  // Margin seller can take it, leaving the row's "VAT21" a promise nobody
  // made. And since prices are now restated into the buying store's own
  // scale, the source's VAT type is no longer needed to read the number -
  // which is the only thing it was ever there for.

  function showState(text) {
    grid.innerHTML = "";
    state.hidden = false;
    state.textContent = text;
  }

  // ---- loading ------------------------------------------------------

  async function loadProducts() {
    const sequence = ++loadSequence;

    showState("Searching stock...");
    countLine.textContent = "";

    const params = new URLSearchParams({
      merchant_id: merchant.id,
      inventory_type: inventoryType,
      sort: sortSelect.value
    });

    if (searchInput.value.trim()) params.set("search", searchInput.value.trim());
    if (brandSelect.value) params.set("brand", brandSelect.value);

    try {
      const response = await fetch("/api/shop/products?" + params.toString());
      const data = await response.json();

      // A slow answer to an old keystroke must not overwrite a newer one.
      if (sequence !== loadSequence) return;

      if (!response.ok) {
        showState(data.error || "Could not load stock");
        return;
      }

      products = Array.isArray(data.products) ? data.products : [];
      fillSizeOptions();
      render();
    } catch (err) {
      if (sequence !== loadSequence) return;
      showState("Could not load stock");
    }
  }

  async function loadBrands() {
    try {
      const response = await fetch(
        "/api/shop/brands?merchant_id=" + encodeURIComponent(merchant.id)
      );

      if (!response.ok) return;

      const data = await response.json();
      const brands = Array.isArray(data.brands) ? data.brands : [];

      brands.filter(Boolean).sort().forEach((merk) => {
        const option = document.createElement("option");
        option.value = merk;
        option.textContent = merk;
        brandSelect.appendChild(option);
      });
    } catch (err) {
      // A missing brand list is not worth an error on screen; the filter
      // simply stays on "All brands".
    }
  }

  // ---- rendering ----------------------------------------------------

  // Sizes sort numerically, not alphabetically. Sorted as text you get
  // 37 1/3 before 37.5 and 4 before 37, which reads as a bug to anyone
  // scanning for their size.
  //
  // 37.5 and 37 1/3 stay separate on purpose: those are Nike's scale and
  // adidas's scale, not two spellings of one size. A shop looking for a
  // specific pair wants the label that pair actually carries.
  function sizeOrder(size) {
    const text = String(size);
    const whole = parseFloat(text) || 0;

    const fraction = text.match(/(\d+)\s*\/\s*(\d+)/);
    const extra = fraction ? Number(fraction[1]) / Number(fraction[2]) : 0;

    // A fraction written after a whole number (37 1/3) adds to it; a bare
    // fraction is the whole value itself.
    return /^\s*\d+\s*\/\s*\d+\s*$/.test(text) ? extra : whole + extra;
  }

  function fillSizeOptions() {
    const chosen = sizeSelect.value;
    const seen = new Set();

    products.forEach((product) => {
      (product.sizes || []).forEach((item) => {
        if (item && item.size) seen.add(String(item.size));
      });
    });

    const sorted = [...seen].sort((a, b) => sizeOrder(a) - sizeOrder(b) || a.localeCompare(b));

    sizeSelect.innerHTML = '<option value="">All sizes</option>';

    sorted.forEach((size) => {
      const option = document.createElement("option");
      option.value = size;
      option.textContent = size;
      sizeSelect.appendChild(option);
    });

    // Keep the shop's choice across a reload when that size still exists.
    if (chosen && seen.has(chosen)) sizeSelect.value = chosen;
  }

  function visibleProducts() {
    const size = sizeSelect.value;

    if (!size) return products;

    return products.filter((product) =>
      (product.sizes || []).some((item) => String(item.size) === size)
    );
  }

  function render() {
    const shown = visibleProducts();

    if (!shown.length) {
      showState(sizeSelect.value
        ? "No stock in size " + sizeSelect.value
        : "No stock matches this search");
      return;
    }

    state.hidden = true;
    countLine.textContent =
      shown.length + (shown.length === 1 ? " product" : " products");

    grid.innerHTML = shown.map((product, index) => `
      <button class="card" type="button" data-index="${index}">
        <div class="card-image">
          ${product.image_url
            ? `<img src="${escapeHtml(product.image_url)}" alt="" loading="lazy">`
            : ""}
        </div>

        <div class="card-body">
          <div class="card-name">${escapeHtml(product.product_name || product.sku)}</div>

    // field itself rather than in a footnote nobody reads.
    const sources = sourceCount(size);
    const scale = inventoryType === "b2b" ? "excl. VAT" : "incl. VAT";

    actionModal.innerHTML = `

        <div><span>Size</span><strong>${escapeHtml(size.size || "-")}</strong></div>
        <div>
          <span>${isBuy ? "Buy now price" : "Current lowest price"}</span>

        </div>
        <div><span>Buying type</span><strong>${typeLabel}</strong></div>
        <div><span>Available sources</span><strong>${sources || "-"}</strong></div>
      </div>

      ${isBuy ? `

        <label class="field-label" for="offerPrice">Your offer</label>

        <p class="note">
          ${sources > 1 ? "Your offer goes to all matching sources." : "Your offer goes to the matching source."}
          ${inventoryType === "all"
            ? "If it matches a B2B seller the invoice amount is recalculated as a VAT0 price."
            : ""}
        </p>
      `}

      <div class="error" id="actionError"></div>

      <div style="display:flex; gap:8px; margin-top:14px">
        <button class="btn ghost" type="button" data-close style="flex:1">Cancel</button>
        <button class="btn ${isBuy ? "green" : "primary"}" type="button" id="confirmAction" style="flex:1">
          ${isBuy ? "Place order" : "Send offer"}
        </button>
      </div>
    `;

    actionBackdrop.classList.add("open");

    document.getElementById("confirmAction").addEventListener("click", async (event) => {
      const button = event.currentTarget;

        merchant_id: merchant.id,
        sku: selectedProduct.sku,

  actionBackdrop.addEventListener("click", (event) => {
    if (event.target === actionBackdrop || event.target.closest("[data-close]")) {
      actionBackdrop.classList.remove("open");
    }
  });

  // ---- filters -------------------------------------------------------

  let typingTimer = null;

  searchInput.addEventListener("input", () => {
    clearTimeout(typingTimer);
    typingTimer = setTimeout(loadProducts, 300);
  });

  brandSelect.addEventListener("change", loadProducts);
  sortSelect.addEventListener("change", loadProducts);

  // Filtering by size happens in the browser: the feed already carries
  // every size per product, so a round trip would only add a wait.
  sizeSelect.addEventListener("change", render);

  // ---- want to buy ---------------------------------------------------

  // The VAT profile of this store, so an amount they type can be read back
  // to them in both scales. Falls back to Dutch rates if it cannot be
  // fetched - the wording then still makes sense for most stores, and the
  // server decides the real number either way.
  let buyerContext = { vat_rate: 0.21, reverse_charge: false, country: "" };

  fetch("/api/shop/buyer?merchant_id=" + encodeURIComponent(merchant.id))
    .then((response) => (response.ok ? response.json() : null))
    .then((data) => { if (data) buyerContext = data; })
    .catch(() => {});

  // Which scale the store's number is read in - and nothing else.
  //
  // Deliberately carries no amounts: the same sentence then covers a single
  // request and a CSV of two hundred, where restating one figure is
  // impossible anyway. What a store can get wrong here is the scale, not
  // the arithmetic.
  function vatExplanation(type) {
    // Naming the buying type is the point: without it a store reads the
    // scale as a fact about us, and has no idea that the dropdown right
    // above is what decides it. With it, "that is not what I meant" has an
    // obvious next move.
    //
    // Not "maximum" either: a seller can counter above this and the store
    // can still accept, so calling it a ceiling would be a promise we do
    // not keep. It is the price they are putting up, nothing more.
    const label = type === "b2b"
      ? "B2B only"
      : type === "private"
        ? "Margin only"
        : "All inventory";

    if (type === "b2b") {
      return `With buying type <b>${label}</b>, your price is read as <b>excl. VAT</b>.`;
    }

    const base = `With buying type <b>${label}</b>, your price is read as <b>incl. VAT</b>.`;

    // Only All inventory can be filled from VAT stock. Margin only cannot:
    // margin-scheme goods are never reverse charged, so promising a VAT-free
    // invoice there would be wrong every single time.
    return buyerContext.reverse_charge && type !== "private"
      ? base + " If we fill it from VAT stock you'll be invoiced excl. VAT (reverse charge)."
      : base;
  }

  document.getElementById("wtbOpen").addEventListener("click", () => showWtbForm());

  // ---- want to buy: bulk ----------------------------------------------

  // Parsed in the browser and posted row by row, exactly as the Kickz
  // Caviar buying page does it. Nothing new on the server: every row goes
  // through the same /api/shop/wtb the single form uses, so the rules and
  // the wording can never drift between the two.
  function splitCsvLine(line, delimiter) {
    const out = [];
    let current = "";
    let quoted = false;

    for (let i = 0; i < line.length; i += 1) {
      const char = line[i];

      if (char === '"' && quoted && line[i + 1] === '"') {
        current += '"';
        i += 1;
        continue;
      }

      if (char === '"') {
        quoted = !quoted;
        continue;
      }

      if (char === delimiter && !quoted) {
        out.push(current.trim());
        current = "";
        continue;
      }

      current += char;
    }

    out.push(current.trim());
    return out;
  }

  function parseWtbCsv(text) {
    const lines = String(text || "")
      .replace(/\r/g, "")
      .split("\n")
      .map((line) => line.trim())
      .filter(Boolean);

    if (lines.length < 2) {
      throw new Error("The file needs a header row and at least one request.");
    }

    // Excel in some locales writes semicolons. Taking whichever separator
    // appears more often in the header beats telling a shop its file is
    // broken when it is only continental.
    const delimiter = (lines[0].match(/;/g) || []).length >
                      (lines[0].match(/,/g) || []).length ? ";" : ",";

    const headers = splitCsvLine(lines[0], delimiter)
      .map((h) => String(h || "").replace(/^﻿/, "").trim().toLowerCase());

    const missing = ["sku", "size", "max price"].filter((c) => !headers.includes(c));

    if (missing.length) {
      throw new Error(`Missing columns: ${missing.join(", ")}. Use the template below.`);
    }

    const at = (name) => headers.indexOf(name);

    const rows = lines.slice(1).map((line, index) => {
      const values = splitCsvLine(line, delimiter);

      return {
        row_number: index + 2,
        sku: String(values[at("sku")] || "").trim().toUpperCase(),
        size: String(values[at("size")] || "")
          .trim()
          .replace(/,/g, ".")
          .replace(/\s+/g, " ")
          .toUpperCase(),
        // Blank stays blank: Number("") is 0, which would read an empty
        // cell as a ceiling of zero and refuse the file.
        max_price: (() => {
          const text = String(values[at("max price")] ?? "").trim();
          return text === "" ? null : Number(text.replace(/[^\d]/g, ""));
        })()
      };
    });

    // Same three rules as the single form, so a file is judged the way a
    // typed request is. The server checks them again regardless.
    const problems = [];

    rows.forEach((row) => {
      if (!/^[A-Z0-9-]+$/.test(row.sku)) {
        problems.push(`Row ${row.row_number}: a SKU can only contain letters, numbers and hyphens`);
      }

      if (!/^[A-Z0-9./ -]+$/.test(row.size) || !/[A-Z0-9]/.test(row.size)) {
        problems.push(`Row ${row.row_number}: "${row.size}" is not a valid size`);
      }

      if (row.max_price !== null && (!Number.isInteger(row.max_price) || row.max_price <= 0)) {
        problems.push(`Row ${row.row_number}: price must be a whole number above 0, or left empty`);
      }
    });

    return { rows, problems };
  }

  function showWtbForm(values) {
    const filled = values || {};

    actionModal.innerHTML = `
      <div class="modal-title">Post Want To Buys</div>

      <div class="modal-sub" style="margin-bottom:14px">
        Choose how you want to post your WTB.
      </div>

      <div class="segment" style="margin-bottom:16px">
        <button type="button" class="active" data-wtb-mode="single" style="flex:1">One request</button>
        <button type="button" data-wtb-mode="csv" style="flex:1">Upload CSV</button>
      </div>

      <label class="field-label" for="wtbSku">SKU</label>
      <input id="wtbSku" class="field" type="text" placeholder="Example: DV1748-601"
             value="${escapeHtml(filled.sku || "")}">

      <label class="field-label" for="wtbSize" style="margin-top:10px">Size</label>
      <input id="wtbSize" class="field" type="text" placeholder="Example: 42"
             value="${escapeHtml(filled.size || "")}">

      <label class="field-label" for="wtbPrice" style="margin-top:10px">Your price <span style="opacity:.55;font-weight:600;text-transform:none">optional</span></label>
      <input id="wtbPrice" class="field" type="text" inputmode="numeric" placeholder="Leave empty for no ceiling"
             value="${escapeHtml(filled.price || "")}">

      <label class="field-label" for="wtbType" style="margin-top:10px">Buying type</label>
      <select id="wtbType" class="field">
        <option value="all">All inventory</option>
        <option value="b2b">B2B only</option>
        <option value="private">Margin only</option>
      </select>

      <p class="note" id="wtbNote"></p>

      <div class="error" id="actionError"></div>

      <div style="display:flex; gap:8px; margin-top:14px">
        <button class="btn ghost" type="button" data-close style="flex:1">Cancel</button>
        <button class="btn primary" type="button" id="wtbNext" style="flex:1">Continue</button>
      </div>
    `;

    actionBackdrop.classList.add("open");

    const priceInput = document.getElementById("wtbPrice");
    const skuInput = document.getElementById("wtbSku");
    const sizeInput = document.getElementById("wtbSize");
    const typeSelect = document.getElementById("wtbType");
    const note = document.getElementById("wtbNote");

    // Prefilled with whatever the shop is browsing, because that is almost
    // always what they want - but changeable, because posting a want-to-buy
    // is a separate decision from what you happen to be looking at.
    typeSelect.value = filled.type || inventoryType;

    // Shown before anything is typed, not after: which scale you are in is
    // something you want to know while filling the field in.
    note.innerHTML = vatExplanation(typeSelect.value);

    // The scale changes with the type, so the line has to move with it.
    typeSelect.addEventListener("change", () => {
      note.innerHTML = vatExplanation(typeSelect.value);
    });

    // Kept clean while typing rather than rejected afterwards. A store that
    // pastes a SKU with a stray space should not be told off for it; the
    // character simply never lands. The server checks the same rules again,
    // because a filtered field is a convenience and not a guard.
    function keepOnly(input, allowed) {
      input.addEventListener("input", () => {
        const cleaned = input.value.replace(allowed, "");
        if (cleaned !== input.value) {
          const at = input.selectionStart - (input.value.length - cleaned.length);
          input.value = cleaned;
          input.setSelectionRange(at, at);
        }
      });
    }

    keepOnly(skuInput, /[^A-Za-z0-9-]/g);
    keepOnly(sizeInput, /[^A-Za-z0-9./ -]/g);
    keepOnly(priceInput, /[^0-9]/g);

    // Spaces belong inside a size (37 1/3), never around it.
    sizeInput.addEventListener("blur", () => {
      sizeInput.value = sizeInput.value
        .trim()
        .replace(/,/g, ".")
        .replace(/\s+/g, " ")
        .toUpperCase();
    });

    skuInput.addEventListener("blur", () => {
      skuInput.value = skuInput.value.trim().toUpperCase();
    });

    document.getElementById("wtbNext").addEventListener("click", () => {
      const sku = skuInput.value.trim().toUpperCase();
      const size = sizeInput.value.trim().replace(/,/g, ".").replace(/\s+/g, " ").toUpperCase();
      // A ceiling is optional. Empty means every offer reaches you and you
      // negotiate it down; a typed value still has to be usable.
      const rawAmount = priceInput.value.trim();
      const amount = rawAmount === "" ? null : Number(rawAmount);
      const failure = document.getElementById("actionError");

      if (!sku || !size) {
        failure.textContent = "Fill in both a SKU and a size.";
        return;
      }

      if (!/[A-Z0-9]/.test(size)) {
        failure.textContent = "Enter a size. For example 42, 42.5, 37 1/3 or M.";
        return;
      }

      if (amount !== null && (!Number.isInteger(amount) || amount <= 0)) {
        failure.textContent = "A price must be a whole number above 0, or left empty.";
        return;
      }

      confirmWtb({ sku, size, price: String(priceInput.value), amount, type: typeSelect.value });
    });

    actionModal.querySelector('[data-wtb-mode="csv"]')
      .addEventListener("click", () => showWtbCsvForm(typeSelect.value));
  }

  function showWtbCsvForm(chosenType) {
    let parsed = null;

    actionModal.innerHTML = `
      <div class="modal-title">Post Want To Buys</div>

      <div class="modal-sub" style="margin-bottom:14px">
        Choose how you want to post your WTB.
      </div>

      <div class="segment" style="margin-bottom:16px">
        <button type="button" data-wtb-mode="single" style="flex:1">One request</button>
        <button type="button" class="active" data-wtb-mode="csv" style="flex:1">Upload CSV</button>
      </div>

      <label class="field-label" for="wtbCsvType">Buying type</label>
      <select id="wtbCsvType" class="field">
        <option value="all">All inventory</option>
        <option value="b2b">B2B only</option>
        <option value="private">Margin only</option>
      </select>

      <p class="note" id="wtbCsvNote"></p>

      <label class="field-label" for="wtbCsvFile" style="margin-top:10px">CSV file</label>
      <input id="wtbCsvFile" class="field" type="file" accept=".csv,text/csv">

      <p class="note">
        Columns: <b>SKU</b>, <b>Size</b>, <b>Max Price</b>. Leave Max Price empty on any row you do not want a ceiling on.
        <a href="/templates/member-wtb-template.csv" download>Download the template</a>.
      </p>

      <div class="error" id="actionError"></div>

      <div style="display:flex; gap:8px; margin-top:14px">
        <button class="btn ghost" type="button" data-close style="flex:1">Cancel</button>
        <button class="btn primary" type="button" id="wtbCsvSend" style="flex:1" disabled>Upload</button>
      </div>
    `;

    actionBackdrop.classList.add("open");

    const typeSelect = document.getElementById("wtbCsvType");
    const note = document.getElementById("wtbCsvNote");
    const fileInput = document.getElementById("wtbCsvFile");
    const sendButton = document.getElementById("wtbCsvSend");
    const failure = document.getElementById("actionError");

    typeSelect.value = chosenType || inventoryType;

    // The same sentence as the single form, with no amount in it - which is
    // exactly why it works here, where there are two hundred amounts.
    note.innerHTML = vatExplanation(typeSelect.value);

    typeSelect.addEventListener("change", () => {
      note.innerHTML = vatExplanation(typeSelect.value);
    });

    actionModal.querySelector('[data-wtb-mode="single"]')
      .addEventListener("click", () => showWtbForm({ type: typeSelect.value }));

    fileInput.addEventListener("change", async () => {
      failure.textContent = "";
      parsed = null;
      sendButton.disabled = true;
      sendButton.textContent = "Upload";

      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      try {
        parsed = parseWtbCsv(await file.text());
      } catch (err) {
        failure.textContent = err.message;
        return;
      }

      // Every problem at once. Fixing one, re-uploading and meeting the
      // next is what this replaces.
      if (parsed.problems.length) {
        const shown = parsed.problems.slice(0, 12);
        const rest = parsed.problems.length - shown.length;

        failure.innerHTML =
          `<b>${parsed.problems.length} problem${parsed.problems.length === 1 ? "" : "s"} in this file:</b><br>` +
          shown.map(escapeHtml).join("<br>") +
          (rest > 0 ? `<br>...and ${rest} more` : "");

        parsed = null;
        return;
      }

      sendButton.disabled = false;
      sendButton.textContent = `Upload ${parsed.rows.length} request${parsed.rows.length === 1 ? "" : "s"}`;
    });

    sendButton.addEventListener("click", async () => {
      if (!parsed) return;

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      failure.textContent = "";

      // The whole file goes over in one request and a background worker
      // posts the rows. Nothing to wait for, so the shop can close the tab
      // the moment this returns - and an interrupted import resumes instead
      // of leaving half a file behind with no record of where it stopped.
      try {
        const response = await fetch("/api/shop/wtb-csv", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            merchant_id: merchant.id,
            inventory_type: typeSelect.value,
            rows: parsed.rows
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || "Upload failed");
        }

        actionModal.innerHTML = `
          <div class="modal-title">${data.count} request${data.count === 1 ? "" : "s"} received</div>

          <p class="note">
            We are posting them now — you can close this window. They appear
            under Orders as they go out, and any offer that comes in appears
            there too.
          </p>

          <div style="display:flex; gap:8px; margin-top:14px">
            <a class="btn primary" href="/portal" style="flex:1">Go to orders</a>
            <button class="btn ghost" type="button" data-close style="flex:1">Close</button>
          </div>
        `;
      } catch (err) {
        // The server answers with every bad row at once, one per line.
        failure.innerHTML = String(err.message)
          .split(/\n/)
          .map(escapeHtml)
          .join("<br>");

        sendButton.disabled = false;
        sendButton.textContent = `Upload ${parsed.rows.length} request${parsed.rows.length === 1 ? "" : "s"}`;
      }
    });
  }

  // A deliberate second step. The amount means something different on B2B
  // only than on All stock, and different again for a store we invoice
  // without VAT - so it gets said out loud before anything is created.
  function confirmWtb(request) {
    actionModal.innerHTML = `
      <div class="modal-title">Is this right?</div>

      <p class="note" style="margin-top:14px">${
        request.amount === null
          ? "You did not set a price, so there is no ceiling on this request. Every offer reaches you and you decide what to accept or counter."
          : vatExplanation(request.type)
      }</p>

      <div class="error" id="actionError"></div>

      <div style="display:flex; gap:8px; margin-top:14px">
        <button class="btn ghost" type="button" id="wtbBack" style="flex:1">Back</button>
        <button class="btn primary" type="button" id="wtbConfirm" style="flex:1">Post request</button>
      </div>
    `;

    document.getElementById("wtbBack").addEventListener("click", () => showWtbForm(request));

    document.getElementById("wtbConfirm").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      const failure = document.getElementById("actionError");

      failure.textContent = "";
      button.disabled = true;
      button.textContent = "Posting...";

      try {
        const response = await fetch("/api/shop/wtb", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            merchant_id: merchant.id,
            sku: request.sku,
            size: request.size,
            max_price: request.amount,
            inventory_type: request.type
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || "Failed to post request");
        }

        actionModal.innerHTML = `
          <div class="modal-title">Request posted</div>

          <div class="modal-sub" style="margin-bottom:14px">
            ${escapeHtml(request.sku)} &middot; size ${escapeHtml(request.size)}
          </div>

          <p class="note">
            We are looking for it now. You will find it under Orders, and
            any offer that comes in appears there too.
          </p>

          <div style="display:flex; gap:8px; margin-top:14px">
            <a class="btn primary" href="/portal" style="flex:1">Go to orders</a>
            <button class="btn ghost" type="button" data-close style="flex:1">Close</button>
          </div>
        `;
      } catch (err) {
        failure.textContent = err.message;
        button.disabled = false;
        button.textContent = "Post request";
      }
    });
  }

  document.getElementById("inventoryType").addEventListener("click", (event) => {
    const button = event.target.closest("[data-type]");
    if (!button || button.dataset.type === inventoryType) return;

    inventoryType = button.dataset.type;

    document.querySelectorAll("#inventoryType button").forEach((b) => {
      b.classList.toggle("active", b.dataset.type === inventoryType);
    });

    loadProducts();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    actionBackdrop.classList.remove("open");
    productBackdrop.classList.remove("open");
  });

  loadBrands();
  loadProducts();
</script>

</body>
</html>

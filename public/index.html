<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lojiq Portal - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #07111F;
      --primary: #2F80ED;
      --primary-soft: #66B3FF;
      --text: #DCEBFF;
      --muted: #8FAECC;
      --panel: #0E2238;
      --border: #163252;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(47,128,237,0.18), transparent 30%),
        linear-gradient(180deg, #050D18 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: min(420px, calc(100% - 32px));
      background: linear-gradient(180deg, rgba(16,41,68,0.95), rgba(14,34,56,0.95));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-title {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .brand-logo {
      width: 240px;
      height: auto;
      display: block;
      transform: translateX(-6px);
    }

    .brand-subtitle {
      color: var(--muted);
      letter-spacing: 4px;
      font-size: 13px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .field-label {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(7,17,31,0.7);
      color: var(--text);
      padding: 15px;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(47,128,237,0.15);
    }

    .button {
      width: 100%;
      cursor: pointer;
      border-radius: 12px;
      border: none;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      color: white;
    }

    .forgot-btn {
      margin-top: 14px;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--primary-soft);
      font-weight: 800;
      cursor: pointer;
    }
    
    .forgot-btn:hover {
      text-decoration: underline;
    }

    .error {
      margin-top: 16px;
      color: #ff9b95;
      font-weight: 700;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-title">
        <img src="/logo.png" alt="Lojiq" class="brand-logo">
      </div>
      <div class="brand-subtitle">Merchant Portal</div>
    </div>

    <form id="loginForm">
      <div class="field-label">Email</div>
      <input id="emailInput" class="input" type="email" autocomplete="email" required />

      <div class="field-label">Password</div>
      <input id="passwordInput" class="input" type="password" autocomplete="current-password" required />

      <button class="button" type="submit">Login</button>
      <button id="forgotPasswordBtn" class="forgot-btn" type="button">Forgot password?</button>

      <div id="errorBox" class="error"></div>
    </form>

    <form id="forgotForm" style="display:none;">
      <div class="field-label">Email</div>
      <input id="forgotEmailInput" class="input" type="email" autocomplete="email" required />
    
      <button class="button" type="submit">Request password reset</button>
      <button id="backToLoginBtn" class="forgot-btn" type="button">Back to login</button>
    
      <div id="forgotMessageBox" class="error"></div>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const errorBox = document.getElementById("errorBox");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
    const forgotForm = document.getElementById("forgotForm");
    const forgotEmailInput = document.getElementById("forgotEmailInput");
    const backToLoginBtn = document.getElementById("backToLoginBtn");
    const forgotMessageBox = document.getElementById("forgotMessageBox");

    const existingMerchant = localStorage.getItem("lojiq_merchant");
    if (existingMerchant) {
      window.location.href = "/portal.html";
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      errorBox.style.display = "none";
      errorBox.textContent = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed");
        }

        localStorage.setItem("lojiq_merchant", JSON.stringify(data.merchant));
        window.location.href = "/portal.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });

    forgotPasswordBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
    
      forgotPasswordBtn.addEventListener("click", () => {
        loginForm.style.display = "none";
        forgotForm.style.display = "block";
      });
    
      try {
        const response = await fetch("/api/forgot-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        });
    
        const data = await response.json();
    
        if (!response.ok) {
          throw new Error(data.error || data.details || "Failed to send reset email");
        }
    
        errorBox.style.color = "#83e6ad";
        errorBox.textContent = "If this email exists, a reset link has been sent.";
        errorBox.style.display = "block";
      } catch (err) {
        errorBox.style.color = "#ff9b95";
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });

    backToLoginBtn.addEventListener("click", () => {
      forgotForm.style.display = "none";
      loginForm.style.display = "block";
    });
    
    forgotForm.addEventListener("submit", async (event) => {
      event.preventDefault();
    
      forgotMessageBox.style.display = "none";
      forgotMessageBox.textContent = "";
    
      try {
        const response = await fetch("/api/forgot-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: forgotEmailInput.value.trim()
          })
        });
    
        const data = await response.json();
    
        if (!response.ok) {
          throw new Error(data.error || data.details || "Failed to send reset email");
        }
    
        forgotMessageBox.style.color = "#83e6ad";
        forgotMessageBox.textContent = "If this email exists, a reset link has been sent.";
        forgotMessageBox.style.display = "block";
      } catch (err) {
        forgotMessageBox.style.color = "#ff9b95";
        forgotMessageBox.textContent = err.message;
        forgotMessageBox.style.display = "block";
      }
    });
  </script>
</body>
</html>

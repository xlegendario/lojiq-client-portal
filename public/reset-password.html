<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/brain.png">
  <meta charset="UTF-8" />
  <title>Lojiq Portal - Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #07111F;
      --primary: #2F80ED;
      --primary-soft: #66B3FF;
      --text: #DCEBFF;
      --muted: #8FAECC;
      --panel: #0E2238;
      --border: #163252;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(47,128,237,0.18), transparent 30%),
        linear-gradient(180deg, #050D18 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reset-card {
      width: min(420px, calc(100% - 32px));
      background: linear-gradient(180deg, rgba(16,41,68,0.95), rgba(14,34,56,0.95));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      width: 240px;
      height: auto;
      display: block;
      margin: 0 auto;
      transform: translateX(-6px);
    }

    .brand-subtitle {
      color: var(--muted);
      letter-spacing: 4px;
      font-size: 13px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .field-label {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(7,17,31,0.7);
      color: var(--text);
      padding: 15px;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(47,128,237,0.15);
    }

    .button {
      width: 100%;
      cursor: pointer;
      border-radius: 12px;
      border: none;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      color: white;
    }

    .back-link {
      margin-top: 14px;
      display: block;
      text-align: center;
      color: var(--primary-soft);
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
    }

    .message {
      margin-top: 16px;
      color: #ff9b95;
      font-weight: 700;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="brand">
      <img src="/logo.png" alt="Lojiq" class="brand-logo">
      <div class="brand-subtitle">Reset Password</div>
    </div>

    <form id="resetForm">
      <div class="field-label">New password</div>
      <input id="passwordInput" class="input" type="password" autocomplete="new-password" required />

      <div class="field-label">Repeat new password</div>
      <input id="passwordConfirmInput" class="input" type="password" autocomplete="new-password" required />

      <button class="button" type="submit">Reset password</button>

      <a class="back-link" href="/">Back to login</a>

      <div id="messageBox" class="message"></div>
    </form>
  </div>

  <script>
    const resetForm = document.getElementById("resetForm");
    const passwordInput = document.getElementById("passwordInput");
    const passwordConfirmInput = document.getElementById("passwordConfirmInput");
    const messageBox = document.getElementById("messageBox");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";

    if (!token) {
      messageBox.textContent = "Missing reset token.";
      messageBox.style.display = "block";
      resetForm.querySelector("button").disabled = true;
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      messageBox.style.display = "none";
      messageBox.textContent = "";

      try {
        const response = await fetch("/api/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token,
            password: passwordInput.value,
            password_confirm: passwordConfirmInput.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.details || "Failed to reset password");
        }

        messageBox.style.color = "#83e6ad";
        messageBox.textContent = "Password reset successfully. You can now log in.";
        messageBox.style.display = "block";

        setTimeout(() => {
          window.location.href = "/";
        }, 1800);
      } catch (err) {
        messageBox.style.color = "#ff9b95";
        messageBox.textContent = err.message;
        messageBox.style.display = "block";
      }
    });
  </script>
</body>
</html>

    const LANG_KEY = "lojiq-partner-lang";

    function startLang() {
      try {
        const saved = localStorage.getItem(LANG_KEY);
        if (saved === "en" || saved === "zh") return saved;
      } catch {}

      return /^zh/i.test(navigator.language || "") ? "zh" : "en";
    }

    let lang = startLang();
    const t = (key) => WORDS[lang][key] || WORDS.en[key] || key;

    function applyLang() {
      document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
      document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll("[data-t-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.tPlaceholder); });
      if (typeof stock !== "undefined" && stock.data) renderStock();
      if (typeof send !== "undefined") renderSend();
      if (typeof sent !== "undefined") renderSent();
      if (typeof lbl !== "undefined") renderLabels();
      // The button names the other language, in that language.
      document.querySelectorAll("[data-lang-toggle]").forEach((el) => { el.textContent = lang === "zh" ? "English" : "中文"; });
    }

    document.querySelectorAll("[data-lang-toggle]").forEach((el) => el.addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      try { localStorage.setItem(LANG_KEY, lang); } catch {}
      applyLang();
    }));

    /* ---------- server ---------- */

    const $ = (id) => document.getElementById(id);

    async function api(path, options = {}) {
      const response = await fetch(path, {
        method: options.method || "GET",
        headers: options.body ? { "Content-Type": "application/json" } : {},
        body: options.body ? JSON.stringify(options.body) : undefined,
        credentials: "same-origin"
      });
      const data = await response.json().catch(() => ({}));

      if (response.status === 401 && !path.endsWith("/login")) {
        showLogin();
        throw new Error("not_signed_in");
      }
      if (!response.ok) throw Object.assign(new Error(data.error || "try_again"), { data });

      return data;
    }

    /* ---------- screens ---------- */

    function showLogin() {
      $("appView").hidden = true;
      $("loginView").hidden = false;
      $("loginPassword").value = "";
    }

    function showApp(partner) {
      $("loginView").hidden = true;
      $("appView").hidden = false;
      $("who").textContent = partner.name || partner.email;
      openTab(location.hash.replace("#", "") || "stock");
    }

    function openTab(name) {
      if (!["stock", "new", "sent", "labels"].includes(name)) name = "stock";

      document.querySelectorAll("[data-tab]").forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.tab === name)));
      document.querySelectorAll("[data-view]").forEach((view) => { view.hidden = view.id !== `view-${name}`; });
      if (location.hash !== `#${name}`) history.replaceState(null, "", `#${name}`);
      window.scrollTo(0, 0);
      if (name === "stock") loadStock();
      if (name === "new") loadSend();
      if (name === "sent") loadSent();
      if (name === "labels") loadLabels();
      if (typeof send !== "undefined") renderSendBar();
    }

    document.querySelectorAll("[data-tab]").forEach((tab) => tab.addEventListener("click", () => openTab(tab.dataset.tab)));

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      const error = $("loginError");
      const button = $("loginButton");

      error.hidden = true;
      if (!email || !password) {
        error.textContent = t("fill_both");
        error.hidden = false;
        return;
      }

      button.disabled = true;
      button.textContent = t("signing_in");

      try {
        const data = await api("/api/partner/login", { method: "POST", body: { email, password } });
        showApp(data.partner);
      } catch (err) {
        error.textContent = t(err.message in WORDS.en ? err.message : "try_again");
        error.hidden = false;
      } finally {
        button.disabled = false;
        button.textContent = t("sign_in");
      }
    });

    $("signOut").addEventListener("click", async () => {
      await api("/api/partner/logout", { method: "POST" }).catch(() => {});
      showLogin();
    });

    /* ---------- stock ---------- */

    const stock = { data: null, at: 0, mode: "product", open: new Set(), size: new Map(), loading: false };

    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

    function niceDate(day) {
      if (!day) return "?";
      const [y, m, d] = day.split("-").map(Number);
      return new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : "en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })
        .format(new Date(Date.UTC(y, m - 1, d)));
    }

    const whName = (w) => (WORDS.en[`wh_${w}`] ? t(`wh_${w}`) : w);
    const severalWarehouses = () => (stock.data?.totals.warehouses.length || 0) > 1;
    const thumb = (src) => (src ? `<img class="thumb" src="${esc(src)}" alt="" loading="lazy">` : '<div class="thumb empty"></div>');

    async function loadStock(force = false) {
      if (stock.loading || (!force && stock.data && Date.now() - stock.at < 60_000)) return;

      stock.loading = true;
      if (!stock.data) $("stockList").innerHTML = `<div class="note">${esc(t("loading"))}</div>`;

      try {
        stock.data = await api("/api/partner/stock");
        stock.at = Date.now();
        renderStock();
      } catch (err) {
        if (err.message === "not_signed_in") return;
        $("stockList").innerHTML = `<div class="note">${esc(t("try_again"))}<br><button class="btn retry" type="button" id="stockRetry">${esc(t("retry"))}</button></div>`;
        $("stockRetry").addEventListener("click", () => loadStock(true));
      } finally {
        stock.loading = false;
      }
    }

    const matches = (item, query) => !query || `${item.sku} ${item.name} ${item.brand || ""}`.toLowerCase().includes(query);

    function renderStock() {
      const data = stock.data;
      if (!data) return;

      const parts = [`<span><b>${data.totals.on_shelf}</b> ${esc(t("pairs"))}</span>`, `<span>${data.totals.products} ${esc(t("products"))}</span>`];
      if (severalWarehouses()) {
        for (const w of data.totals.warehouses) parts.push(`<span>${esc(whName(w.warehouse))} ${w.count}</span>`);
      }
      $("stockSummary").innerHTML = parts.join("");

      document.querySelectorAll("[data-stock-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stockMode === stock.mode)));

      const query = $("stockSearch").value.trim().toLowerCase();
      $("stockList").innerHTML = stock.mode === "product" ? productCards(data.products, query) : arrivalCards(data.arrivals, query);
    }

    function productCards(products, query) {
      const shown = products.filter((p) => matches(p, query));
      if (!products.length) return `<div class="note">${esc(t("no_stock"))}</div>`;
      if (!shown.length) return `<div class="note">${esc(t("no_match"))}</div>`;

      return shown.map((p) => {
        const open = stock.open.has(`p:${p.sku}`);
        const picked = stock.size.get(p.sku);
        const body = open ? `
          <div class="card-body">
            <div class="sizes">${p.sizes.map((s) => `
              <button class="size" type="button" data-size="${esc(p.sku)}|${esc(s.size)}" aria-pressed="${s.size === picked}">
                <b>${esc(s.size)}</b><span>${s.count}</span>
              </button>`).join("")}
            </div>
            ${sizeDetail(p, picked)}
          </div>` : "";

        return `
          <div class="card${open ? " open" : ""}">
            <button class="card-head" type="button" data-open="p:${esc(p.sku)}" aria-expanded="${open}">
              ${thumb(p.image)}
              <div class="card-text">
                <div class="card-title">${esc(p.name || p.sku)}</div>
                <div class="card-sub">${esc(p.sku)}</div>
                <div class="card-sub where">${warehouseLine(p.warehouses)}</div>
              </div>
              <div class="count"><b>${p.count}</b><span>${esc(t("pairs"))}</span></div>
              ${CHEV}
            </button>${body}
          </div>`;
      }).join("");
    }

    function sizeDetail(product, picked) {
      const entry = product.sizes.find((s) => s.size === picked);
      if (!entry) return `<div class="detail"><div class="detail-row"><span class="muted">${esc(t("tap_size"))}</span></div></div>`;

      const pairs = (n) => `${n} ${esc(t(n === 1 ? "pair" : "pairs"))}`;

      // One row per location and day, the biggest location first. With more
      // than one location, a line above it adds them up per location.
      const rank = new Map(entry.warehouses.map((w, i) => [w.warehouse, i]));
      const rows = [...entry.arrivals]
        .sort((x, y) => (rank.get(x.warehouse) ?? 99) - (rank.get(y.warehouse) ?? 99) || x.date.localeCompare(y.date))
        .map((a) => `
          <div class="detail-row">
            <span>${esc(whName(a.warehouse))} · ${esc(t("arrived"))} ${esc(niceDate(a.date))}</span>
            <b>${pairs(a.count)}</b>
          </div>`);
      if (entry.onHold) rows.push(`<div class="detail-row"><span class="muted">${esc(t("on_hold"))}</span><span class="muted">${entry.onHold}</span></div>`);

      const split = entry.warehouses.length > 1
        ? `<div class="detail-row"><span class="muted">${entry.warehouses.map((w) => `${esc(whName(w.warehouse))} ${w.count}`).join(" · ")}</span></div>`
        : "";

      return `<div class="detail">${split}${rows.join("")}</div>`;
    }

    // Two locations fit on the card; with more, the biggest and how many more.
    // The list comes biggest first; tapping a size shows every location.
    function warehouseLine(list) {
      const named = list.map((w) => `${esc(whName(w.warehouse))} ${w.count}`);
      return named.length > 2 ? `${named[0]} ${esc(t("and_more").replace("{n}", named.length - 1))}` : named.join(" · ");
    }

    // One block per day, and in it one card per product that came that day.
    function arrivalCards(arrivals, query) {
      const shown = arrivals
        .map((a) => ({ ...a, products: a.products.filter((p) => matches(p, query)) }))
        .filter((a) => a.products.length);
      if (!arrivals.length) return `<div class="note">${esc(t("no_stock"))}</div>`;
      if (!shown.length) return `<div class="note">${esc(t("no_match"))}</div>`;

      return shown.map((a) => `
        <div class="day">
          <div class="day-head">
            <span>${esc(niceDate(a.date))} · ${esc(whName(a.warehouse))}</span>
            <span>${a.left ? `${a.left} ${esc(t("left_of"))} ${a.received}` : esc(t("nothing_left"))}</span>
          </div>
          <div class="list">${a.products.map((p) => arrivalProductCard(a, p)).join("")}</div>
        </div>`).join("");
    }

    function arrivalProductCard(a, p) {
      const key = `a:${a.date}|${a.warehouse}|${p.sku}`;
      const open = stock.open.has(key);
      const done = p.left === 0;
      const body = open ? `
        <div class="card-body">
          <div class="sizes">${p.sizes.map((s) => `
            <div class="size static${s.left ? "" : " empty"}"><b>${esc(s.size)}</b><span>${s.left} / ${s.received}</span></div>`).join("")}
          </div>
          <p class="hint tiles-hint">${esc(t("left_of_hint"))}</p>
        </div>` : "";

      return `
        <div class="card${open ? " open" : ""}${done ? " done" : ""}">
          <button class="card-head" type="button" data-open="${esc(key)}" aria-expanded="${open}">
            ${thumb(p.image)}
            <div class="card-text">
              <div class="card-title">${esc(p.name || p.sku)}</div>
              <div class="stats"><span>${p.received} ${esc(t("in"))}</span><span>${p.sold} ${esc(t("sold"))}</span><span>${p.forwarded} ${esc(t("forwarded"))}</span></div>
            </div>
            <div class="count">${done ? `<span class="done">${esc(t("nothing_left"))}</span>` : `<b>${p.left}</b><span>${esc(t("left"))}</span>`}</div>
            ${CHEV}
          </button>${body}
        </div>`;
    }

    $("stockList").addEventListener("click", (event) => {
      const tile = event.target.closest("[data-size]");
      const head = event.target.closest("[data-open]");

      if (tile) {
        const [sku, size] = tile.dataset.size.split("|");
        if (stock.size.get(sku) === size) stock.size.delete(sku);
        else stock.size.set(sku, size);
        renderStock();
      } else if (head) {
        const key = head.dataset.open;
        if (stock.open.has(key)) stock.open.delete(key);
        else stock.open.add(key);
        renderStock();
      }
    });

    document.querySelectorAll("[data-stock-mode]").forEach((b) => b.addEventListener("click", () => {
      stock.mode = b.dataset.stockMode;
      renderStock();
    }));

    $("stockSearch").addEventListener("input", renderStock);

    /* ---------- send pairs ---------- */

    const send = { data: null, at: 0, step: "pick", picked: new Map(), open: new Set(), labels: [], busy: false, result: null, notice: "" };

    const money = (value) => new Intl.NumberFormat(lang === "zh" ? "zh-CN" : "en-GB", { style: "currency", currency: "EUR" }).format(value || 0);
    const pickKey = (sku, size) => `${sku}|${size}`;

    function sizeEntry(sku, size) {
      const product = send.data?.products.find((p) => p.sku === sku);
      return product?.sizes.find((s) => s.size === size) || null;
    }

    function pickedTotals() {
      let pairs = 0;
      let fee = 0;

      for (const [key, qty] of send.picked) {
        const [sku, size] = key.split("|");
        const entry = sizeEntry(sku, size);
        pairs += qty;
        fee += (entry?.fees || []).slice(0, qty).reduce((sum, f) => sum + f, 0);
      }

      return { pairs, fee: Math.round(fee * 100) / 100 };
    }

    // After a reload, nobody keeps more than is still there.
    function clampPicked() {
      for (const [key, qty] of [...send.picked]) {
        const [sku, size] = key.split("|");
        const available = sizeEntry(sku, size)?.available || 0;
        if (!available) send.picked.delete(key);
        else if (qty > available) send.picked.set(key, available);
      }
    }

    async function loadSend(force = false) {
      if (send.busy || (!force && send.data && Date.now() - send.at < 60_000)) return;

      if (!send.data) $("sendBody").innerHTML = `<div class="note">${esc(t("loading"))}</div>`;

      try {
        send.data = await api("/api/partner/forwardable");
        send.at = Date.now();
        clampPicked();
        renderSend();
      } catch (err) {
        if (err.message === "not_signed_in") return;
        $("sendBody").innerHTML = `<div class="note">${esc(t("try_again"))}<br><button class="btn retry" type="button" data-send="reload">${esc(t("retry"))}</button></div>`;
      }
    }

    function renderSend() {
      if (!send.data && send.step !== "done") return;

      const body = send.step === "check" ? checkScreen() : send.step === "done" ? doneScreen() : pickScreen();
      const notice = send.notice ? `<div class="error">${esc(send.notice)}</div>` : "";

      $("sendBody").innerHTML = notice + body;
      if (send.step === "check" && typeof updateInvoiceTotals === "function") updateInvoiceTotals();
      $("sendSearchWrap").hidden = send.step !== "pick";
      renderSendBar();
    }

    function renderSendBar() {
      const bar = $("sendBar");
      const { pairs, fee } = pickedTotals();
      const show = send.step === "pick" && pairs > 0 && !$("view-new").hidden;

      bar.hidden = !show;
      if (!show) return;

      $("sendBarText").innerHTML = `<b>${pairs}</b> ${esc(t(pairs === 1 ? "pair" : "pairs"))} · ${esc(t("fee"))} ${esc(money(fee))}`;
    }

    function pickScreen() {
      const products = send.data.products;
      const query = $("sendSearch").value.trim().toLowerCase();
      const shown = products.filter((p) => matches(p, query));

      if (!products.length) return `<div class="note">${esc(t("nothing_to_send"))}</div>`;
      if (!shown.length) return `<div class="note">${esc(t("no_match"))}</div>`;

      return `<p class="hint">${esc(t("pick_hint"))}</p><div class="list">${shown.map((p) => {
        const chosen = p.sizes.reduce((sum, s) => sum + (send.picked.get(pickKey(p.sku, s.size)) || 0), 0);
        const open = send.open.has(p.sku) || Boolean(query) || chosen > 0;

        const tiles = open ? `
          <div class="card-body"><div class="sizes">${p.sizes.map((s) => {
            const qty = send.picked.get(pickKey(p.sku, s.size)) || 0;
            const full = qty >= s.available;
            return `
              <button class="size${full ? " full" : ""}" type="button" data-add="${esc(p.sku)}|${esc(s.size)}" aria-pressed="${qty > 0}">
                <b>${esc(s.size)}</b><span>${qty ? `${qty} / ${s.available}` : `${s.available} ${esc(t("left"))}`}</span>
              </button>`;
          }).join("")}</div></div>` : "";

        return `
          <div class="card${open ? " open" : ""}">
            <button class="card-head" type="button" data-send-open="${esc(p.sku)}" aria-expanded="${open}">
              ${thumb(p.image)}
              <div class="card-text"><div class="card-title">${esc(p.name || p.sku)}</div><div class="card-sub">${esc(p.sku)}</div></div>
              <div class="count">${chosen ? `<b class="chosen">${chosen}</b><span>${esc(t("chosen"))}</span>` : `<b>${p.count}</b><span>${esc(t("pairs"))}</span>`}</div>
              ${CHEV}
            </button>${tiles}
          </div>`;
      }).join("")}</div>`;
    }

    function checkScreen() {
      const { pairs, fee } = pickedTotals();
      const rows = [];

      for (const p of send.data.products) {
        const sizes = p.sizes.filter((s) => send.picked.get(pickKey(p.sku, s.size)));
        if (!sizes.length) continue;

        rows.push(`
          <div class="card"><div class="card-head static">
            ${thumb(p.image)}
            <div class="card-text"><div class="card-title">${esc(p.name || p.sku)}</div><div class="card-sub">${esc(p.sku)}</div></div>
          </div>
          <div class="card-body">${sizes.map((s) => {
            const qty = send.picked.get(pickKey(p.sku, s.size));
            return `
              <div class="line">
                <span class="line-size">${esc(t("size"))} ${esc(s.size)}</span>
                <div class="stepper">
                  <button type="button" data-minus="${esc(p.sku)}|${esc(s.size)}" aria-label="−">−</button>
                  <b>${qty}</b>
                  <button type="button" data-add="${esc(p.sku)}|${esc(s.size)}" aria-label="+"${qty >= s.available ? " disabled" : ""}>+</button>
                </div>
              </div>`;
          }).join("")}</div></div>`);
      }

      return `
        <div class="list">${rows.join("")}</div>

        ${invoiceBlock()}

        ${labelsBlock()}

        <div class="total">${invoiceTotals(pairs, fee)}</div>

        <div class="actions">
          <button class="btn" type="button" data-send="back">${esc(t("back"))}</button>
          <button class="btn primary" type="button" data-send="submit"${send.busy || !pairs ? " disabled" : ""}>${esc(send.busy ? t("sending") : `${t("send")} ${pairs} ${t(pairs === 1 ? "pair" : "pairs")}`)}</button>
        </div>`;
    }

    function doneScreen() {
      const r = send.result || {};
      return `
        <div class="done-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/></svg>
          <h3>${esc(r.display_id || "")}</h3>
          <p>${esc(r.pairs === 1 ? t("done_pair") : t("done_pairs").replace("{n}", r.pairs || 0))}</p>
          <p class="muted">${esc(t(r.shipping_status === "ready_to_ship" ? "done_ready" : "done_waiting"))}</p>
          ${r.invoice && r.invoice.total ? `
            <div class="total">
              <div><span>${esc(t("sale_total"))}</span><b>${esc(money(r.invoice.total))}</b></div>
              <div class="receive"><span>${esc(t("you_receive"))}</span><b>${esc(money(r.invoice.you_receive))}</b></div>
            </div>
            <p>${esc(t(r.invoice.status === "on_hold" ? "done_hold" : "done_invoice").replace("{buyer}", r.buyer).replace("{total}", money(r.invoice.total)))}</p>
            <p class="muted">${esc(t("done_receive").replace("{amount}", money(r.invoice.you_receive)))}</p>` : ""}
        </div>
        <div class="actions">
          <button class="btn" type="button" data-send="again">${esc(t("send_more"))}</button>
          <button class="btn primary" type="button" data-send="to-sent">${esc(t("see_sent"))}</button>
        </div>`;
    }

    async function submitSend() {
      if (send.busy) return;

      const lines = [...send.picked].map(([key, qty]) => {
        const [sku, size] = key.split("|");
        return { sku, size, qty };
      });

      const labelIssue = labelProblem();
      if (labelIssue) {
        send.notice = labelIssue;
        renderSend();
        document.querySelector(".card.labels")?.scrollIntoView({ block: "center" });
        return;
      }

      const problem = invoiceProblem();
      if (problem) {
        inv.error = problem;
        renderSend();
        $("invPrice")?.closest(".card")?.scrollIntoView({ block: "center" });
        return;
      }

      send.busy = true;
      send.notice = "";
      renderSend();

      try {
        const data = await api("/api/partner/forwards", {
          method: "POST",
          body: {
            lines,
            labels: send.labels.map((l) => ({ data_url: l.dataUrl, name: l.name, tracking: labelNumbers(l) })),
            invoice: inv.on ? { buyer_id: inv.buyerId, price_per_pair: parsePrice(inv.price) } : undefined
          }
        });

        send.result = { ...data.forward, buyer: inv.buyers?.find((b) => b.id === inv.buyerId)?.label || "" };
        resetInvoice();
        send.step = "done";
        send.picked.clear();
        send.labels = [];
        send.data = null;
        stock.data = null;
        sent.data = null;
      } catch (err) {
        if (err.message === "not_signed_in") return;
        send.notice = t(err.message in WORDS.en ? err.message : "try_again");
        if (err.message === "label_used" && err.data?.used) send.notice = t("label_used").replace("{fwd}", err.data.used.forward);
        if (err.message.startsWith("invoice_")) {
          inv.error = send.notice;
          send.notice = "";
        }
        if (err.message === "pairs_gone") {
          send.step = "pick";
          send.busy = false;
          await loadSend(true);
        }
      } finally {
        send.busy = false;
        renderSend();
        window.scrollTo(0, 0);
      }
    }

    function addOne(key) {
      const [sku, size] = key.split("|");
      const available = sizeEntry(sku, size)?.available || 0;
      const qty = send.picked.get(key) || 0;
      if (qty < available) send.picked.set(key, qty + 1);
    }

    $("view-new").addEventListener("click", async (event) => {
      const add = event.target.closest("[data-add]");
      const minus = event.target.closest("[data-minus]");
      const head = event.target.closest("[data-send-open]");
      const action = event.target.closest("[data-send]")?.dataset.send;

      if (add) {
        addOne(add.dataset.add);
        send.notice = "";
      } else if (minus) {
        const key = minus.dataset.minus;
        const qty = (send.picked.get(key) || 0) - 1;
        if (qty > 0) send.picked.set(key, qty);
        else send.picked.delete(key);
        if (!send.picked.size) send.step = "pick";
      } else if (head) {
        const sku = head.dataset.sendOpen;
        if (send.open.has(sku)) send.open.delete(sku);
        else send.open.add(sku);
      } else if (action === "next") {
        send.step = "check";
        send.notice = "";
        window.scrollTo(0, 0);
      } else if (action === "back") {
        send.step = "pick";
      } else if (action === "submit") {
        return submitSend();
      } else if (action === "again") {
        send.step = "pick";
        send.result = null;
        return loadSend(true);
      } else if (action === "to-sent") {
        send.step = "pick";
        send.result = null;
        return openTab("sent");
      } else if (action === "reload") {
        return loadSend(true);
      } else {
        return;
      }

      renderSend();
    });

    $("sendBar").addEventListener("click", () => {
      send.step = "check";
      send.notice = "";
      renderSend();
      window.scrollTo(0, 0);
    });

    $("sendSearch").addEventListener("input", renderSend);

    $("view-new").addEventListener("click", (event) => {
      const action = event.target.closest("[data-inv]")?.dataset.inv;

      if (action === "new") {
        inv.view = "new";
        inv.bad = [];
        inv.error = "";
      } else if (action === "cancel-new") {
        inv.view = "pick";
        inv.bad = [];
        inv.error = "";
      } else if (action === "save-buyer") {
        return saveBuyer(false);
      } else if (action === "same-yes") {
        inv.buyerId = inv.same.id;
        inv.view = "pick";
        inv.form = {};
        inv.same = null;
      } else if (action === "same-no") {
        inv.view = "new";
        return saveBuyer(true);
      } else {
        return;
      }

      renderSend();
    });

    $("view-new").addEventListener("change", (event) => {
      if (event.target.id === "invBuyer") {
        inv.buyerId = event.target.value;
        inv.error = "";
        renderSend();
      } else if (event.target.id === "invOn") {
        inv.on = event.target.checked;
        inv.error = "";
        renderSend();
      } else if (event.target.dataset.invField) {
        inv.form[event.target.dataset.invField] = event.target.value;
      }
    });

    $("view-new").addEventListener("input", (event) => {
      if (event.target.id === "invPrice") {
        inv.price = event.target.value;
        inv.error = "";
        updateInvoiceTotals();
      } else if (event.target.dataset.invField) {
        inv.form[event.target.dataset.invField] = event.target.value;
      }
    });

    /* ---------- shipping labels ---------- */

    // Every forward comes with the label of every box. Each file is read as
    // soon as it is added; the partner types a number only when it cannot be.
    let labelSeq = 0;

    const labelOk = (l) => l.status === "read" && l.numbers.length && !l.used;
    const labelNumbers = (l) => (l.status === "read" ? l.numbers.map((n) => n.tracking) : [l.typed.trim().toUpperCase().replace(/[\s-]/g, "")]).filter(Boolean);

    function labelsBlock() {
      const rows = send.labels.map((l) => {
        let status;
        if (l.status === "reading") status = `<span class="muted">${esc(t("label_reading"))}</span>`;
        else if (l.used) status = `<span class="bad-text">${esc(t("label_used").replace("{fwd}", l.used.forward))}</span>`;
        else if (l.status === "read") status = l.numbers.map((n) => `<span class="ok-text">✓ ${esc(n.carrier)} ${esc(n.tracking)}</span>`).join("<br>");
        else status = `
          <span class="muted">${esc(t("label_unread"))}</span>
          <input class="typed" data-label-typed="${l.id}" autocomplete="off" autocapitalize="characters" placeholder="${esc(t("tracking"))}" value="${esc(l.typed)}">`;

        return `
          <div class="label-row">
            <div class="label-text"><b>${esc(l.name)}</b><div>${status}</div></div>
            <button type="button" class="link" data-label-drop="${l.id}" aria-label="${esc(t("remove"))}">✕</button>
          </div>`;
      }).join("");

      return `
        <div class="card labels">
          <div class="card-body">
            <div class="inv-step"><span class="step-n">✓</span>${esc(t("labels_title"))} *</div>
            <p class="hint">${esc(t("labels_hint"))}</p>
            ${rows}
            <label class="btn file-btn" for="sendLabels">${esc(t("label_add"))}</label>
            <input id="sendLabels" type="file" accept="application/pdf,image/*" multiple hidden>
          </div>
        </div>`;
    }

    function fileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    // A phone photo is several megabytes; 2000 pixels on the long side is
    // plenty to read a label and keeps the upload quick.
    async function shrinkPhoto(file) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = url;
        });
        const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.88);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function addLabels(files) {
      for (const file of files) {
        const entry = { id: ++labelSeq, name: file.name || "label", status: "reading", numbers: [], used: null, typed: "", dataUrl: "" };
        send.labels.push(entry);
        renderSend();

        try {
          const pdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
          if (pdf && file.size > 20 * 1024 * 1024) throw new Error("label_too_big");
          entry.dataUrl = pdf ? await fileAsDataUrl(file) : await shrinkPhoto(file);

          const data = await api("/api/partner/labels/read", { method: "POST", body: { data_url: entry.dataUrl } });
          const found = (data.labels || []).filter((n) => n.valid);
          entry.used = found.find((n) => n.used)?.used || null;
          entry.numbers = found;
          entry.status = found.length ? "read" : "unread";
        } catch (err) {
          if (err.message === "not_signed_in") return;
          if (!entry.dataUrl) {
            send.labels = send.labels.filter((l) => l !== entry);
            send.notice = t(err.message in WORDS.en ? err.message : "bad_label");
          } else {
            entry.status = "unread";
          }
        }
        renderSend();
      }
    }

    // What has to be right about the labels before sending, in his words.
    function labelProblem() {
      if (!send.labels.length) return t("label_missing");
      if (send.labels.some((l) => l.status === "reading")) return t("labels_reading");
      if (send.labels.some((l) => l.used)) return t("label_used_short");
      if (send.labels.some((l) => !labelNumbers(l).length)) return t("label_no_tracking");
      return "";
    }

    $("view-new").addEventListener("change", (event) => {
      if (event.target.id !== "sendLabels") return;
      const files = [...(event.target.files || [])];
      event.target.value = "";
      send.notice = "";
      addLabels(files);
    });

    $("view-new").addEventListener("click", (event) => {
      const drop = event.target.closest("[data-label-drop]");
      if (!drop) return;
      send.labels = send.labels.filter((l) => String(l.id) !== drop.dataset.labelDrop);
      renderSend();
    });

    $("view-new").addEventListener("input", (event) => {
      const id = event.target.dataset.labelTyped;
      if (!id) return;
      const entry = send.labels.find((l) => String(l.id) === id);
      if (entry) entry.typed = event.target.value;
    });

    /* ---------- invoice on a forward ---------- */

    const inv = { on: false, buyerId: "", price: "", buyers: null, countries: [], view: "pick", query: "", form: {}, bad: [], same: null, error: "", saving: false, loading: false };

    const BUYER_FIELDS = [
      ["company_name", "f_company", false, "organization"],
      ["full_name", "f_name", false, "name"],
      ["email", "f_email", true, "email"],
      ["vat_id", "f_vat", false, "off"],
      ["address", "f_address", true, "address-line1"],
      ["address_line_2", "f_address2", false, "address-line2"],
      ["zipcode", "f_zip", true, "postal-code"],
      ["city", "f_city", true, "address-level2"]
    ];

    const pickedSkus = () => new Set([...send.picked.keys()].map((key) => key.split("|")[0]));
    const parsePrice = (value) => {
      const n = Number(String(value || "").trim().replace(",", "."));
      return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0;
    };
    const buyerSub = (b) => [b.email, b.city, b.country].filter(Boolean).join(" · ");

    // The highest fee among the pairs picked: the price has to be above it.
    function highestFee() {
      let high = 0;
      for (const [key, qty] of send.picked) {
        const [sku, size] = key.split("|");
        for (const fee of (sizeEntry(sku, size)?.fees || []).slice(0, qty)) high = Math.max(high, fee);
      }
      return high;
    }

    async function loadBuyers() {
      if (inv.loading || inv.buyers) return;
      inv.loading = true;
      try {
        const data = await api("/api/partner/buyers");
        inv.buyers = data.buyers || [];
        inv.countries = data.countries || [];
      } catch (err) {
        if (err.message !== "not_signed_in") inv.error = t("try_again");
        inv.buyers = inv.buyers || [];
      } finally {
        inv.loading = false;
        renderSend();
      }
    }

    function invoiceBlock() {
      const head = `
        <label class="check">
          <input type="checkbox" id="invOn"${inv.on ? " checked" : ""}>
          <span><b>${esc(t("inv_generate"))}</b><small>${esc(t("inv_generate_hint"))}</small></span>
        </label>`;

      if (!inv.on) return `<div class="card invoice">${head}</div>`;
      if (pickedSkus().size > 1) return `<div class="card invoice">${head}<div class="card-body"><div class="error">${esc(t("invoice_one_product"))}</div></div></div>`;

      return `
        <div class="card invoice">${head}
          <div class="card-body">
            <div class="inv-step"><span class="step-n">1</span>${esc(t("inv_buyer"))}</div>
            ${buyerSection()}
            <div class="inv-step"><span class="step-n">2</span>${esc(t("inv_price"))}</div>
            <div class="price-field">
              <span>€</span>
              <input id="invPrice" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(inv.price)}">
              <span class="per">${esc(t("per_pair"))}</span>
            </div>
            ${inv.error ? `<div class="error">${esc(inv.error)}</div>` : ""}
          </div>
        </div>`;
    }

    function buyerSection() {
      if (inv.buyers === null) {
        loadBuyers();
        return `<div class="note">${esc(t("loading"))}</div>`;
      }

      if (inv.view === "same") return sameSection();
      if (inv.view === "new") return buyerForm();

      // A dropdown of his buyers (the phone's own picker), what the chosen
      // one is under it, and "+ New buyer" for one that is not in it yet.
      const chosen = inv.buyers.find((b) => b.id === inv.buyerId);
      const options = inv.buyers.length
        ? `<option value="">${esc(t("choose_buyer"))}</option>` +
          inv.buyers.map((b) => `<option value="${esc(b.id)}"${b.id === inv.buyerId ? " selected" : ""}>${esc(b.label)}</option>`).join("")
        : `<option value="">${esc(t("no_buyers_yet"))}</option>`;

      return `
        <select class="buyer-select" id="invBuyer"${inv.buyers.length ? "" : " disabled"}>${options}</select>
        ${chosen ? `<p class="hint buyer-sub">${esc(buyerSub(chosen))}</p>` : ""}
        <button type="button" class="btn file-btn" data-inv="new">${esc(t("new_buyer"))}</button>`;
    }

    function buyerForm() {
      const field = ([name, word, required, auto]) => `
        <div class="field${inv.bad.includes(name) ? " bad" : ""}">
          <label for="inv_${name}">${esc(t(word))}${required ? " *" : ""}</label>
          <input id="inv_${name}" data-inv-field="${name}" autocomplete="${auto}" value="${esc(inv.form[name] || "")}"${name === "email" ? ' type="email" inputmode="email" autocapitalize="off"' : ""}>
        </div>`;

      return `
        <div class="buyer-form">
          <p class="hint">${esc(t("name_hint"))}</p>
          ${BUYER_FIELDS.map(field).join("")}
          <div class="field${inv.bad.includes("country") ? " bad" : ""}">
            <label for="invCountry">${esc(t("f_country"))} *</label>
            <select id="invCountry" data-inv-field="country">
              <option value="">${esc(t("choose_country"))}</option>
              ${inv.countries.map((c) => `<option${inv.form.country === c ? " selected" : ""}>${esc(c)}</option>`).join("")}
            </select>
          </div>
          <div class="actions">
            <button class="btn" type="button" data-inv="cancel-new">${esc(t("cancel"))}</button>
            <button class="btn primary" type="button" data-inv="save-buyer"${inv.saving ? " disabled" : ""}>${esc(inv.saving ? t("sending") : t("save_buyer"))}</button>
          </div>
        </div>`;
    }

    function sameSection() {
      return `
        <div class="same-box">
          <b>${esc(t("same_title"))}</b>
          <div class="buyer-chosen"><div><b>${esc(inv.same.label)}</b><small>${esc(buyerSub(inv.same))}</small></div></div>
          <div class="actions">
            <button class="btn" type="button" data-inv="same-no">${esc(t("same_no"))}</button>
            <button class="btn primary" type="button" data-inv="same-yes">${esc(t("same_yes"))}</button>
          </div>
        </div>`;
    }

    function missingFields() {
      const f = inv.form;
      const bad = [];
      if (!String(f.company_name || "").trim() && !String(f.full_name || "").trim()) bad.push("company_name", "full_name");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(f.email || "").trim())) bad.push("email");
      // A company is invoiced with its VAT number (Dario, 11-10-2026).
      if (String(f.company_name || "").trim() && !String(f.vat_id || "").trim()) bad.push("vat_id");
      for (const name of ["address", "zipcode", "city", "country"]) if (!String(f[name] || "").trim()) bad.push(name);
      return bad;
    }

    async function saveBuyer(confirmNew = false) {
      inv.bad = missingFields();
      inv.error = inv.bad.length ? t("buyer_missing") : "";
      if (inv.bad.length) return renderSend();

      inv.saving = true;
      renderSend();

      try {
        const data = await api("/api/partner/buyers", { method: "POST", body: { ...inv.form, confirm_new: confirmNew } });

        if (data.same) {
          inv.same = data.same;
          inv.view = "same";
        } else {
          inv.buyers = [...inv.buyers.filter((b) => b.id !== data.buyer.id), data.buyer];
          inv.buyerId = data.buyer.id;
          inv.view = "pick";
          inv.form = {};
        }
      } catch (err) {
        if (err.message !== "not_signed_in") inv.error = t(err.message in WORDS.en ? err.message : "try_again");
      } finally {
        inv.saving = false;
        renderSend();
      }
    }

    // Live, without redrawing the page (that would close the phone keyboard).
    function updateInvoiceTotals() {
      const { pairs, fee } = pickedTotals();
      const price = parsePrice(inv.price);
      const sale = Math.round(price * pairs * 100) / 100;
      if ($("totSale")) $("totSale").textContent = price ? money(sale) : "—";
      if ($("totReceive")) $("totReceive").textContent = price ? money(Math.round((sale - fee) * 100) / 100) : "—";
    }

    function invoiceTotals(pairs, fee) {
      if (!inv.on || pickedSkus().size > 1) {
        return `<div><span>${esc(t("pairs_total"))}</span><b>${pairs}</b></div><div><span>${esc(t("fee_total"))}</span><b>${esc(money(fee))}</b></div>`;
      }

      return `
        <div><span>${esc(t("pairs_total"))}</span><b>${pairs}</b></div>
        <div><span>${esc(t("sale_total"))}</span><b id="totSale">—</b></div>
        <div><span>${esc(t("fee_total"))}</span><b>− ${esc(money(fee))}</b></div>
        <div class="receive"><span>${esc(t("you_receive"))}</span><b id="totReceive">—</b></div>`;
    }

    // What has to be right before sending, said in his words.
    function invoiceProblem() {
      if (!inv.on) return "";
      if (pickedSkus().size > 1) return t("invoice_one_product");
      if (!inv.buyerId || inv.view !== "pick") return t("inv_need_buyer");
      const price = parsePrice(inv.price);
      if (!price) return t("inv_need_price");
      if (price <= highestFee()) return t("invoice_price_below_fee");
      return "";
    }

    function resetInvoice() {
      Object.assign(inv, { on: false, buyerId: "", price: "", view: "pick", query: "", form: {}, bad: [], same: null, error: "" });
    }

    /* ---------- sent ---------- */

    const sent = { data: null, at: 0, open: new Set(), loading: false };

    const STATUS = {
      awaiting_label: { word: "st_waiting", tone: "wait" },
      ready_to_ship: { word: "st_ready", tone: "move" },
      shipped: { word: "st_shipped", tone: "good" },
      cancelled: { word: "st_cancelled", tone: "off" }
    };

    // The day of a timestamp on the warehouse's clock, as the page writes dates.
    function dayOfStamp(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Amsterdam", year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
    }

    async function loadSent(force = false) {
      if (sent.loading || (!force && sent.data && Date.now() - sent.at < 60_000)) return;

      sent.loading = true;
      if (!sent.data) $("sentList").innerHTML = `<div class="note">${esc(t("loading"))}</div>`;

      try {
        sent.data = (await api("/api/partner/forwards")).forwards;
        sent.at = Date.now();
        renderSent();
      } catch (err) {
        if (err.message === "not_signed_in") return;
        $("sentList").innerHTML = `<div class="note">${esc(t("try_again"))}<br><button class="btn retry" type="button" data-sent-reload>${esc(t("retry"))}</button></div>`;
      } finally {
        sent.loading = false;
      }
    }

    function renderSent() {
      if (!sent.data) return;
      if (!sent.data.length) {
        $("sentList").innerHTML = `<div class="note">${esc(t("no_sent"))}</div>`;
        return;
      }

      /*
        Each forward in one place: not shipped yet, shipped with its fee
        still open, or done. The money at the top counts every open fee,
        the same total the admin's Forwarding Payments shows for him.
      */
      const live = sent.data.filter((f) => f.status !== "cancelled");
      const pending = sent.data.filter((f) => f.status === "awaiting_label" || f.status === "ready_to_ship");
      const feeToPay = sent.data.filter((f) => f.status === "shipped" && !f.fee_paid);
      const cancelled = sent.data.filter((f) => f.status === "cancelled");
      const done = sent.data.filter((f) => !pending.includes(f) && !feeToPay.includes(f) && !cancelled.includes(f));

      const owed = live.filter((f) => !f.fee_paid);
      const owedTotal = owed.reduce((sum, f) => sum + Number(f.fee || 0), 0);
      const ours = live.filter((f) => f.invoice?.stage === "to_pay");
      const oursTotal = ours.reduce((sum, f) => sum + Number(f.invoice.you_receive || 0), 0);
      const count = (n) => `${n} ${esc(t(n === 1 ? "forward_one" : "forward_many"))}`;

      const summary = `
        <div class="money-box">
          ${owed.length
            ? `<div class="money-row"><span>${esc(t("fee_to_pay_total"))} <small>· ${count(owed.length)}</small></span><b>${esc(money(owedTotal))}</b></div>`
            : `<div class="money-row"><span class="ok-text">${esc(t("all_fees_paid"))} ✓</span></div>`}
          ${ours.length ? `<div class="money-row"><span>${esc(t("we_pay_you"))} <small>· ${count(ours.length)}</small></span><b class="ok-text">${esc(money(oursTotal))}</b></div>` : ""}
        </div>`;

      const section = (title, list) => (list.length ? `<h3 class="section">${esc(title)}</h3><div class="list">${list.map(sentCard).join("")}</div>` : "");

      $("sentList").innerHTML = summary + section(t("sec_open"), pending) + section(t("sec_fee"), feeToPay) + section(t("sec_done"), done) + section(t("sec_cancelled"), cancelled);
    }

    const trackLink = (n) => `<a class="track" href="https://t.17track.net/en#nums=${encodeURIComponent(n)}" target="_blank" rel="noopener">${esc(n)}</a>`;

    // One number in its row; more fold behind "4 tracking numbers".
    function trackingRows(f) {
      if (!f.tracking.length) return `<div class="detail-row"><span class="muted">${esc(t("tracking"))}</span><span class="muted">${esc(t("no_tracking"))}</span></div>`;
      if (f.tracking.length === 1) return `<div class="detail-row"><span class="muted">${esc(t("tracking"))}</span>${trackLink(f.tracking[0])}</div>`;

      return `
        <details class="tracking-list">
          <summary class="detail-row"><span class="muted">${esc(t("tracking"))}</span><span>${esc(t("n_tracking").replace("{n}", f.tracking.length))} ▾</span></summary>
          <div class="tracking-all">${f.tracking.map(trackLink).join("")}</div>
        </details>`;
    }

    function sentCard(f) {
      const status = STATUS[f.status] || STATUS.awaiting_label;
      const isOpen = sent.open.has(f.id);

      const body = isOpen ? `
        <div class="card-body">
          ${f.products.map((p) => `
            <div class="prow">
              ${thumb(p.image)}
              <div class="card-text">
                <div class="card-title">${esc(p.name || p.sku)}</div>
                <div class="card-sub">${p.sizes.map((s) => `${esc(s.size)}${s.count > 1 ? ` ×${s.count}` : ""}`).join(" · ")}</div>
              </div>
            </div>`).join("")}
          <div class="detail">
            ${trackingRows(f)}
            ${f.shipped_at ? `<div class="detail-row"><span class="muted">${esc(t("shipped_on"))}</span><span>${esc(niceDate(dayOfStamp(f.shipped_at)))}</span></div>` : ""}
            ${f.invoice ? "" : `<div class="detail-row"><span class="muted">${esc(t("fee_total"))}</span><span class="fee-line">${esc(money(f.fee))} <span class="pill ${f.fee_paid ? "good" : "bad"}">${esc(t(f.fee_paid ? "fee_paid" : "fee_open"))}</span></span></div>`}
          </div>
          ${f.invoice ? `
            <div class="detail">
              <div class="detail-row"><span class="muted">${esc(t("buyer"))}</span><span>${esc(f.invoice.buyer)}</span></div>
              <div class="detail-row"><span class="muted">${esc(t("sale_total"))}</span><span>${esc(money(f.invoice.total))} (${f.pairs} × ${esc(money(f.invoice.price_per_pair))})</span></div>
              <div class="detail-row"><span class="muted">${esc(t("fee_total"))}</span><span>− ${esc(money(f.invoice.fee))}</span></div>
              <div class="detail-row"><span class="muted">${esc(t("you_receive"))}</span><b>${esc(money(f.invoice.you_receive))}</b></div>
              <div class="detail-row"><span class="muted">${esc(t("invoice"))}</span><span>${esc(f.invoice.number || t("st_inv_preparing"))}</span></div>
            </div>
            ${f.invoice.has_pdf ? `<a class="btn file-btn" href="/api/partner/forwards/${encodeURIComponent(f.id)}/invoice" target="_blank" rel="noopener">${esc(t("download"))} ${esc(f.invoice.number)}</a>` : ""}` : ""}
        </div>` : "";

      return `
        <div class="card${isOpen ? " open" : ""}">
          <button class="card-head" type="button" data-sent-open="${esc(f.id)}" aria-expanded="${isOpen}">
            <div class="card-text">
              <div class="card-title">${esc(f.display_id)}</div>
              <div class="stats"><span>${esc(niceDate(dayOfStamp(f.created_at)))}</span><span>${f.pairs} ${esc(t(f.pairs === 1 ? "pair" : "pairs"))}</span>${f.invoice?.buyer ? `<span class="buyer">${esc(f.invoice.buyer)}</span>` : ""}</div>
            </div>
            <div class="pills">
              <span class="pill ${status.tone}">${esc(t(status.word))}</span>
              ${f.invoice ? `<span class="pill inv${f.invoice.stage === "paid" ? " good" : f.invoice.stage === "to_pay" ? " wait" : ""}">${esc(t(`st_inv_${f.invoice.stage}`))}</span>` : ""}
            </div>
            ${CHEV}
          </button>${body}
        </div>`;
    }

    $("sentList").addEventListener("click", (event) => {
      if (event.target.closest("[data-sent-reload]")) return loadSent(true);

      const head = event.target.closest("[data-sent-open]");
      if (!head) return;

      const id = head.dataset.sentOpen;
      if (sent.open.has(id)) sent.open.delete(id);
      else sent.open.add(id);
      renderSent();
    });

    /* ---------- labels he ships himself ---------- */

    // A label we make for a parcel he sends himself: he asks, we make it,
    // he downloads it here. The price comes later, from us.
    const lbl = { data: null, addresses: [], countries: [], view: "list", form: null, bad: [], error: "", notice: "", saving: false, loading: false };

    const ADDRESS_FIELDS = [
      ["name", "f_contact", false, "name"],
      ["company", "f_company", false, "organization"],
      ["street", "f_street", true, "address-line1"],
      ["house_number", "f_house", true, "off"],
      ["address2", "f_address2", false, "address-line2"],
      ["postal_code", "f_zip", true, "postal-code"],
      ["city", "f_city", true, "address-level2"],
      ["phone", "f_phone", true, "tel"],
      ["email", "f_email_opt", false, "email"]
    ];
    const LABEL_STATUS = { requested: ["lbl_requested", "wait"], created: ["lbl_created", "good"], rejected: ["lbl_rejected", "off"] };

    const newForm = () => ({ address_id: lbl.addresses[0]?.id || "", newAddress: lbl.addresses.length ? null : {}, carrier: "", boxes: [""] });

    async function loadLabels(force = false) {
      if (lbl.loading || (!force && lbl.data)) return renderLabels();
      lbl.loading = true;
      if (!lbl.data) $("labelsBody").innerHTML = `<div class="note">${esc(t("loading"))}</div>`;
      try {
        const data = await api("/api/partner/labels");
        lbl.data = data.labels || [];
        lbl.addresses = data.addresses || [];
        lbl.countries = data.countries || [];
      } catch (err) {
        if (err.message === "not_signed_in") return;
        $("labelsBody").innerHTML = `<div class="note">${esc(t("try_again"))}</div>`;
        return;
      } finally {
        lbl.loading = false;
      }
      renderLabels();
    }

    function renderLabels() {
      if (!lbl.data) return;
      $("labelsBody").innerHTML = lbl.view === "form" ? labelForm() : labelList();
    }

    function labelList() {
      const notice = lbl.notice ? `<div class="money-box"><div class="money-row"><span class="ok-text">✓ ${esc(lbl.notice)}</span></div></div>` : "";
      const cards = lbl.data.map((l) => {
        const [word, tone] = LABEL_STATUS[l.status] || LABEL_STATUS.requested;
        const downloads = l.status === "created" ? l.labels.map((x) => `
          <a class="lbl-download" href="/api/partner/labels/${encodeURIComponent(l.id)}/box/${x.box}" target="_blank" rel="noopener">
            <span>${esc(t("download_box"))} · ${esc(t("box_n").replace("{n}", x.box))}</span><small>${esc(x.tracking)}</small>
          </a>`).join("") : "";
        const price = l.price !== null ? `
          <div class="detail"><div class="detail-row"><span class="muted">${esc(t("label_price"))}</span>
            <span class="fee-line">${esc(money(l.price))} <span class="pill ${l.paid ? "good" : "bad"}">${esc(t(l.paid ? "fee_paid" : "fee_open"))}</span></span></div></div>` : "";

        return `
          <div class="card">
            <div class="card-head static">
              <div class="card-text">
                <div class="card-title">${esc(l.number)} · ${esc(l.carrier)}</div>
                <div class="card-sub">${esc(l.ship_to)}</div>
                <div class="stats"><span>${esc(niceDate(dayOfStamp(l.created_at)))}</span><span>${l.boxes} ${esc(t(l.boxes === 1 ? "box_one" : "box_many"))}</span></div>
              </div>
              <span class="pill ${tone}">${esc(t(word))}</span>
            </div>
            ${downloads || l.reject_reason || price ? `<div class="card-body">${downloads}${l.reject_reason ? `<p class="hint">${esc(l.reject_reason)}</p>` : ""}${price}</div>` : ""}
          </div>`;
      }).join("");

      return `
        ${notice}
        <button class="btn primary wide-btn" type="button" data-lblf="open">${esc(t("request_label"))}</button>
        <div class="list" style="margin-top:14px">${cards || `<div class="note">${esc(t("no_labels"))}</div>`}</div>`;
    }

    function labelForm() {
      const f = lbl.form;
      const addressPart = f.newAddress
        ? `<div class="addr-form">
            ${ADDRESS_FIELDS.map(([name, word, required, auto]) => `
              <div class="field${lbl.bad.includes(name) ? " bad" : ""}">
                <label for="la_${name}">${esc(t(word))}${required ? " *" : ""}</label>
                <input id="la_${name}" data-la="${name}" autocomplete="${auto}" value="${esc(f.newAddress[name] || "")}"${name === "phone" ? ' type="tel" inputmode="tel"' : name === "email" ? ' type="email" inputmode="email" autocapitalize="off"' : ""}>
              </div>`).join("")}
            <div class="field${lbl.bad.includes("country") ? " bad" : ""}">
              <label for="la_country">${esc(t("f_country"))} *</label>
              <select id="la_country" data-la="country">
                <option value="">${esc(t("choose_country"))}</option>
                ${lbl.countries.map((c) => `<option value="${esc(c.code)}"${f.newAddress.country === c.code ? " selected" : ""}>${esc(c.name)}</option>`).join("")}
              </select>
            </div>
            ${lbl.addresses.length ? `<button class="link" type="button" data-lblf="pick-address">${esc(t("cancel"))}</button>` : ""}
          </div>`
        : `<select class="buyer-select" id="lblAddress">
            ${lbl.addresses.length
              ? `<option value="">${esc(t("choose_address"))}</option>` + lbl.addresses.map((a) => `<option value="${esc(a.id)}"${a.id === f.address_id ? " selected" : ""}>${esc(a.label)}</option>`).join("")
              : `<option value="">${esc(t("no_addresses_yet"))}</option>`}
          </select>
          <button type="button" class="btn file-btn" data-lblf="new-address">${esc(t("new_address"))}</button>`;

      return `
        <div class="card invoice">
          <div class="card-body">
            <div class="inv-step"><span class="step-n">1</span>${esc(t("ship_to"))}</div>
            ${addressPart}

            <div class="inv-step"><span class="step-n">2</span>${esc(t("carrier"))}</div>
            <div class="carrier-pick">
              ${["UPS", "DPD"].map((c) => `<button type="button" data-carrier="${c}" aria-pressed="${f.carrier === c}">${c}</button>`).join("")}
            </div>

            <div class="inv-step"><span class="step-n">3</span>${esc(t("boxes_title"))}</div>
            <p class="hint">${esc(t("boxes_hint"))}</p>
            ${f.boxes.map((w, i) => `
              <div class="box-row${lbl.bad.includes(`box${i}`) ? " bad" : ""}">
                <span>${esc(t("box_n").replace("{n}", i + 1))}</span>
                <input inputmode="decimal" data-box="${i}" value="${esc(w)}" placeholder="kg">
                ${f.boxes.length > 1 ? `<button class="link" type="button" data-box-drop="${i}" aria-label="${esc(t("remove"))}">✕</button>` : ""}
              </div>`).join("")}
            ${f.boxes.length < 20 ? `<button class="btn file-btn" type="button" data-lblf="add-box">${esc(t("add_box"))}</button>` : ""}

            ${lbl.error ? `<div class="error" style="margin-top:12px">${esc(lbl.error)}</div>` : ""}
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="button" data-lblf="close">${esc(t("back"))}</button>
          <button class="btn primary" type="button" data-lblf="send"${lbl.saving ? " disabled" : ""}>${esc(lbl.saving ? t("sending") : t("send_request"))}</button>
        </div>`;
    }

    // What has to be filled in, in his words, before anything is sent.
    function labelFormProblem() {
      const f = lbl.form;
      lbl.bad = [];
      if (f.newAddress) {
        const a = f.newAddress;
        if (!String(a.name || "").trim() && !String(a.company || "").trim()) lbl.bad.push("name", "company");
        for (const k of ["street", "house_number", "postal_code", "city", "phone", "country"]) if (!String(a[k] || "").trim()) lbl.bad.push(k);
        if (String(a.email || "").trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(a.email).trim())) lbl.bad.push("email");
      } else if (!f.address_id) return t("need_address");
      f.boxes.forEach((w, i) => {
        const n = Number(String(w).replace(",", "."));
        if (!(n > 0) || n > 70) lbl.bad.push(`box${i}`);
      });
      if (lbl.bad.length) return lbl.bad.some((b) => b.startsWith("box")) && !lbl.bad.some((b) => !b.startsWith("box")) ? t("bad_weight") : t("address_missing");
      if (!f.carrier) return t("no_carrier");
      return "";
    }

    async function sendLabelRequest() {
      const problem = labelFormProblem();
      if (problem) {
        lbl.error = problem;
        return renderLabels();
      }

      const f = lbl.form;
      lbl.saving = true;
      lbl.error = "";
      renderLabels();

      try {
        const data = await api("/api/partner/labels", {
          method: "POST",
          body: {
            carrier: f.carrier,
            boxes: f.boxes.map((w) => ({ weight_kg: String(w).replace(",", ".") })),
            ...(f.newAddress ? { address: f.newAddress } : { address_id: f.address_id })
          }
        });
        lbl.data = [data.label, ...lbl.data];
        lbl.addresses = data.addresses || lbl.addresses;
        lbl.view = "list";
        lbl.notice = t("request_sent");
        window.scrollTo(0, 0);
      } catch (err) {
        if (err.message === "not_signed_in") return;
        lbl.error = t(err.message in WORDS.en ? err.message : "try_again");
        if (err.data?.fields) lbl.bad = err.data.fields;
      } finally {
        lbl.saving = false;
        renderLabels();
      }
    }

    $("view-labels").addEventListener("click", (event) => {
      const action = event.target.closest("[data-lblf]")?.dataset.lblf;
      const carrier = event.target.closest("[data-carrier]")?.dataset.carrier;
      const drop = event.target.closest("[data-box-drop]")?.dataset.boxDrop;

      if (carrier) lbl.form.carrier = carrier;
      else if (drop !== undefined) lbl.form.boxes.splice(Number(drop), 1);
      else if (action === "open") { lbl.form = newForm(); lbl.view = "form"; lbl.error = ""; lbl.bad = []; lbl.notice = ""; window.scrollTo(0, 0); }
      else if (action === "close") lbl.view = "list";
      else if (action === "new-address") lbl.form.newAddress = {};
      else if (action === "pick-address") { lbl.form.newAddress = null; lbl.bad = []; }
      else if (action === "add-box") lbl.form.boxes.push(lbl.form.boxes[lbl.form.boxes.length - 1] || "");
      else if (action === "send") return sendLabelRequest();
      else return;

      renderLabels();
    });

    // Typing is kept without redrawing, so the phone keyboard stays open.
    $("view-labels").addEventListener("input", (event) => {
      if (!lbl.form) return;
      if (event.target.dataset.la) lbl.form.newAddress[event.target.dataset.la] = event.target.value;
      if (event.target.dataset.box !== undefined) lbl.form.boxes[Number(event.target.dataset.box)] = event.target.value;
    });

    $("view-labels").addEventListener("change", (event) => {
      if (!lbl.form) return;
      if (event.target.id === "lblAddress") lbl.form.address_id = event.target.value;
      if (event.target.dataset.la) lbl.form.newAddress[event.target.dataset.la] = event.target.value;
    });

    applyLang();
    api("/api/partner/me").then((data) => showApp(data.partner)).catch(() => showLogin());
  </script>
</body>
</html>

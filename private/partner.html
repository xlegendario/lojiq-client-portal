<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08080A">
  <title>Lojiq Partner</title>
  <link rel="icon" href="/favicon.png">
  <style>
    /* Same palette as the store portal and the admin: flat near-black, Lojiq
       blue as the only accent. Built for a phone first; a desktop just gets
       the same column in the middle. */
    :root {
      --bg: #08080A;
      --panel: #121215;
      --panel-2: #17171B;
      --border: #26262B;
      --text: #E9E9EE;
      --muted: #8B8B95;
      --strong: #FFFFFF;
      --primary: #2F80ED;
      --primary-soft: #66B3FF;
      --primary-tint: rgba(102, 179, 255, 0.16);
      --red: #FF7A70;
      --red-bg: rgba(240, 68, 56, 0.16);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    /* Tapping a size fast must add pairs, not zoom in (iPhone double-tap).
       Pinch to zoom still works. */
    html, body, button, a, input, select, label { touch-action: manipulation; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    [hidden] { display: none !important; }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--primary-soft); outline-offset: 2px; }

    /* ---------- shared ---------- */

    .btn {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      font-weight: 600;
      cursor: pointer;
    }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn:disabled { opacity: 0.6; cursor: default; }

    .lang {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 14px;
      cursor: pointer;
    }

    /* ---------- login ---------- */

    .login {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      max-width: 420px;
      margin: 0 auto;
      gap: 20px;
    }
    .login-top { display: flex; justify-content: space-between; align-items: center; }
    .login-top img { width: 112px; height: auto; }
    .login h1 { margin: 0; font-size: 26px; color: var(--strong); }
    .login p { margin: 0; color: var(--muted); }
    .login form { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 14px; color: var(--muted); }
    .field input {
      min-height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 17px;
    }
    .field input:focus { border-color: var(--primary-soft); outline: none; }
    .error { color: var(--red); background: var(--red-bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; }

    /* ---------- app ---------- */

    .app { max-width: 640px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .topbar img { width: 72px; height: auto; }
    .who { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .signout { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 8px 4px; cursor: pointer; }

    .content { padding: 16px 16px calc(160px + var(--safe-bottom)); }
    .content h2 { margin: 0 0 12px; font-size: 22px; color: var(--strong); }
    .soon {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      color: var(--muted);
    }


    /* ---------- stock ---------- */

    .summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: -4px 0 14px; color: var(--muted); font-size: 15px; }
    .summary b { color: var(--strong); font-size: 20px; }

    .search {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 16px;
      margin-bottom: 12px;
    }
    .search:focus { border-color: var(--primary-soft); outline: none; }

    .seg { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
    .seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 15px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border); }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .card-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: none;
      border: 0;
      text-align: left;
      cursor: pointer;
    }
    .thumb { width: 52px; height: 52px; flex: none; border-radius: 10px; background: #fff; object-fit: contain; }
    .thumb.empty { background: var(--panel-2); }
    .card-text { flex: 1; min-width: 0; }
    .card-title { color: var(--strong); font-weight: 600; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .count { flex: none; text-align: right; }
    .count b { display: block; color: var(--strong); font-size: 20px; line-height: 1.1; }
    .count span { color: var(--muted); font-size: 12px; }
    .chev { flex: none; width: 18px; height: 18px; color: var(--muted); transition: transform 0.15s; }
    .card.open .chev { transform: rotate(180deg); }
    .card-body { padding: 0 12px 12px; }

    .sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
    .size {
      min-height: 56px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      padding: 4px;
    }
    .size b { color: var(--strong); font-size: 15px; }
    .size span { color: var(--muted); font-size: 13px; }
    .size[aria-pressed="true"] { border-color: var(--primary-soft); background: var(--primary-tint); }
    .size[aria-pressed="true"] span { color: var(--primary-soft); }

    .detail { margin-top: 10px; background: var(--panel-2); border-radius: 10px; padding: 4px 12px; }
    .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 15px; }
    .detail-row + .detail-row { border-top: 1px solid var(--border); }
    .detail-row .muted { color: var(--muted); }

    .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; margin-top: 3px; }
    .done { color: var(--muted); }
    .card.done .card-title { color: var(--text); }

    .prow { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .prow + .prow { border-top: 1px solid var(--border); }
    .prow .thumb { width: 40px; height: 40px; border-radius: 8px; }
    .prow .card-title { font-size: 14px; font-weight: 500; }
    .prow .count b { font-size: 16px; }

    .day + .day { margin-top: 18px; }
    .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 2px 8px; font-size: 14px; color: var(--muted); }
    .day-head span:first-child { color: var(--strong); font-weight: 600; font-size: 16px; }
    .size.static { cursor: default; }
    .size.empty { opacity: 0.45; }
    .tiles-hint { margin: 8px 0 0; font-size: 13px; }

    .card-sub.where { color: var(--primary-soft); }

    .note { color: var(--muted); text-align: center; padding: 28px 12px; }
    .retry { margin-top: 12px; }

    /* ---------- send pairs ---------- */

    .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .count b.chosen { color: var(--primary-soft); }
    .count span { white-space: nowrap; }
    .size.full { opacity: 0.75; }
    .card-head.static { cursor: default; }

    .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
    .line + .line { border-top: 1px solid var(--border); }
    .line-size { font-size: 16px; color: var(--strong); }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper b { min-width: 36px; text-align: center; font-size: 18px; color: var(--strong); }
    .stepper button {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .stepper button:disabled { opacity: 0.35; cursor: default; }

    details.extra { margin-top: 14px; }
    details.extra summary { padding: 14px 12px; cursor: pointer; color: var(--text); font-weight: 600; }
    details.extra .field { margin-bottom: 12px; }
    .file-btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; }
    .file-name { margin-top: 8px; font-size: 14px; color: var(--muted); word-break: break-all; }
    .link { background: none; border: 0; color: var(--primary-soft); font-size: 14px; cursor: pointer; padding: 4px; }

    .card.labels { margin-top: 14px; }
    .label-row { display: flex; align-items: flex-start; gap: 10px; background: var(--panel-2); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .label-text { flex: 1; min-width: 0; font-size: 14px; }
    .label-text b { display: block; color: var(--strong); word-break: break-all; }
    .label-text .typed { margin-top: 6px; width: 100%; min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-size: 17px; }
    .ok-text { color: #4ADE9A; }
    .bad-text { color: var(--red); }
    .total { margin-top: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 6px 14px; }
    .total div { display: flex; justify-content: space-between; padding: 10px 0; font-size: 16px; }
    .total div + div { border-top: 1px solid var(--border); }
    .total b { color: var(--strong); font-size: 18px; }

    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .actions .btn { flex: 1; }
    .actions .btn.primary { flex: 2; }

    .done-box { text-align: center; padding: 28px 12px 8px; }
    .done-box svg { width: 56px; height: 56px; color: #4ADE9A; }
    .done-box h3 { margin: 10px 0 6px; font-size: 24px; color: var(--strong); }
    .done-box p { margin: 4px 0; }

    .sendbar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(76px + var(--safe-bottom));
      z-index: 6;
      width: calc(100% - 32px);
      max-width: 608px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .sendbar b { font-size: 18px; }
    .sendbar-go { font-weight: 700; white-space: nowrap; }

    /* ---------- sent ---------- */

    .section { margin: 18px 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .section:first-child { margin-top: 0; }
    .pill { flex: none; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
    .pill.wait { background: rgba(245, 158, 11, 0.16); color: #FBBF4C; }
    .pill.move { background: rgba(47, 128, 237, 0.18); color: var(--primary-soft); }
    .pill.good { background: rgba(22, 179, 100, 0.16); color: #4ADE9A; }
    .pill.off { background: rgba(139, 139, 149, 0.16); color: var(--muted); }
    .pill.bad { background: var(--red-bg); color: var(--red); }
    .fee-line { display: inline-flex; align-items: center; gap: 8px; }
    .wide-btn { width: 100%; }
    .carrier-pick { display: flex; gap: 10px; }
    .carrier-pick button { flex: 1; min-height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); font-size: 17px; font-weight: 700; cursor: pointer; }
    .carrier-pick button[aria-pressed="true"] { border-color: var(--primary-soft); background: var(--primary-tint); color: var(--primary-soft); }
    .box-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .box-row span { min-width: 64px; color: var(--muted); }
    .box-row input { flex: 1; min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-size: 17px; }
    .box-row.bad input { border-color: var(--red); }
    .addr-form .field { margin-bottom: 10px; }
    .addr-form select { min-height: 52px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); font-size: 17px; color: var(--text); width: 100%; }
    .lbl-download { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; margin-top: 8px; border-radius: 10px; background: var(--primary-tint); color: var(--primary-soft); text-decoration: none; font-weight: 600; }
    .lbl-download small { color: var(--muted); font-weight: 400; word-break: break-all; }
    .money-box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 2px 14px; margin-bottom: 18px; }
    .money-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 0; }
    .money-row + .money-row { border-top: 1px solid var(--border); }
    .money-row b { font-size: 18px; color: var(--strong); white-space: nowrap; }
    .money-row b.ok-text { color: #4ADE9A; }
    .money-row small { color: var(--muted); font-size: 13px; }
    .tracking-list summary { list-style: none; cursor: pointer; }
    .tracking-list summary::-webkit-details-marker { display: none; }
    .tracking-all { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 0 0 10px; }
    .track { color: var(--primary-soft); text-decoration: none; word-break: break-all; text-align: right; }

    /* ---------- invoice ---------- */

    .card.invoice { margin-top: 14px; }
    .check { display: flex; gap: 12px; align-items: flex-start; padding: 14px 12px; cursor: pointer; }
    .check input { width: 24px; height: 24px; margin: 1px 0 0; flex: none; accent-color: var(--primary); }
    .check b { display: block; color: var(--strong); font-size: 16px; }
    .check small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
    .inv-step { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; font-weight: 600; color: var(--strong); }
    .inv-step + * { margin-bottom: 4px; }
    .step-n { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-tint); color: var(--primary-soft); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
    .card-body > .inv-step:not(:first-child) { margin-top: 18px; }
    .price-field { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; }
    .price-field input { flex: 1; min-width: 0; min-height: 52px; border: 0; background: none; font-size: 22px; font-weight: 600; color: var(--strong); outline: none; }
    .price-field span { color: var(--muted); font-size: 18px; }
    .price-field .per { font-size: 14px; white-space: nowrap; }
    .buyer-chosen { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel-2); border-radius: 12px; padding: 12px 14px; }
    .buyer-chosen b, .buyer-row b { display: block; color: var(--strong); }
    .buyer-chosen small, .buyer-row small { display: block; color: var(--muted); font-size: 13px; word-break: break-word; }
    .buyer-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; max-height: 320px; overflow-y: auto; }
    .buyer-row { text-align: left; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
    .buyer-form .field { margin-bottom: 12px; }
    .buyer-select { width: 100%; min-height: 52px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); font-size: 17px; color: var(--strong); margin-bottom: 8px; }
    .buyer-select:disabled { color: var(--muted); }
    .buyer-sub { margin: 0 2px 10px; }
    .buyer-form select { min-height: 52px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); font-size: 17px; color: var(--text); width: 100%; }
    .field.bad input, .field.bad select { border-color: var(--red); }
    .field.bad label { color: var(--red); }
    .same-box { display: flex; flex-direction: column; gap: 10px; }
    .same-box > b { color: var(--strong); font-size: 17px; }
    .total .receive b { color: #4ADE9A; font-size: 22px; }
    .stats .buyer { color: var(--text); }
    .pills { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
    .pill.inv { background: rgba(102, 179, 255, 0.12); color: var(--primary-soft); font-weight: 500; font-size: 12px; }
    .pill.inv.good { background: rgba(22, 179, 100, 0.16); color: #4ADE9A; }
    .pill.inv.wait { background: rgba(245, 158, 11, 0.16); color: #FBBF4C; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }
    .tabbar-inner { display: flex; width: 100%; max-width: 640px; }
    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 4px 12px;
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .tab svg { width: 24px; height: 24px; }
    .tab[aria-selected="true"] { color: var(--primary-soft); }
  </style>
</head>
<body>

  <!-- ================= login ================= -->
  <main class="login" id="loginView" hidden>
    <div class="login-top">
      <img src="/logo.png" alt="Lojiq">
      <button class="lang" type="button" data-lang-toggle>中文</button>
    </div>
    <div>
      <h1 data-t="login_title">Your stock at Lojiq</h1>
      <p data-t="login_intro">Sign in to see your stock and forward pairs.</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail" data-t="email">E-mail</label>
        <input id="loginEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="off" required>
      </div>
      <div class="field">
        <label for="loginPassword" data-t="password">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>
      <div class="error" id="loginError" role="alert" hidden></div>
      <button class="btn primary" id="loginButton" type="submit" data-t="sign_in">Sign in</button>
    </form>
  </main>

  <!-- ================= app ================= -->
  <div class="app" id="appView" hidden>
    <header class="topbar">
      <img src="/logo.png" alt="Lojiq">
      <span class="who" id="who"></span>
      <button class="lang" type="button" data-lang-toggle>中文</button>
      <button class="signout" type="button" id="signOut" data-t="sign_out">Sign out</button>
    </header>

    <main class="content">
      <section id="view-stock" data-view>
        <h2 data-t="tab_stock">Stock</h2>
        <div class="summary" id="stockSummary"></div>
        <input class="search" id="stockSearch" type="search" autocomplete="off" data-t-placeholder="search_stock">
        <div class="seg" role="group">
          <button type="button" data-stock-mode="product" aria-pressed="true" data-t="by_product">By product</button>
          <button type="button" data-stock-mode="arrival" aria-pressed="false" data-t="by_arrival">By arrival</button>
        </div>
        <div class="list" id="stockList"><div class="note" data-t="loading">Loading…</div></div>
      </section>
      <section id="view-new" data-view hidden>
        <h2 data-t="tab_new">Send pairs</h2>
        <div id="sendSearchWrap"><input class="search" id="sendSearch" type="search" autocomplete="off" data-t-placeholder="search_stock"></div>
        <div id="sendBody"><div class="note" data-t="loading">Loading…</div></div>
      </section>
      <section id="view-sent" data-view hidden>
        <h2 data-t="tab_sent">Forwards</h2>
        <div id="sentList"><div class="note" data-t="loading">Loading…</div></div>
      </section>
      <section id="view-labels" data-view hidden>
        <h2 data-t="tab_labels">Labels</h2>
        <div id="labelsBody"><div class="note" data-t="loading">Loading…</div></div>
      </section>
    </main>

    <button class="sendbar" id="sendBar" type="button" hidden>
      <span id="sendBarText"></span>
      <span class="sendbar-go" data-t="next">Next</span>
    </button>

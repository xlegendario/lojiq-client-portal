<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>API Access</title>
  <!--
    One page, served by both portals, and only to someone signed in: the
    documentation is not public. The server replaces the config placeholder
    below with where this portal's keys live and what to call the brand.
  -->
  <script>window.API_ACCESS = __API_ACCESS_CONFIG__;</script>
  <style>
    /*
      Dark, like both dashboards, with each portal's own accent colour. The
      server picks the theme; no portal's name appears in this file, because
      both serve it and anyone can read a page's source.
    */
    :root {
      --bg: #0b0b0d;
      --panel: #121215;
      --panel-2: #17171b;
      --ink: #e9e9ee;
      --muted: #8b8b95;
      --line: #26262b;
      --soft: #1a1a1f;
      --accent: #2f80ed;
      --accent-ink: #04121f;
      --good: #4ade80;
      --good-bg: rgba(74, 222, 128, 0.12);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.10);
      --bad: #f87171;
      --bad-bg: rgba(248, 113, 113, 0.12);
      --info: #7cb4ff;
      --info-bg: rgba(124, 180, 255, 0.12);
      --code-bg: #08080a;
      --code-ink: #e9e9ee;
      --radius: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body[data-theme="gold"] {
      --bg: #070707;
      --panel: #101010;
      --panel-2: #141414;
      --line: #1f1f1f;
      --soft: #161616;
      --accent: #ffcc00;
      --accent-ink: #0a0a0a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    a { color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .topbar a.back { font-size: 14px; color: var(--muted); text-decoration: none; }
    .topbar a.back:hover { color: var(--accent); }
    .topbar h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
    .topbar .who { margin-left: auto; font-size: 13px; color: var(--muted); }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 28px 80px; }

    .tabs {
      display: inline-flex;
      padding: 4px;
      margin-bottom: 22px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .tabs button {
      border: 0;
      background: transparent;
      padding: 8px 26px;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 18px;
    }

    .card h2 { margin: 0 0 6px; font-size: 19px; letter-spacing: -0.01em; }
    .card h3 { margin: 22px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .card > p:first-of-type { margin-top: 0; }
    .lead { color: var(--muted); margin: 0 0 16px; }

    .endpoint-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }

    .method {
      font: 700 12px/1 var(--mono);
      padding: 5px 8px;
      border-radius: 6px;
      color: #fff;
      background: #2f6fd6;
    }

    .method.POST { background: #1f8a55; }
    .method.PATCH { background: #9a6a00; }
    .method.DELETE { background: #b5382e; }

    .path { font: 600 14px var(--mono); }

    .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .toc a {
      font-size: 13px;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
    }
    .toc a:hover { border-color: var(--accent); color: var(--accent); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--soft); font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td code, p code, li code { font: 12.5px var(--mono); background: var(--soft); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }

    .code {
      position: relative;
      margin: 8px 0 0;
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: 10px;
      overflow: hidden;
    }

    .code pre { margin: 0; padding: 16px 18px; overflow-x: auto; font: 12.5px/1.6 var(--mono); }
    .code .label { padding: 8px 18px 0; font: 600 11px var(--mono); color: #9a9aa6; text-transform: uppercase; letter-spacing: .05em; }

    .copy {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--code-ink);
      font: 600 12px inherit;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
    }

    .copy:hover { border-color: var(--accent); color: var(--accent); }

    .notes { margin: 12px 0 0; padding: 12px 16px 12px 32px; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; }
    .notes li + li { margin-top: 4px; }

    .callout { padding: 14px 16px; border-radius: 10px; font-size: 14px; margin: 0 0 14px; }
    .callout.warn { background: var(--warn-bg); color: var(--warn); }
    .callout.good { background: var(--good-bg); color: var(--good); }
    .callout.bad { background: var(--bad-bg); color: var(--bad); }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 820px) { .two { grid-template-columns: 1fr; } .wrap { padding: 18px 14px 60px; } .topbar { padding: 12px 14px; } }

    /* Manage Keys */
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font: 600 13px inherit;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.danger { color: var(--bad); }
    .btn.danger:hover { border-color: var(--bad); }
    .btn:disabled { opacity: .5; cursor: default; }

    form.inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 16px; }
    label.field { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
    input[type=text], input[type=url], select {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--ink);
      min-width: min(220px, 100%);
      max-width: 100%;
    }
    input[type=url] { min-width: min(340px, 100%); }
    fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 12px; flex-wrap: wrap; }
    fieldset label { font-size: 13px; display: flex; gap: 6px; align-items: center; }

    .badge { display: inline-block; font: 700 11px/1 var(--mono); padding: 4px 7px; border-radius: 6px; text-transform: uppercase; }
    .badge.live { background: var(--good-bg); color: var(--good); }
    .badge.test { background: var(--info-bg); color: var(--info); }
    .badge.off { background: var(--bad-bg); color: var(--bad); }
    .badge.muted { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }

    .reveal {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      background: var(--warn-bg);
      border-radius: 10px;
    }

    .reveal strong { display: block; margin-bottom: 8px; color: var(--warn); }
    .secret { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .secret code { font: 13px var(--mono); color: var(--ink); background: var(--code-bg); border: 1px solid rgba(251, 191, 36, 0.35); padding: 8px 10px; border-radius: 8px; word-break: break-all; flex: 1; }

    .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
    .muted { color: var(--muted); }
    .small { font-size: 12.5px; }
    .error { color: var(--bad); font-size: 13.5px; margin-top: 10px; min-height: 1em; }

    .deliveries { margin-top: 8px; }

    /* Chapters */
    .chapter { margin-top: 34px; }
    .chapter-head { border-color: var(--accent); }
    .eyebrow { display: block; font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 4px; }
    .chapter-head h2 { font-size: 24px; }
    .flow { margin: 0 0 18px; padding-left: 22px; }
    .flow li + li { margin-top: 4px; }
    .section-title { margin: 26px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .toc a .method { font-size: 10px; padding: 3px 5px; margin-right: 4px; }
    .chapters-overview { margin: 4px 0 18px; }
    .chapter-link { display: grid; gap: 4px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); text-decoration: none; }
    .chapter-link:hover { border-color: var(--accent); }
    .chapter-link strong { font-size: 16px; color: var(--accent); }
    .chapter-link span { font-size: 13.5px; color: var(--muted); }
    .event-group { display: grid; gap: 6px; }

    /* Endpoints fold open, so a chapter reads as a list first */
    details.endpoint { padding: 0; }
    details.endpoint > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 18px;
      cursor: pointer;
      list-style: none;
    }
    details.endpoint > summary::-webkit-details-marker { display: none; }
    details.endpoint > summary::after { content: "+"; margin-left: auto; color: var(--muted); font: 600 18px var(--mono); }
    details.endpoint[open] > summary::after { content: "-"; }
    details.endpoint > summary:hover .summary-title { color: var(--accent); }
    .summary-title { color: var(--muted); font-size: 14px; }
    .endpoint-body { padding: 0 18px 18px; }
    .endpoint-body > .lead { margin-top: 0; }
    details.endpoint { margin-bottom: 8px; }

    /* Step lists */
    .timeline { list-style: none; counter-reset: step; margin: 6px 0 0; padding: 0; }
    .timeline > li { position: relative; counter-increment: step; padding: 0 0 18px 44px; display: grid; gap: 4px; }
    .timeline > li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 700 13px var(--mono);
      background: var(--soft);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .timeline > li:not(:last-child)::after { content: ""; position: absolute; left: 14px; top: 30px; bottom: 2px; width: 1px; background: var(--line); }
    .timeline > li > span { color: var(--muted); font-size: 14px; }
    .timeline .code { margin-top: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .chip { font: 12px var(--mono); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); }
    .chip.call { color: var(--info); }
    .chip.manual { font-family: inherit; color: var(--warn); background: var(--warn-bg); border-color: transparent; }
    .chip.status { color: var(--ink); }
    .chip.event { color: var(--good); }
    .card h3 code { text-transform: none; font-size: 13px; }
    .event-group > span { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-theme="blue">
  <header class="topbar">
    <a class="back" id="backLink" href="/">&larr; Dashboard</a>
    <h1>API Access</h1>
    <span class="who" id="who"></span>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-tab="docs">Docs</button>
      <button type="button" role="tab" aria-selected="false" data-tab="keys">Manage Keys</button>
    </div>

    <section id="tab-docs"></section>
    <section id="tab-keys" hidden></section>
  </main>

  <script>
    (function () {
      "use strict";

      const CONFIG = window.API_ACCESS || {};
      const API = CONFIG.apiBase || `${location.origin}/api/v1`;
      const KEYS = CONFIG.keysBase || "/api/seller-api";
      const BRAND = CONFIG.brand || "Seller";

      document.body.dataset.theme = CONFIG.theme === "gold" ? "gold" : "blue";

      document.title = `API Access · ${BRAND}`;
      if (CONFIG.backUrl) document.getElementById("backLink").href = CONFIG.backUrl;
      if (CONFIG.accountLabel) document.getElementById("who").textContent = CONFIG.accountLabel;

      /* ---------------- helpers ---------------- */

      const esc = (value) =>
        String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      const when = (iso) => {
        if (!iso) return "—";
        const d = new Date(iso);
        return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      };

      function codeBlock(content, label) {
        return `
          <div class="code">
            ${label ? `<div class="label">${esc(label)}</div>` : ""}
            <button class="copy" type="button" data-copy>Copy</button>
            <pre>${esc(content)}</pre>
          </div>`;
      }

      function paramTable(rows) {
        if (!rows || !rows.length) return "";

        return `
          <div class="table-wrap"><table>
            <thead><tr><th>Param</th><th>In</th><th>Required</th><th>Type</th><th>Allowed</th><th>Description</th></tr></thead>
            <tbody>${rows.map((r) => `
              <tr>
                <td><code>${esc(r[0])}</code></td>
                <td>${esc(r[1])}</td>
                <td>${esc(r[2])}</td>
                <td>${esc(r[3])}</td>
                <td>${esc(r[4])}</td>
                <td>${esc(r[5])}</td>
              </tr>`).join("")}
            </tbody>
          </table></div>`;
      }

      const json = (value) => JSON.stringify(value, null, 2);
      const curlHeaders = (extra = "") =>
        `  -H "Authorization: Bearer <api_key>" \\\n  -H "Accept: application/json"${extra}`;

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-copy]");
        if (!button) return;

        const pre = button.parentElement.querySelector("pre, code");

        try {
          await navigator.clipboard.writeText(pre.textContent);
          button.textContent = "Copied";
        } catch {
          button.textContent = "Select and copy";
        }

        setTimeout(() => { button.textContent = "Copy"; }, 1600);
      });

      /* ---------------- docs ---------------- */

      const SAMPLE_SALE = {
        id: "7e1d3c7a-0f42-4b86-9a52-2f7f1c1a9b10",
        status: "active",
        sku: "DZ5485-612",
        size: "42",
        product_name: "Jordan 1 Retro High OG Chicago Lost and Found",
        amount: 180,
        currency: "EUR",
        source: "order",
        reference: "7454",
        fulfillment_status: "Requested Label",
        shipping_status: null,
        payment_status: "To Pay",
        tracking_number: "05162999841548",
        tracking_url: "https://tracking.dpd.de/status/en_NL/parcel/05162999841548",
        label_available: true,
        sale_date: "2026-09-14T09:49:43.000Z",
        updated_at: "2026-09-14T10:05:00.000Z"
      };

      const SAMPLE_WTB = {
        id: "3b0c8e52-6a1f-4d7e-9b24-5f8a1c2d3e40",
        wtb_id: "MWTB-000422",
        sku: "M2002RDB",
        size: "46.5",
        product_name: "New Balance 2002R Protection Pack Phantom",
        brand: "New Balance",
        max_price: 150,
        inventory_type: "all",
        is_open: true,
        purchase_status: "Offers Sent",
        fulfillment_status: "Outsource",
        payment_status: "Pending",
        invoice_amount: null,
        currency: "EUR",
        shipping_status: null,
        tracking_number: null,
        tracking_url: null,
        placed_at: "2026-09-02T09:58:57.000Z",
        updated_at: "2026-09-02T09:58:57.000Z"
      };

      const SAMPLE_WTB_SHIPPED = {
        ...SAMPLE_WTB,
        is_open: false,
        purchase_status: "Confirmed",
        fulfillment_status: "Fulfilled",
        payment_status: "Paid",
        invoice_amount: 143,
        shipping_status: "Shipped",
        tracking_number: "05145107551456",
        tracking_url: "https://www.dpdgroup.com/nl/mydpd/my-parcels/incoming?parcelNumber=05145107551456",
        updated_at: "2026-09-05T14:00:00.000Z"
      };

      const PAGINATION = { current_page: 1, per_page: 50, total: 1, last_page: 1, has_more_pages: false };

      /*
        Two chapters, because they are two different jobs:

          Consignment   you sell: you list stock, you see what sold, you ship
          Want To Buys  you buy: you post what you want and follow it until
                        the pair arrives

        Each chapter explains itself in the order a partner needs it: how it
        works, what the object means, what every status means, and only then
        the endpoints.
      */
      const CHAPTERS = [
        {
          id: "consignment",
          title: "Consignment",
          intro: "For selling. List the pairs you have, see which of them sold, and ship them with our label. Your account needs to be approved as a consignor to list stock.",
          flow: [
            { title: "List your stock", text: "Send your pairs with a price. Update or remove them whenever your stock changes.", call: "POST /inventory" },
            { title: "A pair sells", text: "The sale appears in your feed. Take the pair off anywhere else you sell it.", event: "sale.created", status: "fulfillment_status: Allocated" },
            { title: "Request the label", text: "One call. Some labels are ready within seconds, others take a little longer.", call: "POST /sales/{id}/request-label", status: "fulfillment_status: Requested Label" },
            { title: "Download and ship", text: "Download the PDF, pack the pair and hand it to the carrier.", call: "GET /sales/{id}/label", event: "label.ready", status: "fulfillment_status: Ready to Ship" },
            { title: "On its way", text: "The carrier scans the parcel and tracking starts.", event: "sale.shipped", status: "shipping_status: Shipped" },
            { title: "Delivered", text: "The buyer has the pair.", event: "sale.delivered", status: "shipping_status: Delivered" },
            { title: "Paid out", text: "Your payout for this sale is paid.", event: "sale.paid_out", status: "payment_status: Paid" }
          ],
          sections: ["Inventory", "Sales", "Labels"],
          object: {
            name: "Sale",
            fields: [
              ["id", "uuid", "Stays the same for the life of the sale. Use it for the label calls."],
              ["status", "string", "active or cancelled. A cancelled sale is never shipped."],
              ["sku, size, product_name", "string", "The pair you sold."],
              ["amount", "number", "Your payout for this pair in EUR."],
              ["source", "string", "order: a shop customer bought it. member_wtb: it filled somebody's want-to-buy. You ship both the same way."],
              ["reference", "string", "The order number or want-to-buy number, handy when you contact support."],
              ["fulfillment_status", "string", "Where the deal is. See the statuses below."],
              ["shipping_status", "string or null", "Where the parcel is. null until a parcel exists."],
              ["payment_status", "string or null", "The status of your payout."],
              ["tracking_number, tracking_url", "string or null", "Filled once the label is made."],
              ["label_available", "boolean", "true when GET /sales/{id}/label will return the PDF."],
              ["sale_date", "datetime", "When it sold."],
              ["updated_at", "datetime", "Last time anything in this sale changed."]
            ]
          },
          statuses: [
            {
              field: "fulfillment_status",
              rows: [
                ["Allocated", "Sold to you. Nothing shipped yet.", "Request the label. For source member_wtb, wait until the buyer has paid (the request tells you)."],
                ["Awaiting Label", "Sold, waiting for a label. Same as Allocated.", "Request the label."],
                ["Requested Label", "The label is being made.", "Wait for label.ready."],
                ["Ready to Ship", "The label is available.", "Download it and ship the pair."],
                ["Fulfilled", "Shipped. From here, follow shipping_status.", "Nothing."],
                ["Store Fulfilled", "The shop sent this order from its own stock. status is cancelled too.", "Do not ship this pair."],
                ["Cancelled", "The deal is off. status is cancelled too.", "Do not ship. If you already did, contact support."]
              ]
            },
            {
              field: "shipping_status",
              rows: [
                ["null", "No parcel yet.", ""],
                ["Pending", "The label exists, the carrier has not scanned the parcel yet.", "Ship it."],
                ["Shipped", "The parcel is on its way.", "Nothing."],
                ["Delivered", "The buyer has the pair.", "Nothing."]
              ]
            },
            {
              field: "payment_status",
              rows: [
                ["To Pay", "Your payout is still to be paid.", "Nothing."],
                ["Paid", "Your payout is paid.", "Nothing."],
                ["null", "No payout is recorded for this sale.", "Contact support if you expect one."]
              ]
            }
          ],
          events: [
            ["sale.created", "You sold a pair", "Book the sale, take the pair off your own shop"],
            ["label.ready", "The shipping label can be downloaded", "Download it and ship"],
            ["sale.shipped", "The carrier scanned the parcel", ""],
            ["sale.delivered", "The buyer received the pair", ""],
            ["sale.paid_out", "Your payout for this sale is paid", ""],
            ["sale.cancelled", "The sale was cancelled", "Do not ship"],
            ["sale.updated", "Anything else changed, such as the tracking number or the amount", "Check changes"]
          ]
        },
        {
          id: "want-to-buys",
          title: "Want To Buys",
          intro: "For buying. Post the pairs you are looking for, and follow each one until it is delivered to you.",

      const VERIFY_NODE = `import crypto from "crypto";

// Use the raw request body, before any JSON parsing.
function isGenuineWebhook(rawBody, headers, secret) {
  const timestamp = headers["x-webhook-timestamp"];
  const signature = headers["x-webhook-signature"] || "";

  // Reject anything older than five minutes: a captured
  // delivery cannot be replayed later.
  if (Math.abs(Date.now() / 1000 - Number(timestamp)) > 300) return false;

  const expected = "sha256=" + crypto
    .createHmac("sha256", secret)
    .update(\`\${timestamp}.\${rawBody}\`)
    .digest("hex");

  return expected.length === signature.length &&
    crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(signature));
}`;

          <div class="card">
            <h2>${esc(BRAND)} API</h2>
            <p class="lead">Connect your own systems. The API has two parts; use either or both with the same key.</p>

            <div class="two chapters-overview">
              ${CHAPTERS.map((c) => `
                <a class="chapter-link" href="#${c.id}">
                  <strong>${esc(c.title)}</strong>
                  <span>${esc(c.intro)}</span>
                </a>`).join("")}
            </div>

            <div class="table-wrap"><table>
              <thead><tr><th>Base URL</th></tr></thead>
              <tbody><tr><td><code>${esc(API)}</code></td></tr></tbody>
            </table></div>
          </div>

          <div class="card" id="quickstart">
            <h2>Quickstart</h2>
            <p class="lead">Your first call in two minutes. A test key never touches anything real, so try whatever you like.</p>
            <ol class="timeline steps">
              <li>
                <strong>Create a test key</strong>
                <span>Open <a href="#keys" data-open-keys>Manage Keys</a>, choose Test and copy the key. It starts with <code>sk_test_</code>.</span>
              </li>
              <li>
                <strong>Make a call</strong>
                <span>Replace <code>&lt;api_key&gt;</code> with your key.</span>
                ${codeBlock(`curl "${API}/sales" \\\n  -H "Authorization: Bearer <api_key>"`, "Request")}
              </li>
              <li>
                <strong>Read the answer</strong>
                <span>A test key returns sample data in exactly the live shape.</span>
                ${codeBlock(json({ success: true, data: { items: [SAMPLE_SALE], pagination: PAGINATION }, meta: { next_updated_since: SAMPLE_SALE.updated_at } }), "Response")}
              </li>
              <li>
                <strong>Go live</strong>
                <span>When your integration works, create a live key and swap it in. Nothing else changes.</span>
              </li>
            </ol>
          </div>

          ${CHAPTERS.map(renderChapter).join("")}

          <div class="chapter" id="reference">
            <div class="card chapter-head">
              <span class="eyebrow">Reference</span>
              <h2>For every call</h2>
              <nav class="toc">
                <a href="#auth">Authentication</a>
                <a href="#conventions">Responses and errors</a>
                <a href="#polling">Keeping up to date</a>
                <a href="#webhooks">Webhooks</a>
              </nav>
            </div>

            <div class="card" id="auth">
              <h2>Authentication</h2>
              <p>Send your API key with every request. Create keys under <strong>Manage Keys</strong>.</p>
              ${paramTable([
                ["Authorization", "header", "Yes", "string", "Bearer sk_live_… or Bearer sk_test_…", "Your API key"],
                ["Accept", "header", "Recommended", "string", "application/json", "JSON response"],
                ["Content-Type", "header", "For bodies", "string", "application/json", "On POST, PATCH and DELETE with a body"]
              ])}
              <h3>Live and test keys</h3>
              <ul class="notes">
                <li><code>sk_live_</code> keys act on your real account. A want-to-buy placed with one goes out to real sellers.</li>
                <li><code>sk_test_</code> keys use a separate sandbox: stock and want-to-buys you place are stored apart and reach no one.</li>
                <li>With a test key, the sales feed returns two sample sales, the label endpoint returns a sample PDF, and a label request is simulated. The want-to-buy feed shows your test want-to-buys plus one sample purchase that has been paid and shipped.</li>
                <li>Each response carries <code>X-Api-Mode: live</code> or <code>test</code>, so you can always see which one you used.</li>
              </ul>
              <h3>Rate limits</h3>
              <ul class="notes">
                <li>100 requests per minute per key.</li>
                <li>Over the limit you get <code>429</code>. Wait for the number of seconds in <code>Retry-After</code>, and back off further if it happens again.</li>
                <li>Every response carries <code>X-RateLimit-Limit</code> and <code>X-RateLimit-Remaining</code>.</li>
              </ul>
            </div>

            <div class="card" id="conventions">
              <h2>Responses and errors</h2>
              <ul class="notes">
                <li>Every JSON response has <code>success</code>. On success the result is in <code>data</code>; on failure there is a <code>message</code> you can show, sometimes with a <code>code</code> you can check.</li>
                <li>Lists return <code>data.items</code> and <code>data.pagination</code> with <code>current_page</code>, <code>per_page</code>, <code>total</code>, <code>last_page</code> and <code>has_more_pages</code>.</li>
                <li>Amounts are in EUR, as numbers. Sizes are EU: <code>42</code>, <code>42.5</code>, <code>37 1/3</code>, or a clothing size like <code>M</code>. Timestamps are ISO-8601 in UTC.</li>
              </ul>
              ${simpleTable(["Status", "Meaning", "What you do"], [
                ["200", "It worked.", ""],
                ["400", "Something in your request is invalid. message says what.", "Fix the request."],
                ["401", "No key, a malformed key, or a revoked key.", "Check the Authorization header."],
                ["403", "Your account may not do this, for example listing stock without consignor approval.", "Contact support."],
                ["404", "Not found, or not yours.", "Check the id."],
                ["409", "Not possible right now, for example a label for a cancelled sale.", "Read message and code."],
                ["429", "Too many requests.", "Wait Retry-After seconds."],
                ["5xx", "Something went wrong on our side.", "Try again later; contact support if it keeps happening."]
              ])}
            </div>

            <div class="card" id="polling">
              <h2>Keeping up to date</h2>
              <p class="lead">Both feeds work the same way. Use polling, webhooks, or both.</p>
              <ol class="timeline steps">
                <li><strong>First run</strong><span>Call <code>GET /sales</code> or <code>GET /want-to-buys</code> without <code>updated_since</code> and page through everything.</span></li>
                <li><strong>Remember where you are</strong><span>Store <code>meta.next_updated_since</code> from the last page.</span></li>
                <li><strong>Every few minutes</strong><span>Call again with <code>updated_since</code> set to that value. You get only what changed, oldest change first.</span></li>
                <li><strong>De-duplicate</strong><span><code>updated_since</code> is inclusive, so the last row can come back once more. Skip rows whose <code>id</code> and <code>updated_at</code> you already have.</span></li>
              </ol>
              <p class="small muted">The feeds are refreshed every few minutes. Changes you make through the API itself show up at once.</p>
            </div>

            <div class="card" id="webhooks">
              <h2>Webhooks</h2>
              <p class="lead">Have events sent to your own endpoint the moment we see them. Add one under <strong>Manage Keys</strong> and pick the events it should receive.</p>

              <h3>How events work</h3>
              <ul class="notes">
                <li>Each moment worth acting on has its own event, such as <code>sale.paid_out</code> or <code>want_to_buy.shipped</code>. Subscribe to only the ones you need.</li>
                <li>Any other change is sent as <code>sale.updated</code> or <code>want_to_buy.updated</code>.</li>
                <li>A specific event is sent <em>instead of</em> the .updated one, never as well. A cancellation is only ever <code>.cancelled</code>.</li>
                <li><code>data.changes</code> lists every field that changed, so you never have to compare with what you had.</li>
                <li><code>data.item</code> is the full, current object, the same as in the feed.</li>
              </ul>

              <h3>Events</h3>
              ${CHAPTERS.map((c) => `<p class="small muted">${esc(c.title)}</p>${eventTable(c.events)}`).join("")}

              <h3>A delivery</h3>
              ${codeBlock(`POST https://your-endpoint.example.com/webhooks
Content-Type: application/json
X-Webhook-Event: sale.paid_out
X-Webhook-Delivery: 2c9a1f0e-5b6d-4e21-8f3a-7d9e0b1c2a34
X-Webhook-Timestamp: 1757844300
X-Webhook-Signature: sha256=5f0c…`, "Headers")}
              ${codeBlock(json({ id: "b8e3f2a1-7c4d-4e5f-9a6b-1c2d3e4f5a6b", type: "sale.paid_out", created_at: "2026-09-20T10:05:00.000Z", data: { item: { ...SAMPLE_SALE, fulfillment_status: "Fulfilled", shipping_status: "Delivered", payment_status: "Paid", updated_at: "2026-09-20T10:05:00.000Z" }, changes: ["payment_status"] } }), "Body")}

              <h3>Verify the signature</h3>
              <p>Check every delivery before trusting it. The signature is an HMAC-SHA256 of <code>&lt;timestamp&gt;.&lt;raw body&gt;</code> with your webhook secret.</p>
              ${codeBlock(VERIFY_NODE, "Node.js")}

              <h3>Rules</h3>
              <ul class="notes">
                <li>Answer with any <code>2xx</code> within 10 seconds. Do the real work afterwards.</li>
                <li>Failed deliveries are retried after 1 minute, 5 minutes, 30 minutes, 2 hours, 6 hours and 12 hours.</li>
                <li>After 5 deliveries in a row fail every retry, the webhook is switched off. Turn it back on under Manage Keys.</li>
                <li>The same event can arrive more than once. De-duplicate on the event <code>id</code>.</li>
                <li>Only public <code>https</code> addresses are accepted, and redirects are not followed.</li>
              </ul>

              <h3>Send a test event</h3>
              <p>Sends a signed sample of the event you choose, marked <code>"test": true</code>, to all your active webhooks, and returns what each endpoint answered. Manage Keys has a button for this too.</p>
              ${codeBlock(`curl -X POST "${API}/webhooks/test" \\\n${curlHeaders(` \\\n  -H "Content-Type: application/json"`)} \\\n  -d '{"type": "want_to_buy.shipped"}'`, "Request")}
              ${codeBlock(json({ success: true, data: { items: [{ webhook_id: "0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d", event_type: "want_to_buy.shipped", delivered: true, status_code: 200, error: null }] } }), "Success")}
            </div>
          </div>`;
      }

      // A link to an endpoint opens it, wherever it is on the page.
      function openFromHash() {
        const target = location.hash.length > 1 ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;

        if (target && target.tagName === "DETAILS") {
          target.open = true;
          target.scrollIntoView();
        }
      }

      window.addEventListener("hashchange", openFromHash);

      /* ---------------- manage keys ---------------- */

      async function call(method, path, body) {
        const res = await fetch(KEYS + path, {
          method,
          credentials: "same-origin",
          headers: body ? { "Content-Type": "application/json", Accept: "application/json" } : { Accept: "application/json" },
          body: body ? JSON.stringify(body) : undefined
        });

        const data = await res.json().catch(() => ({}));

        if (res.status === 401) {
          throw Object.assign(new Error("Your session has expired. Log in again to manage keys."), { expired: true });
        }

        if (!res.ok || data.success === false) {
          throw new Error(data.message || data.error || `Request failed (${res.status})`);
        }

        return data.data;
      }


      function renderKeysShell() {
        document.getElementById("tab-keys").innerHTML = `
          <div class="card">
            <h2>API keys</h2>
            <p class="lead">A key is shown once, when you create it. Store it somewhere safe; if it leaks, revoke it and create a new one.</p>
            <div id="keysList"><p class="empty">Loading…</p></div>
            <form class="inline" id="keyForm">
              <label class="field">Name
                <input type="text" name="name" maxlength="60" placeholder="e.g. Shopify sync" />
              </label>
              <label class="field">Mode
                <select name="mode">
                  <option value="test">Test (sandbox)</option>
                  <option value="live">Live</option>
                </select>
              </label>
              <button class="btn primary" type="submit">Create key</button>
            </form>
            <div id="keyReveal"></div>
            <div class="error" id="keyError"></div>
          </div>

          <div class="card">
            <h2>Webhooks</h2>
            <p class="lead">Events sent to your endpoint as they happen. The secret is shown once and signs every delivery.</p>
            <div id="hooksList"><p class="empty">Loading…</p></div>
            <form class="inline" id="hookForm">
              <label class="field">Endpoint URL
                <input type="url" name="url" required placeholder="https://your-endpoint.example.com/webhooks" />
              </label>
              ${CHAPTERS.map((c) => `
                <fieldset class="event-group">
                  <span>${esc(c.title)}</span>
                  ${c.events.map(([e]) => `<label><input type="checkbox" name="events" value="${e}" checked /> <code>${e}</code></label>`).join("")}
                </fieldset>`).join("")}
              <button class="btn primary" type="submit">Add webhook</button>
            </form>
            <div id="hookReveal"></div>
            <div class="error" id="hookError"></div>
          </div>`;

        document.getElementById("keyForm").addEventListener("submit", createKey);
        document.getElementById("hookForm").addEventListener("submit", createHook);
      }

      function reveal(targetId, title, value, extra) {
        document.getElementById(targetId).innerHTML = `
          <div class="reveal">
            <strong>${esc(title)}</strong>
            <div class="secret">
              <code>${esc(value)}</code>
              <button class="btn" type="button" data-copy>Copy</button>
            </div>
            <p class="small muted">${esc(extra)}</p>
          </div>`;
      }

      function showError(targetId, err) {
        const el = document.getElementById(targetId);
        el.textContent = err.message;

        if (err.expired && CONFIG.loginUrl) {
          el.innerHTML = `${esc(err.message)} <a href="${esc(CONFIG.loginUrl)}">Log in</a>`;
        }
      }

      async function loadKeys() {
        const box = document.getElementById("keysList");

        try {
          const { items } = await call("GET", "/keys");

          if (!items.length) {
            box.innerHTML = `<p class="empty">No keys yet. Start with a test key.</p>`;
            return;
          }

          box.innerHTML = `
            <div class="table-wrap"><table>
              <thead><tr><th>Name</th><th>Mode</th><th>Key</th><th>Created</th><th>Last used</th><th>Status</th><th></th></tr></thead>
              <tbody>${items.map((k) => `
                <tr>
                  <td>${esc(k.name || "—")}</td>
                  <td><span class="badge ${k.mode === "live" ? "live" : "test"}">${esc(k.mode)}</span></td>
                  <td><code>${esc(k.key_prefix)}…</code></td>
                  <td>${when(k.created_at)}</td>
                  <td>${when(k.last_used_at)}</td>
                  <td>${k.revoked_at ? `<span class="badge off">revoked</span>` : `<span class="badge muted">active</span>`}</td>
                  <td>${k.revoked_at ? "" : `<button class="btn danger" type="button" data-revoke="${esc(k.id)}" data-name="${esc(k.name || k.key_prefix)}">Revoke</button>`}</td>
                </tr>`).join("")}
              </tbody>
            </table></div>`;
        } catch (err) {
          box.innerHTML = "";
          showError("keyError", err);
        }
      }

      async function createKey(event) {
        event.preventDefault();

        const form = event.currentTarget;
        const button = form.querySelector("button");
        const mode = form.mode.value;

        if (mode === "live" && !confirm("A live key acts on your real account: want-to-buys placed with it go out to real sellers. Create it?")) return;

        button.disabled = true;
        document.getElementById("keyError").textContent = "";

        try {
          const created = await call("POST", "/keys", { name: form.name.value, mode });

          reveal("keyReveal", `Your new ${created.mode} key — copy it now, it will not be shown again`, created.key, "Send it as: Authorization: Bearer <key>");
          form.reset();
          await loadKeys();
        } catch (err) {
          showError("keyError", err);
        } finally {
          button.disabled = false;
        }
      }

      async function loadHooks() {
        const box = document.getElementById("hooksList");

        try {
          const { items } = await call("GET", "/webhooks");

          if (!items.length) {
            box.innerHTML = `<p class="empty">No webhooks yet.</p>`;
            return;
          }

          box.innerHTML = `
            <div class="table-wrap"><table>
              <thead><tr><th>Endpoint</th><th>Events</th><th>Status</th><th>Last success</th><th>Last failure</th><th></th></tr></thead>
              <tbody>${items.map((h) => `
                <tr>
                  <td><code>${esc(h.url)}</code></td>
                  <td class="small">${h.events.map((e) => `<code>${esc(e)}</code>`).join(" ")}</td>
                  <td>${h.active
                    ? `<span class="badge muted">active</span>`
                    : `<span class="badge off">off</span><div class="small muted">${esc(h.disabled_reason || "")}</div>`}</td>
                  <td>${when(h.last_success_at)}</td>
                  <td>${when(h.last_failure_at)}</td>
                  <td>
                    <div class="row-actions">
                      <button class="btn" type="button" data-test="${esc(h.id)}" data-test-type="${esc(h.events[0] || "sale.created")}">Send test</button>
                      <button class="btn" type="button" data-deliveries="${esc(h.id)}">Deliveries</button>
                      ${h.active ? "" : `<button class="btn" type="button" data-enable="${esc(h.id)}">Turn on</button>`}
                      <button class="btn danger" type="button" data-delete-hook="${esc(h.id)}">Remove</button>
                    </div>
                  </td>
                </tr>
                <tr hidden data-deliveries-row="${esc(h.id)}"><td colspan="6"><div class="deliveries"></div></td></tr>`).join("")}
              </tbody>
            </table></div>`;
        } catch (err) {
          box.innerHTML = "";
          showError("hookError", err);
        }
      }

      async function createHook(event) {
        event.preventDefault();

        const form = event.currentTarget;
        const button = form.querySelector("button[type=submit]");
        const events = [...form.querySelectorAll("input[name=events]:checked")].map((i) => i.value);

        document.getElementById("hookError").textContent = "";

        if (!events.length) {
          document.getElementById("hookError").textContent = "Pick at least one event.";
          return;
        }

        button.disabled = true;

        try {
          const created = await call("POST", "/webhooks", { url: form.url.value, events });

          reveal("hookReveal", "Your webhook secret — copy it now, it will not be shown again", created.secret, "Use it to verify the X-Webhook-Signature header on every delivery.");
          form.url.value = "";
          await loadHooks();
        } catch (err) {
          showError("hookError", err);
        } finally {
          button.disabled = false;
        }
      }

      document.addEventListener("click", async (event) => {
        const revoke = event.target.closest("[data-revoke]");
        const test = event.target.closest("[data-test]");
        const enable = event.target.closest("[data-enable]");
        const remove = event.target.closest("[data-delete-hook]");
        const deliveries = event.target.closest("[data-deliveries]");

        try {
          if (revoke) {
            if (!confirm(`Revoke "${revoke.dataset.name}"? Anything using this key stops working immediately.`)) return;
            revoke.disabled = true;
            await call("POST", `/keys/${revoke.dataset.revoke}/revoke`);
            await loadKeys();
          }

          if (test) {
            test.disabled = true;
            test.textContent = "Sending…";
            const result = await call("POST", `/webhooks/${test.dataset.test}/test`, { type: test.dataset.testType });
            test.textContent = result.delivered ? `Delivered (${result.status_code})` : `Failed: ${result.error || result.status_code}`;
            setTimeout(() => { test.textContent = "Send test"; test.disabled = false; }, 4000);
            await loadHooks();
          }

          if (enable) {
            enable.disabled = true;
            await call("POST", `/webhooks/${enable.dataset.enable}/enable`);
            await loadHooks();
          }

          if (remove) {
            if (!confirm("Remove this webhook? Pending deliveries to it are dropped.")) return;
            remove.disabled = true;
            await call("DELETE", `/webhooks/${remove.dataset.deleteHook}`);
            await loadHooks();
          }

          if (deliveries) {
            const row = document.querySelector(`[data-deliveries-row="${CSS.escape(deliveries.dataset.deliveries)}"]`);
            row.hidden = !row.hidden;

            if (!row.hidden) {
              const box = row.querySelector(".deliveries");
              box.innerHTML = `<p class="empty">Loading…</p>`;
              const { items } = await call("GET", `/webhooks/${deliveries.dataset.deliveries}/deliveries`);

              box.innerHTML = items.length
                ? `<div class="table-wrap"><table>
                    <thead><tr><th>Event</th><th>Status</th><th>Attempts</th><th>Response</th><th>Created</th><th>Delivered</th></tr></thead>
                    <tbody>${items.map((d) => `
                      <tr>
                        <td><code>${esc(d.event_type)}</code></td>
                        <td><span class="badge ${d.status === "delivered" ? "live" : d.status === "failed" ? "off" : "muted"}">${esc(d.status)}</span></td>
                        <td>${esc(d.attempts)}</td>
                        <td class="small">${esc(d.last_status_code || d.last_error || "—")}</td>
                        <td>${when(d.created_at)}</td>
                        <td>${when(d.delivered_at)}</td>
                      </tr>`).join("")}
                    </tbody></table></div>`
                : `<p class="empty">No deliveries yet. Real events appear here; test events do not.</p>`;
            }
          }
        } catch (err) {
          showError(revoke ? "keyError" : "hookError", err);
          [revoke, test, enable, remove].forEach((b) => { if (b) b.disabled = false; });
          if (test) test.textContent = "Send test";
        }
      });

      /* ---------------- tabs ---------------- */

      let keysLoaded = false;

      function showTab(name) {
        document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
        document.getElementById("tab-docs").hidden = name !== "docs";
        document.getElementById("tab-keys").hidden = name !== "keys";

        if (name === "keys" && !keysLoaded) {
          keysLoaded = true;
          renderKeysShell();
          loadKeys();
          loadHooks();
        }

        if (location.hash !== `#${name}` && (name === "keys" || location.hash === "#keys")) {
          history.replaceState(null, "", name === "keys" ? "#keys" : location.pathname);
        }
      }

      document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));

      document.addEventListener("click", (event) => {
        if (!event.target.closest("[data-open-keys]")) return;

        event.preventDefault();
        showTab("keys");
        window.scrollTo(0, 0);
      });

      renderDocs();
      showTab(location.hash === "#keys" ? "keys" : "docs");
      openFromHash();
    })();
  </script>
</body>
</html>

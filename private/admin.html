      $("actionInputs").innerHTML = def.inputs.filter((spec) => !spec.sources || spec.sources.includes(source)).map((spec) => inputHtml(spec, info.prefill?.[spec.name], info.options || [])).join("");
      $("actionConfirm").disabled = false;
      ($("actionInputs").querySelector("input.input") || $("actionInputs").querySelector("input") || $("actionConfirm")).focus();
    } catch (err) {
      $("actionText").textContent = "";
      $("actionError").textContent = err.message;
    }
  }

  // Enter in a text field confirms, like any form.
  $("actionInputs").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && event.target.matches("input.input") && !$("actionConfirm").disabled) {
      event.preventDefault();
      $("actionForm").requestSubmit();
    }
  });

  $("actionCancel").addEventListener("click", () => {
    pending = null;
    $("actionDialog").close();
  });

  $("actionForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!pending) return;

    if (pending.money) return submitMoneyPaid();

    const { key, source, id, def } = pending;
    const input = {};
    let file = null;

    for (const spec of def.inputs) {
      const el = $(`action-${spec.name}`);
      if (!el) continue;
      if (spec.type === "checkbox") { input[spec.name] = el.checked; continue; }
      if (spec.type === "file") file = el.files[0] || null;
      else if (spec.type === "choice") input[spec.name] = el.querySelector("input:checked")?.value || "";
      else input[spec.name] = el.value.trim();

      if (spec.required && (spec.type === "file" ? !file : !input[spec.name])) {
        $("actionError").textContent = `Fill in: ${spec.label}.`;
        return;
      }
    }

    $("actionConfirm").disabled = true;
    $("actionError").textContent = "";

    try {
      let result;

      if (def.upload) {
        if (file.size > 10 * 1024 * 1024) throw new Error("The label is larger than 10 MB.");

        const params = new URLSearchParams({ action: key, source, id, tracking: input.tracking || "" });
        const response = await fetch(`/api/admin/action/upload?${params}`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/pdf", Accept: "application/json" },
          body: file
        });

        result = await response.json().catch(() => ({}));
        if (response.status === 401) { showLogin(); throw new Error("Not signed in"); }
        if (!response.ok) throw new Error(result.error || `Upload failed (${response.status})`);
      } else {
        result = await api("/api/admin/action", { method: "POST", body: JSON.stringify({ action: key, source, id, input }) });
      }

      pending = null;
      $("actionDialog").close();
      toast(result.message || "Done.");

      loadList({ fresh: true });
      if (state.selected === `${source}:${id}`) openRecord(source, id);
    } catch (err) {
      $("actionError").textContent = err.message;
      $("actionConfirm").disabled = false;
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      // The dialog closes itself on Escape; leave the panel open behind it.
      if ($("actionDialog").open) return;
      if (!$("storePopover").hidden) toggleStorePopover(false);
      else if (!$("searchResults").hidden) hideResults();
      else if (!$("panel").hidden) closePanel();
    }
  });

  /* ---------------- global search ---------------- */

  let searchTicket = 0;
  let results = [];

  function hideResults() {
    $("searchResults").hidden = true;
  }

  $("globalSearch").addEventListener("input", () => {
    const query = $("globalSearch").value.trim();
    const ticket = ++searchTicket;

    if (query.length < 2) return hideResults();

    clearTimeout(typing);
    typing = setTimeout(async () => {
      $("searchResults").hidden = false;
      $("searchResults").innerHTML = `<div class="results-empty">Searching…</div>`;

      try {
        const data = await api(`/api/admin/search?q=${encodeURIComponent(query)}`);
        if (ticket !== searchTicket) return;

        results = data.results;
        $("searchResults").innerHTML = results.length
          ? results.map((r, i) => `<button class="result" type="button" data-index="${i}"><span class="kind">${r.section === "store" ? "Order" : "WTB"}</span><span class="line">${esc(r.label)} · ${esc(r.title)}</span><span class="sub">${esc(r.sub)}</span></button>`).join("")
          : `<div class="results-empty">Nothing found for “${esc(query)}”.</div>`;
      } catch (err) {
        if (ticket !== searchTicket) return;
        $("searchResults").innerHTML = `<div class="results-empty error">${esc(err.message)}</div>`;
      }
    }, 300);
  });

  $("searchResults").addEventListener("click", (event) => {
    const button = event.target.closest(".result");
    if (!button) return;

    const result = results[Number(button.dataset.index)];
    hideResults();

    // Open it where every record of its kind is listed, with the panel on it.
    state.section = result.section;
    state.view = "general";
    state.stores = [];
    state.storeMode = "include";
    state.savedId = "";
    state.buyer = "";
    state.q = result.label;
    syncFilters();
    drawNav();
    loadList();
    loadSavedFilters();
    openRecord(result.section, result.id);
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest(".search")) hideResults();
  });

  /* ---------------- session ---------------- */

  function showLogin() {
    $("appView").hidden = true;
    $("loginView").hidden = false;
    $("loginPassword").value = "";
    $("loginEmail").focus();
  }

  async function start() {
    try {
      const me = await api("/api/admin/me");
      state.user = me.user;
      state.views = [...me.views, ...MONEY_VIEWS];
      state.actions = me.actions || {};
    } catch {
      return;
    }

    $("loginView").hidden = true;
    $("appView").hidden = false;
    $("userName").textContent = state.user.name;

    const open = readHash();
    syncFilters();
    drawNav();
    writeHash(open);
    loadStores();
    loadSavedFilters();
    loadList();

    // Counts after the page is up, then every two minutes.
    setTimeout(loadNavCounts, 500);
    if (!window.__navCountsTimer) window.__navCountsTimer = setInterval(loadNavCounts, 120_000);

    const [source, id] = open.split(":");
    if (source && id) openRecord(source, id);
  }

  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    if (!email || !password) {
      $("loginError").textContent = "Fill in your e-mail and password.";
      return;
    }

    $("loginButton").disabled = true;
    $("loginError").textContent = "";

    try {
      await api("/api/admin/login", { method: "POST", body: JSON.stringify({ email, password }) });
      $("loginPassword").value = "";
      await start();
    } catch (err) {
      $("loginError").textContent = err.message;
    } finally {
      $("loginButton").disabled = false;
    }
  });

  function syncThemeSwitch() {
    const light = document.documentElement.dataset.theme === "light";
    $("themeSwitch").textContent = light ? "Dark mode" : "Light mode";
    $("themeSwitch").setAttribute("aria-pressed", String(light));
  }

  $("themeSwitch").addEventListener("click", () => {
    const light = document.documentElement.dataset.theme !== "light";

    if (light) document.documentElement.dataset.theme = "light";
    else delete document.documentElement.dataset.theme;

    try { localStorage.setItem("lojiq-admin-theme", light ? "light" : "dark"); } catch { /* not remembered, still switched */ }
    syncThemeSwitch();
  });

  syncThemeSwitch();

  $("logoutButton").addEventListener("click", async () => {
    await api("/api/admin/logout", { method: "POST", body: "{}" }).catch(() => {});
    location.hash = "";
    showLogin();
  });

  window.addEventListener("hashchange", () => {
    if ($("appView").hidden) return;

    const listKey = () => [state.section, state.view, JSON.stringify(state.stores), state.storeMode, state.buyer, state.q, state.kind, state.shipping, state.unitType].join("|");
    const sectionBefore = state.section;
    const before = listKey();
    const open = readHash();

    if (listKey() !== before) {
      syncFilters();
      drawNav();
      loadList();
      if (state.section !== sectionBefore) { loadSavedFilters(); loadStores(); }
    }

    const [source, id] = open.split(":");
    if (source && id && state.selected !== open) openRecord(source, id);
    else if (!open && !$("panel").hidden) closePanel(false);
  });

  start().then(() => {
    if ($("appView").hidden) showLogin();
  });
})();
</script>
</body>
</html>

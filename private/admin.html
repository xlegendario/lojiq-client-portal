<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lojiq Admin</title>
  <link rel="icon" href="/favicon.png">
  <script>
    try { if (localStorage.getItem("lojiq-admin-theme") === "light") document.documentElement.dataset.theme = "light"; } catch {}
  </script>
  <style>
    /* Same palette as the store portal (portal.html), so the two read as one
       product: flat near-black, Lojiq blue as the only accent. */
    :root {
      --bg: #08080A;
      --panel: #121215;
      --panel-2: #17171B;
      --border: #26262B;
      --text: #E9E9EE;
      --muted: #8B8B95;
      --nav-item: #A8A8AF;
      --primary: #2F80ED;
      --primary-soft: #66B3FF;
      --primary-tint: rgba(102, 179, 255, 0.16);
      --green: #16B364;
      --red: #F04438;
      --warning: #F59E0B;

      /* Everything below is what used to be written out by hand in the rules. */
      --strong: #FFFFFF;
      --faint: #55555D;
      --nav-title: #5F5F68;
      --hover-border: #3A3A41;
      --strip: #1B1C21;
      --strip-head: #202127;
      --strip-line: #2E2F36;
      --strip-hover: #212329;
      --strip-selected: #1F2530;
      --strip-head-text: #B4B4BC;
      --row-hover: rgba(102, 179, 255, 0.06);
      --row-selected: rgba(102, 179, 255, 0.12);
      --pill-bg: rgba(139, 139, 149, 0.16);
      --pill-text: #CFCFD7;
      --good-bg: rgba(22, 179, 100, 0.16);
      --good-text: #4ADE9A;
      --wait-bg: rgba(245, 158, 11, 0.16);
      --wait-text: #FBBF4C;
      --move-bg: rgba(47, 128, 237, 0.18);
      --bad-bg: rgba(240, 68, 56, 0.16);
      --bad-text: #FF7A70;
      --run-border: rgba(47, 128, 237, 0.55);
      --choice-checked: rgba(47, 128, 237, 0.1);
      --toast-bg: #0F2A1E;
      --toast-border: rgba(22, 179, 100, 0.5);
      --toast-text: #D6F5E6;
      --shadow: rgba(0, 0, 0, 0.5);
      --backdrop: rgba(0, 0, 0, 0.6);
      --logo-plate: transparent;
      color-scheme: dark;
    }

    /* Light, for whoever prefers it; chosen with the switch at the bottom of
       the sidebar and remembered per browser. */
    :root[data-theme="light"] {
      --bg: #F3F5F8;
      --panel: #FFFFFF;
      --panel-2: #F0F2F6;
      --border: #DCE0E7;
      --text: #1A1D23;
      --muted: #616875;
      --nav-item: #3E4450;
      --primary: #2F80ED;
      --primary-soft: #1B64C8;
      --primary-tint: rgba(47, 128, 237, 0.12);
      --green: #12975A;
      --red: #D63B30;
      --warning: #B86E00;
      --strong: #0C0E13;
      --faint: #A2A8B2;
      --nav-title: #8A909B;
      --hover-border: #C3C9D3;
      --strip: #F1F3F7;
      --strip-head: #E8EBF1;
      --strip-line: #D3D8E0;
      --strip-hover: #E7ECF4;
      --strip-selected: #DCE7F8;
      --strip-head-text: #4A505B;
      --row-hover: rgba(47, 128, 237, 0.05);
      --row-selected: rgba(47, 128, 237, 0.1);
      --pill-bg: rgba(97, 104, 117, 0.12);
      --pill-text: #3E4450;
      --good-bg: rgba(18, 151, 90, 0.12);
      --good-text: #0C7446;
      --wait-bg: rgba(214, 139, 0, 0.14);
      --wait-text: #8F5500;
      --move-bg: rgba(47, 128, 237, 0.12);
      --bad-bg: rgba(214, 59, 48, 0.1);
      --bad-text: #B42E24;
      --run-border: rgba(47, 128, 237, 0.5);
      --choice-checked: rgba(47, 128, 237, 0.08);
      --toast-bg: #E6F5EC;
      --toast-border: rgba(18, 151, 90, 0.45);
      --toast-text: #0E4F31;
      --shadow: rgba(20, 28, 40, 0.14);
      --backdrop: rgba(20, 28, 40, 0.35);
      /* The logo is white lettering; on a light page it sits on a dark plate. */
      --logo-plate: #121215;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select { font: inherit; color: inherit; }
    a { color: var(--primary-soft); }
    [hidden] { display: none !important; }

    :focus-visible { outline: 2px solid var(--primary-soft); outline-offset: 2px; }

    /* ---------- login ---------- */

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-card img { width: 132px; height: auto; }
    .login-card h1 { margin: 4px 0 0; font-size: 18px; }
    .login-card p { margin: 0; color: var(--muted); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

    .input, .select {
      height: 36px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      min-width: 0;
    }

    .input:focus, .select:focus { border-color: var(--primary); outline: none; }

    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--hover-border); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 16px rgba(47, 128, 237, 0.32); }
    .btn.primary:disabled { opacity: 0.6; cursor: default; }
    .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
    .btn.ghost:hover { color: var(--text); }

    .error { color: var(--red); min-height: 1em; }

    /* ---------- shell ---------- */

    .app {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .logo { display: flex; align-items: baseline; gap: 8px; margin: 0 6px 14px; }
    .logo img { width: 104px; height: auto; display: block; background: var(--logo-plate); border-radius: 6px; }
    :root[data-theme="light"] .logo img { padding: 4px 6px; }
    :root[data-theme="light"] .login-card img { background: var(--logo-plate); border-radius: 8px; padding: 6px 8px; }
    .theme-switch { justify-content: flex-start; padding: 0; height: auto; }
    .logo span { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary-soft); }

    .nav-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--nav-title);
      margin: 14px 8px 5px;
    }

    /* A main section in the sidebar. Only the open one shows its tabs, so the
       sidebar stays short however many sections there are. */
    .nav-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 10px 0 2px;
      padding: 6px 8px;
      border: 0;
      border-radius: 7px;
      background: none;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--nav-title);
      text-align: left;
    }
    .nav-section::after { content: "▸"; font-size: 11px; letter-spacing: 0; transition: transform 0.15s ease; }
    .nav-section[aria-expanded="true"]::after { transform: rotate(90deg); }
    .nav-section:hover { color: var(--text); background: var(--primary-tint); }
    .nav-section.current { color: var(--primary-soft); }
    .nav-group { display: flex; flex-direction: column; gap: 2px; }
    @media (prefers-reduced-motion: reduce) { .nav-section::after { transition: none; } }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 30px;
      padding: 0 8px;
      border-radius: 7px;
      color: var(--nav-item);
      text-decoration: none;
      font-size: 12px;
    }

    .nav-item:hover, .nav-item.active { background: var(--primary-tint); color: var(--strong); }
    .nav-item.active { font-weight: 700; }
    .nav-item.soon { color: var(--faint); pointer-events: none; }
    .nav-count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .nav-item.soon small { font-size: 10px; }

    .sidebar-foot {
      margin-top: auto;
      padding: 12px 8px 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
    }

    .sidebar-foot strong { color: var(--text); }

    .main { min-width: 0; display: flex; flex-direction: column; }

    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 20;
    }

    .nav-toggle { display: none; }

    .search { position: relative; flex: 1 1 auto; max-width: 520px; }
    .search .input { width: 100%; }

    .search-results {
      position: absolute;
      top: 42px;
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 40px var(--shadow);
      max-height: 60vh;
      overflow-y: auto;
      padding: 6px;
    }

    .result {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 7px;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .result:hover, .result.focus { background: var(--primary-tint); }
    .result .kind { grid-row: span 2; align-self: center; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
    .result .line { font-weight: 700; }
    .result .sub { color: var(--muted); font-size: 12px; }
    .results-empty { padding: 10px; color: var(--muted); }

    .content { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    .heading { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .heading h1 { margin: 0; font-size: 20px; }
    .heading .crumb { color: var(--muted); }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filters .input { width: 240px; }
    .filters .select { max-width: 240px; }
    .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

    .picker { position: relative; }
    .picker-button { position: relative; min-width: 180px; max-width: 280px; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 26px; }
    .picker-button::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; }
    .picker-button.active { border-color: var(--primary); color: var(--strong); }

    .popover {
      position: absolute;
      top: 42px;
      left: 0;
      z-index: 30;
      width: 300px;
      max-width: calc(100vw - 32px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 40px var(--shadow);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--panel-2); border-radius: 8px; padding: 3px; }
    .mode label { position: relative; display: flex; align-items: center; justify-content: center; height: 28px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 700; }
    .mode input { position: absolute; opacity: 0; pointer-events: none; }
    .mode label:has(input:checked) { background: var(--primary-tint); color: var(--strong); }
    .mode label:has(input:focus-visible) { outline: 2px solid var(--primary-soft); }

    .store-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; }
    .store-list label { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 6px; border-radius: 6px; cursor: pointer; }
    .store-list label:hover { background: var(--primary-tint); }
    .store-list input { accent-color: var(--primary); }
    .popover-foot { display: flex; justify-content: space-between; gap: 8px; }

    .save-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .save-row .input { width: 260px; }

    /* ---------- table ---------- */

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      background: var(--panel);
      max-height: calc(100vh - 210px);
    }

    table { border-collapse: collapse; width: max-content; min-width: 100%; }

    th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--panel-2);
      text-align: left;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: var(--row-hover); }
    tbody tr.selected td { background: var(--row-selected); }
    tbody tr:last-child td { border-bottom: 0; }

    td.money, td.hours { text-align: right; font-variant-numeric: tabular-nums; }
    th.money, th.hours { text-align: right; }
    /* Same face and size as the rest of the row; a monospace SKU read as smaller. */
    .mono { font-variant-numeric: tabular-nums; }
    .id { font-weight: 700; color: var(--strong); }
    .dash { color: var(--faint); }
    .thumb { width: 38px; height: 38px; object-fit: contain; background: #fff; border-radius: 6px; display: block; }
    .thumb.empty { background: var(--panel-2); border: 1px dashed var(--border); }

    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--pill-bg);
      color: var(--pill-text);
    }

    .pill.good { background: var(--good-bg); color: var(--good-text); }
    .pill.wait { background: var(--wait-bg); color: var(--wait-text); }
    .pill.move { background: var(--move-bg); color: var(--primary-soft); }
    .pill.bad { background: var(--bad-bg); color: var(--bad-text); }

    /* Buttons stay in view at the right edge of a wide table. */
    /* Its own lighter strip with a rule on the left, so it reads as a separate
       column and not as the end of the data. */
    th.actions, td.actions {
      position: sticky;
      right: 0;
      z-index: 1;
      text-align: left;
      background: var(--strip);
      border-left: 1px solid var(--strip-line);
      box-shadow: -12px 0 14px -12px var(--shadow);
    }
    th.actions { z-index: 5; background: var(--strip-head); color: var(--strip-head-text); }
    tbody tr:hover td.actions { background: var(--strip-hover); }
    tbody tr.selected td.actions { background: var(--strip-selected); }
    .row-actions { display: inline-flex; gap: 6px; }
    .act {
      height: 28px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .act:hover { border-color: var(--primary); color: var(--strong); }
    .act.run { border-color: var(--run-border); color: var(--primary-soft); }
    .panel-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .panel-actions:empty { display: none; }

    dialog.action-dialog {
      width: min(440px, calc(100vw - 32px));
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0;
      box-shadow: 0 30px 80px var(--shadow);
    }
    dialog.action-dialog::backdrop { background: var(--backdrop); }
    .action-form { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .action-form h2 { margin: 0; font-size: 17px; }
    .action-form p { margin: 0; color: var(--muted); line-height: 1.45; }
    .action-form .blocked { color: var(--warning); }
    .action-form .input { width: 100%; }
    .action-form input[type=file] { color: var(--muted); }
    .action-inputs { display: flex; flex-direction: column; gap: 14px; }
    .action-inputs:empty { display: none; }
    .choices { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .choices legend { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .choice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); cursor: pointer; line-height: 1.4; }
    .choice:has(input:checked) { border-color: var(--primary); background: var(--choice-checked); }
    .choice input { margin-top: 3px; accent-color: var(--primary); }
    .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 60;
      max-width: min(560px, calc(100vw - 32px));
      background: var(--toast-bg);
      border: 1px solid var(--toast-border);
      color: var(--toast-text);
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 16px 40px var(--shadow);
    }

    /* ---------- open payments ---------- */
    tr.group-row td { background: var(--strip); border-top: 1px solid var(--strip-line); padding: 10px 12px; cursor: default; white-space: normal; max-width: none; overflow: visible; }
    /* A seller or store bar stays under the column headers until the next one pushes it out. */
    tr.group-row td { position: sticky; top: var(--thead-h, 34px); z-index: 3; }
    tbody tr.group-row:hover td { background: var(--strip); }
    /* The group header stays in view while the wide table scrolls sideways. */
    .group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; position: sticky; left: 12px; width: max-content; max-width: calc(100vw - 290px); }
    @media (max-width: 860px) { .group-head { max-width: calc(100vw - 70px); } }
    .group-head strong { font-size: 14px; color: var(--strong); }
    .group-head .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
    .group-head .total { color: var(--strong); font-weight: 700; font-variant-numeric: tabular-nums; }
    .group-head .spacer { flex: 1 1 auto; }
    .group-head .age.old { color: var(--warning); font-weight: 700; }
    td.check, th.check { width: 34px; text-align: center; }
    td.check input, th.check input, .group-head input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
    .kind { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .payout-info { display: inline-flex; align-items: center; gap: 8px; max-width: 520px; padding: 4px 8px; border: 1px solid var(--strip-line); border-radius: 7px; background: var(--panel); color: var(--text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .payout-info.missing { color: var(--warning); }
    .copy-cell { display: inline-flex; align-items: center; gap: 6px; }
    .act.copy { height: 22px; padding: 0 7px; font-size: 11px; }
    .money .copy-cell { justify-content: flex-end; }
    .summary-bar { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
    .summary-bar .selection { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 2px 4px 2px 10px; border: 1px solid var(--primary); border-radius: 8px; color: var(--text); }
    .summary-bar strong { color: var(--strong); font-variant-numeric: tabular-nums; }

    .state { padding: 40px 16px; text-align: center; color: var(--muted); }
    .state.error-state { color: var(--red); }
    .more { display: flex; justify-content: center; }

    /* ---------- side panel ---------- */

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(480px, 100%);
      height: 100vh;
      background: var(--panel);
      border-left: 1px solid var(--border);
      box-shadow: -20px 0 50px var(--shadow);
      z-index: 40;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-head h2 { margin: 0; font-size: 16px; flex: 1 1 auto; }
    .panel-body { overflow-y: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 18px; }

    .group h3 { margin: 0 0 8px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .group dl { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 7px 12px; }
    .group dt { color: var(--muted); }
    .group dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .group dd .thumb { width: 96px; height: 96px; }

    .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .timeline li { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; border-left: 2px solid var(--border); }
    .timeline small { color: var(--muted); }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: fixed; left: 0; top: 0; width: 240px; z-index: 50; background: var(--bg); transform: translateX(-100%); transition: transform 0.18s ease; }
      .sidebar.open { transform: none; box-shadow: 20px 0 50px var(--shadow); }
      .nav-toggle { display: inline-flex; align-items: center; }
      .topbar { padding: 0 16px; }
      .content { padding: 16px; }
      .filters .input, .filters .select, .picker, .picker-button, .save-row .input { width: 100%; max-width: none; }
      .count { margin-left: 0; }
      .group dl { grid-template-columns: 1fr; gap: 2px; }
      .group dd { margin-bottom: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sidebar { transition: none; }
    }
  </style>
</head>
<body>

  <!-- ================= login ================= -->
  <main class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm" novalidate>
      <img src="/logo.png" alt="Lojiq">
      <h1>Admin</h1>
      <p>Sign in with your own admin account.</p>
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input class="input" id="loginEmail" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input class="input" id="loginPassword" type="password" autocomplete="current-password" required>
      </div>
      <div class="error" id="loginError" role="alert"></div>
      <button class="btn primary" id="loginButton" type="submit">Sign in</button>
    </form>
  </main>

  <!-- ================= app ================= -->
  <div class="app" id="appView" hidden>
    <nav class="sidebar" id="sidebar" aria-label="Admin navigation">
      <div class="logo"><img src="/logo.png" alt="Lojiq"><span>Admin</span></div>

      <button class="nav-section" type="button" data-nav-section="store" aria-controls="navStore" aria-expanded="true">Store Orders</button>
      <div class="nav-group" id="navStore"></div>

      <button class="nav-section" type="button" data-nav-section="mwtb" aria-controls="navMwtb" aria-expanded="false">Member WTBs</button>
      <div class="nav-group" id="navMwtb" hidden></div>

      <button class="nav-section" type="button" data-nav-section="money" aria-controls="navMoney" aria-expanded="false">Finance</button>
      <div class="nav-group" id="navMoney" hidden></div>

      <!-- Forward Service is its own page (/admin/forwarding); these are plain links. -->
      <button class="nav-section" type="button" data-nav-section="forwarding" aria-controls="navForwarding" aria-expanded="false">Forward Service</button>
      <div class="nav-group" id="navForwarding" hidden>
        <a class="nav-item" href="/admin/forwarding?tab=awaiting_label">Awaiting label <small class="nav-count" data-nav-count="forwarding/awaiting_label"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=ready_to_ship">Ready to Ship <small class="nav-count" data-nav-count="forwarding/ready_to_ship"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=shipped">Shipped <small class="nav-count" data-nav-count="forwarding/shipped"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=all">All forwards</a>
      </div>

      <div class="sidebar-foot">
        <span>Signed in as <strong id="userName"></strong></span>
        <button class="btn ghost theme-switch" id="themeSwitch" type="button" aria-pressed="false">Light mode</button>
        <button class="btn ghost" id="logoutButton" type="button">Log out</button>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <button class="btn nav-toggle" id="navToggle" type="button" aria-label="Open navigation">☰</button>
        <div class="search">
          <input class="input" id="globalSearch" type="search" placeholder="Search order ID, WTB ID, Shopify number, SKU, tracking…" autocomplete="off" aria-label="Search everything">
          <div class="search-results" id="searchResults" hidden></div>
        </div>
      </header>

      <section class="content">
        <div class="heading">
          <span class="crumb" id="crumb"></span>
          <h1 id="viewTitle"></h1>
        </div>

        <div class="filters">
          <select class="select" id="savedFilter" aria-label="Saved filters" hidden>
            <option value="">Saved filters</option>
          </select>
          <div class="picker" id="storePicker">
            <button class="select picker-button" id="storeButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="storePopover">All stores</button>
            <div class="popover" id="storePopover" hidden>
              <div class="mode" role="radiogroup" aria-label="Show">
                <label><input type="radio" name="storeMode" id="storeModeInclude" value="include" checked> Only these</label>
                <label><input type="radio" name="storeMode" id="storeModeExclude" value="exclude"> All except</label>
              </div>
              <input class="input" id="storeSearch" type="search" placeholder="Find a store" aria-label="Find a store" autocomplete="off">
              <div class="store-list" id="storeList"></div>
              <div class="popover-foot">
                <button class="btn ghost" id="storeClear" type="button">Clear</button>
                <button class="btn primary" id="storeDone" type="button">Done</button>
              </div>
            </div>
          </div>
          <select class="select" id="kindFilter" aria-label="What to show" hidden>
            <option value="all">Store orders and member WTBs</option>
            <option value="store">Store orders</option>
            <option value="mwtb">Member WTBs</option>
          </select>
          <select class="select" id="shippingFilter" aria-label="Shipping Status" hidden>
            <option value="all">Every shipping status</option>
            <option value="shipped_or_delivered">Shipped or Delivered</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="not_shipped">Not shipped yet</option>
          </select>
          <select class="select" id="typeFilter" aria-label="Seller Type" hidden>
            <option value="">Every type</option>
          </select>
          <input class="input" id="buyerFilter" type="search" placeholder="Buyer" aria-label="Buyer" hidden>
          <input class="input" id="listSearch" type="search" placeholder="Search this list" aria-label="Search this list">
          <button class="btn" id="refreshButton" type="button">Refresh</button>
          <button class="btn" id="saveFilterButton" type="button" hidden>Save filter</button>
          <button class="btn ghost" id="deleteFilterButton" type="button" hidden>Delete filter</button>
          <span class="count" id="rowCount"></span>
        </div>

        <div class="summary-bar" id="paymentSummary" hidden></div>

        <form class="save-row" id="saveRow" hidden>
          <input class="input" id="saveName" maxlength="60" placeholder="Name, e.g. No SneakerAsk" aria-label="Filter name" autocomplete="off">
          <button class="btn primary" id="saveConfirm" type="submit">Save</button>
          <button class="btn ghost" id="saveCancel" type="button">Cancel</button>
          <span class="error" id="saveError" role="alert"></span>
        </form>

        <div class="table-wrap" id="tableWrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="state" id="tableState" hidden></div>
        </div>

        <div class="more"><button class="btn" id="moreButton" type="button" hidden>Load more</button></div>
      </section>
    </div>

    <aside class="panel" id="panel" hidden aria-label="Record details">
      <div class="panel-head">
        <h2 id="panelTitle"></h2>
        <button class="btn ghost" id="panelClose" type="button" aria-label="Close">✕</button>
      </div>
      <div class="panel-actions" id="panelActions"></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>

    <dialog class="action-dialog" id="actionDialog">
      <form class="action-form" id="actionForm" method="dialog" novalidate>
        <h2 id="actionTitle"></h2>
        <p id="actionText"></p>
        <div id="actionInputs" class="action-inputs"></div>
        <div class="error" id="actionError" role="alert"></div>
        <div class="dialog-foot">
          <button class="btn ghost" id="actionCancel" type="button">Cancel</button>
          <button class="btn primary" id="actionConfirm" type="submit">Confirm</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const state = {
    user: null,
    views: [],
    section: "store",
    view: "open",
    stores: [],
    storeMode: "include",
    kind: "all",
    shipping: "all",
    unitType: "",
    payouts: null,
    payoutsAll: null,
    payoutsAt: 0,
    storesKind: "",
    payments: null,
    allStores: [],
    savedFilters: [],
    savedId: "",
    buyer: "",
    q: "",
    rows: [],
    nextOffset: "",
    loading: false,
    request: 0,
    selected: ""
  };

  const SECTION_LABEL = { store: "Store Orders", mwtb: "Member WTBs", money: "Finance" };

  // Open Payments is its own screen, not a list of one table, but it sits in
  // the navigation and the address bar like any tab.
  const MONEY_VIEWS = [
    { key: "payments", section: "money", source: "mixed", label: "Open Payments", columns: [], actions: [] },
    { key: "payouts", section: "money", source: "units", label: "Payouts", columns: [], actions: [] }
  ];

  /* ---------------- helpers ---------------- */

  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const money = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
  const dateFmt = new Intl.DateTimeFormat("nl-NL", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });

  async function api(path, options = {}) {
    const response = await fetch(path, {
      credentials: "same-origin",
      ...options,
      headers: { Accept: "application/json", ...(options.body ? { "Content-Type": "application/json" } : {}) }
    });

    const data = await response.json().catch(() => ({}));

    if (response.status === 401 && !path.endsWith("/login")) {
      showLogin();
      throw new Error("Not signed in");
    }

    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);

    return data;
  }

  function pillClass(value) {
    const v = String(value).toLowerCase();

    if (/paid|delivered|fulfilled|solved|completed|confirmed|low/.test(v)) return "good";
    if (/cancel|expired|failed|error|troubled|denied|missing|high|lost/.test(v)) return "bad";
    if (/shipped|ready|allocated|label|processing/.test(v)) return "move";
    if (/pending|awaiting|outsource|requested|trusted|medium|to pay/.test(v)) return "wait";

    return "";
  }

  // One value drawn by its type. Everything from Airtable is escaped.
  function render(type, cell) {
    const value = cell?.value;
    const empty = value === null || value === undefined || value === "";

    if (type === "url") {
      return cell?.href ? `<a href="${esc(cell.href)}" target="_blank" rel="noopener noreferrer">Open ↗</a>` : `<span class="dash">—</span>`;
    }

    // Same footprint as a picture, so a row without one keeps its height.
    if (type === "image" && empty) return `<span class="thumb empty" aria-hidden="true"></span>`;

    if (empty) return `<span class="dash">—</span>`;

    switch (type) {
      case "money": return esc(money.format(value));
      case "hours": return esc(Math.round(Number(value)));
      case "date": {
        const d = new Date(value);
        return isNaN(d) ? esc(value) : esc(dateFmt.format(d));
      }
      case "image": return `<img class="thumb" src="${esc(value)}" alt="" loading="lazy">`;
      case "status": return `<span class="pill ${pillClass(value)}">${esc(value)}</span>`;
      case "id": return `<span class="id">${esc(value)}</span>`;
      default: {
        const inner = type === "mono" ? `<span class="mono">${esc(value)}</span>` : esc(value);
        return cell.href ? `<a href="${esc(cell.href)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${inner}</a>` : inner;
      }
    }
  }

  const currentView = () => state.views.find((v) => v.section === state.section && v.key === state.view);

  /* ---------------- routing ---------------- */

  // #/store/open?store=X&q=Y&open=store:recXXX
  function readHash() {
    const [pathPart, queryPart = ""] = location.hash.replace(/^#\/?/, "").split("?");
    const [section, view] = pathPart.split("/");
    const params = new URLSearchParams(queryPart);

    const exists = state.views.some((v) => v.section === section && v.key === view);

    state.section = exists ? section : "store";
    state.view = exists ? view : "open";
    state.stores = params.getAll("store").filter(Boolean);
    state.storeMode = params.get("mode") === "exclude" ? "exclude" : "include";
    state.buyer = params.get("buyer") || "";
    state.q = params.get("q") || "";
    state.kind = ["store", "mwtb"].includes(params.get("kind")) ? params.get("kind") : "all";
    state.shipping = ["shipped", "delivered", "shipped_or_delivered", "not_shipped"].includes(params.get("shipping")) ? params.get("shipping") : "all";
    state.unitType = params.get("type") || "";

    return params.get("open") || "";
  }

  function writeHash(open = state.selected) {
    const params = new URLSearchParams();

    if (state.section === "store" || state.section === "money") {
      for (const store of state.stores) params.append("store", store);
      if (state.stores.length && state.storeMode === "exclude") params.set("mode", "exclude");
    }
    if (state.section === "money" && state.view === "payments" && state.kind !== "all") params.set("kind", state.kind);
    if (state.view === "payouts" && state.shipping !== "all") params.set("shipping", state.shipping);
    if (state.view === "payouts" && state.unitType) params.set("type", state.unitType);
    if (state.buyer && state.section === "mwtb") params.set("buyer", state.buyer);
    if (state.q) params.set("q", state.q);
    if (open) params.set("open", open);

    const query = params.toString();
    const next = `#/${state.section}/${state.view}${query ? `?${query}` : ""}`;

    if (location.hash !== next) history.replaceState(null, "", next);
  }

  /* ---------------- navigation ---------------- */

  const NAV_GROUPS = { store: "navStore", mwtb: "navMwtb", money: "navMoney", forwarding: "navForwarding" };

  /*
   * Counts behind each tab, fetched after the page has drawn and again every
   * two minutes. The server keeps them for two minutes too, so this costs
   * Airtable nothing extra however often the sidebar redraws.
   */
  let navCounts = {};

  const navCountText = (key) => {
    const n = navCounts[key];
    return typeof n === "number" && n > 0 ? String(n) : "";
  };

  const navCount = (key) => `<small class="nav-count">${navCountText(key)}</small>`;

  async function loadNavCounts() {
    try {
      const data = await api("/api/admin/counts");
      navCounts = data.tabs || {};
      drawNav();
    } catch {}
  }

  /*
   * Which sections are unfolded. Each header folds its own section only, so
   * any number can stay open; the sidebar scrolls when they do not fit. The
   * section of the open tab is always unfolded when you land on it. Kept per
   * browser and shared with the Forward Service page.
   */
  const NAV_OPEN_KEY = "lojiq-admin-nav-open";
  const openNavSections = new Set(["store"]);

  try {
    const saved = JSON.parse(localStorage.getItem(NAV_OPEN_KEY) || "null");
    if (Array.isArray(saved)) {
      openNavSections.clear();
      saved.forEach((section) => openNavSections.add(section));
    }
  } catch {}

  function saveNavSections() {
    try { localStorage.setItem(NAV_OPEN_KEY, JSON.stringify([...openNavSections])); } catch {}
  }

  function drawNavSections() {
    for (const [section, groupId] of Object.entries(NAV_GROUPS)) {
      const expanded = openNavSections.has(section);
      const header = document.querySelector(`[data-nav-section="${section}"]`);

      $(groupId).hidden = !expanded;
      header.setAttribute("aria-expanded", String(expanded));
      header.classList.toggle("current", section === state.section);
    }
  }

  function drawNav() {
    if (!openNavSections.has(state.section)) {
      openNavSections.add(state.section);
      saveNavSections();
    }

    for (const section of ["store", "mwtb", "money"]) {
      $(NAV_GROUPS[section]).innerHTML = state.views
        .filter((v) => v.section === section)
        .map((v) => `<a class="nav-item${v.section === state.section && v.key === state.view ? " active" : ""}" href="#/${v.section}/${v.key}" data-section="${v.section}" data-view="${v.key}">${esc(v.label)}${navCount(`${v.section}/${v.key}`)}</a>`)
        .join("");
    }

    // Forwarding Payments lives on the Forward Service page; a plain link.
    $("navMoney").insertAdjacentHTML("beforeend", `<a class="nav-item" href="/admin/forwarding?view=payments">Forwarding Payments${navCount("money/forwarding_payments")}</a>`);

    document.querySelectorAll("[data-nav-count]").forEach((el) => {
      el.textContent = navCountText(el.dataset.navCount);
    });

    drawNavSections();
  }

  function openTab(section, view) {
    state.section = section;
    state.view = view;
    openNavSections.add(section);
    saveNavSections();
    state.q = "";
    state.selected = "";
    $("sidebar").classList.remove("open");
    closePanel(false);
    syncFilters();
    writeHash("");
    drawNav();
    loadList();
    loadSavedFilters();
    loadStores();
  }

  $("sidebar").addEventListener("click", (event) => {
    // A section header folds or unfolds that section only.
    const header = event.target.closest("[data-nav-section]");

    if (header) {
      const section = header.dataset.navSection;

      if (openNavSections.has(section)) openNavSections.delete(section);
      else openNavSections.add(section);

      saveNavSections();
      drawNavSections();
      return;
    }

    // FIXED - every link was taken over as a Store Orders / Member WTBs tab,
    // including links to other pages, which then did nothing. Only tabs of
    // this page carry data-section; everything else is an ordinary link.
    const link = event.target.closest("a.nav-item[data-section]");
    if (!link) return;
    event.preventDefault();
    openTab(link.dataset.section, link.dataset.view);
  });

  $("navToggle").addEventListener("click", () => $("sidebar").classList.toggle("open"));

  /* ---------------- filters ---------------- */

  function storeLabel() {
    const n = state.stores.length;

    if (!n) return "All stores";

    const what = n === 1 ? state.stores[0] : n + " stores";

    return state.storeMode === "exclude" ? "All except " + what : what;
  }

  function syncFilters() {
    const isMoney = state.section === "money";
    const isPayouts = isMoney && state.view === "payouts";
    const isStore = state.section === "store" || (isMoney && !isPayouts);

    $("storePicker").hidden = !isStore;
    $("buyerFilter").hidden = state.section !== "mwtb";
    $("kindFilter").hidden = !isMoney || isPayouts;
    $("shippingFilter").hidden = !isPayouts;
    $("typeFilter").hidden = !isPayouts;
    $("shippingFilter").value = state.shipping;
    $("typeFilter").value = state.unitType;
    $("kindFilter").value = state.kind;
    $("refreshButton").hidden = false;
    $("storeButton").textContent = storeLabel();
    $("storeButton").classList.toggle("active", isStore && state.stores.length > 0);
    $("storeModeInclude").checked = state.storeMode !== "exclude";
    $("storeModeExclude").checked = state.storeMode === "exclude";
    $("buyerFilter").value = state.buyer;
    $("listSearch").value = state.q;
    syncSaved();
  }

  // Something in the filters changed by hand: no saved filter is chosen anymore.
  function filtersChanged() {
    state.savedId = "";
    syncFilters();
    writeHash("");
    loadList();
  }

  /* ----- stores ----- */

  function drawStoreList() {
    const needle = $("storeSearch").value.trim().toLowerCase();

    // A store from a saved filter or the address bar still shows, even when
    // it has no Merchants row anymore.
    const names = [...new Set([...state.stores, ...state.allStores])].sort((a, b) => a.localeCompare(b));
    const shown = names.filter((name) => !needle || name.toLowerCase().includes(needle));

    $("storeList").innerHTML = shown.length
      ? shown.map((name, i) => '<label><input type="checkbox" id="store-opt-' + i + '" value="' + esc(name) + '"' + (state.stores.includes(name) ? " checked" : "") + "> <span>" + esc(name) + "</span></label>").join("")
      : '<div class="results-empty">No store matches.</div>';
  }

  // Open Payments also lists Manual stores; the order tabs only the stores that have store orders.
  async function loadStores() {
    const kind = state.section === "money" ? "all" : "store";
    if (state.storesKind === kind && state.allStores.length) return drawStoreList();

    try {
      const { stores } = await api(kind === "all" ? "/api/admin/stores?all=1" : "/api/admin/stores");
      state.allStores = stores;
      state.storesKind = kind;
    } catch {
      /* The picker still shows the stores already chosen; the lists still work. */
    }

    drawStoreList();
  }

  function toggleStorePopover(open) {
    const show = open ?? $("storePopover").hidden;

    $("storePopover").hidden = !show;
    $("storeButton").setAttribute("aria-expanded", String(show));

    if (show) {
      $("storeSearch").value = "";
      drawStoreList();
      $("storeSearch").focus();
    }
  }

  let storeTimer;
  const storesChanged = () => {
    clearTimeout(storeTimer);
    storeTimer = setTimeout(filtersChanged, 400);
  };

  $("storeButton").addEventListener("click", () => toggleStorePopover());
  $("storeDone").addEventListener("click", () => toggleStorePopover(false));
  $("storeSearch").addEventListener("input", drawStoreList);

  $("storeList").addEventListener("change", (event) => {
    const box = event.target.closest("input[type=checkbox]");
    if (!box) return;

    state.stores = box.checked
      ? [...new Set([...state.stores, box.value])]
      : state.stores.filter((name) => name !== box.value);

    $("storeButton").textContent = storeLabel();
    storesChanged();
  });

  for (const radio of document.querySelectorAll('input[name="storeMode"]')) {
    radio.addEventListener("change", () => {
      state.storeMode = $("storeModeExclude").checked ? "exclude" : "include";
      $("storeButton").textContent = storeLabel();
      if (state.stores.length) storesChanged();
    });
  }

  $("storeClear").addEventListener("click", () => {
    state.stores = [];
    state.storeMode = "include";
    drawStoreList();
    filtersChanged();
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest("#storePicker") && !$("storePopover").hidden) toggleStorePopover(false);
  });

  /* ----- saved filters ----- */

  function syncSaved() {
    const own = state.savedFilters.filter((f) => f.mine);
    const others = state.savedFilters.filter((f) => !f.mine);
    const option = (f) => '<option value="' + esc(f.id) + '">' + esc(f.name) + " - " + esc(f.owner_name) + "</option>";

    $("savedFilter").innerHTML = '<option value="">Saved filters</option>'
      + (own.length ? '<optgroup label="Yours">' + own.map(option).join("") + "</optgroup>" : "")
      + (others.length ? '<optgroup label="Others">' + others.map(option).join("") + "</optgroup>" : "");

    const chosen = state.savedFilters.find((f) => f.id === state.savedId);

    $("savedFilter").value = chosen ? chosen.id : "";
    $("deleteFilterButton").hidden = !(chosen && chosen.mine);
  }

  async function loadSavedFilters() {
    const section = state.section;

    // Saved filters belong to the order sections.
    if (section === "money") {
      state.savedFilters = [];
      $("savedFilter").hidden = true;
      $("saveFilterButton").hidden = true;
      $("deleteFilterButton").hidden = true;
      return;
    }

    try {
      const data = await api("/api/admin/filters?section=" + encodeURIComponent(section));
      if (section !== state.section) return;

      state.savedFilters = data.filters;
      $("savedFilter").hidden = !data.available;
      $("saveFilterButton").hidden = !data.available;
    } catch {
      state.savedFilters = [];
      $("savedFilter").hidden = true;
      $("saveFilterButton").hidden = true;
    }

    if (!state.savedFilters.some((f) => f.id === state.savedId)) state.savedId = "";
    syncSaved();
  }

  $("savedFilter").addEventListener("change", () => {
    const chosen = state.savedFilters.find((f) => f.id === $("savedFilter").value);
    const f = (chosen && chosen.filters) || {};

    state.savedId = chosen ? chosen.id : "";
    state.stores = state.section === "store" ? (f.stores || []) : [];
    state.storeMode = f.storeMode === "exclude" ? "exclude" : "include";
    state.buyer = state.section === "mwtb" ? (f.buyer || "") : "";
    state.q = f.q || "";

    syncFilters();
    writeHash("");
    loadList();
  });

  $("saveFilterButton").addEventListener("click", () => {
    const chosen = state.savedFilters.find((f) => f.id === state.savedId && f.mine);

    $("saveRow").hidden = false;
    $("saveError").textContent = "";
    $("saveName").value = chosen ? chosen.name : "";
    $("saveName").focus();
  });

  $("saveCancel").addEventListener("click", () => {
    $("saveRow").hidden = true;
  });

  $("saveRow").addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = $("saveName").value.trim();

    if (!name) {
      $("saveError").textContent = "Give the filter a name.";
      return;
    }

    $("saveConfirm").disabled = true;

    try {
      const { filter } = await api("/api/admin/filters", {
        method: "POST",
        body: JSON.stringify({
          section: state.section,
          name,
          filters: { stores: state.stores, storeMode: state.storeMode, buyer: state.buyer, q: state.q }
        })
      });

      $("saveRow").hidden = true;
      state.savedId = filter.id;
      await loadSavedFilters();
    } catch (err) {
      $("saveError").textContent = err.message;
    } finally {
      $("saveConfirm").disabled = false;
    }
  });

  $("deleteFilterButton").addEventListener("click", async () => {
    const chosen = state.savedFilters.find((f) => f.id === state.savedId && f.mine);
    if (!chosen || !confirm('Delete the saved filter "' + chosen.name + '"? The list itself stays as it is.')) return;

    try {
      await api("/api/admin/filters/" + encodeURIComponent(chosen.id), { method: "DELETE" });
      state.savedId = "";
      await loadSavedFilters();
    } catch (err) {
      alert(err.message);
    }
  });

  /* ----- buyer and search ----- */

  let typing;
  const debounce = (fn) => {
    clearTimeout(typing);
    typing = setTimeout(fn, 250);
  };

  $("shippingFilter").addEventListener("change", () => {
    state.shipping = $("shippingFilter").value;
    filtersChanged();
  });

  $("typeFilter").addEventListener("change", () => {
    state.unitType = $("typeFilter").value;
    filtersChanged();
  });

  $("kindFilter").addEventListener("change", () => {
    state.kind = $("kindFilter").value;
    filtersChanged();
  });

  $("buyerFilter").addEventListener("input", () => debounce(() => {
    state.buyer = $("buyerFilter").value.trim();
    filtersChanged();
  }));

  $("listSearch").addEventListener("input", () => debounce(() => {
    state.q = $("listSearch").value.trim();
    filtersChanged();
  }));

  $("refreshButton").addEventListener("click", () => loadList({ fresh: true }));

  /* ---------------- list ---------------- */

  function drawHead(view) {
    const actions = view.actions?.length ? '<th class="actions">Actions</th>' : "";
    $("tableHead").innerHTML = `<tr>${view.columns.map((c) => `<th class="${c.type}">${esc(c.label)}</th>`).join("")}${actions}</tr>`;
  }

  // The buttons a record can use right now, in the tab's order.
  function actionButtons(source, keys, links) {
    return (keys || [])
      .map((key) => {
        const def = state.actions[key];
        if (!def) return "";

        if (def.kind === "link") {
          const href = links?.[key];
          return href ? `<a class="act" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(def.label)} ↗</a>` : "";
        }

        return `<button class="act run" type="button" data-action="${esc(key)}" data-source="${esc(source)}">${esc(def.label)}</button>`;
      })
      .join("");
  }

  function drawRows(view, rows, append) {
    const html = rows
      .map((row) => `<tr data-id="${esc(row.id)}"${state.selected.endsWith(row.id) ? ' class="selected"' : ""}>${view.columns
        .map((c) => `<td class="${c.type}">${render(c.type, row.cells[c.key])}</td>`)
        .join("")}${view.actions?.length ? `<td class="actions"><span class="row-actions">${actionButtons(view.source, row.actions, row.links)}</span></td>` : ""}</tr>`)
      .join("");

    if (append) $("tableBody").insertAdjacentHTML("beforeend", html);
    else $("tableBody").innerHTML = html;
  }

  function setState(message, isError = false) {
    $("tableState").hidden = !message;
    $("tableState").textContent = message || "";
    $("tableState").classList.toggle("error-state", isError);
  }

  async function loadList({ more = false, fresh = false } = {}) {
    const view = currentView();
    if (!view) return;

    const ticket = ++state.request;

    $("paymentSummary").hidden = view.section !== "money";
    $("moreButton").hidden = true;

    if (view.section === "money") return loadMoney(view.key, ticket, fresh);

    $("crumb").textContent = SECTION_LABEL[view.section];
    $("viewTitle").textContent = view.label;
    document.title = `${view.label} · ${SECTION_LABEL[view.section]} · Lojiq Admin`;

    if (!more) {
      drawHead(view);
      $("tableBody").innerHTML = "";
      state.rows = [];
      state.nextOffset = "";
      $("rowCount").textContent = "";
      setState("Loading…");
    }

    $("moreButton").hidden = true;

    const params = new URLSearchParams({ section: view.section, view: view.key });
    if (state.section === "store" && state.stores.length) {
      for (const store of state.stores) params.append("store", store);
      if (state.storeMode === "exclude") params.set("store_mode", "exclude");
    }
    if (state.section === "mwtb" && state.buyer) params.set("buyer", state.buyer);
    if (state.q) params.set("q", state.q);
    if (more && state.nextOffset) params.set("offset", state.nextOffset);
    if (fresh) params.set("_", Date.now());

    try {
      const data = await api(`/api/admin/list?${params}`);

      // A newer tab or filter was chosen while this one loaded.
      if (ticket !== state.request) return;

      state.rows = more ? state.rows.concat(data.rows) : data.rows;
      state.nextOffset = data.next_offset || "";

      drawRows(view, data.rows, more);
      setState(state.rows.length ? "" : "Nothing here.");

      $("rowCount").textContent = state.rows.length
        ? `${state.rows.length}${state.nextOffset ? "+" : ""} ${state.rows.length === 1 ? "row" : "rows"}`
        : "";
      $("moreButton").hidden = !state.nextOffset;
    } catch (err) {
      if (ticket !== state.request) return;
      if (!more) setState(err.message, true);
      else $("moreButton").hidden = false;
    }
  }

  $("moreButton").addEventListener("click", () => loadList({ more: true }));

  /* ---------------- open payments ---------------- */

  const DAY = 24 * 60 * 60 * 1000;
  const daysSince = (value) => {
    const t = new Date(value).getTime();
    return Number.isFinite(t) ? Math.max(0, Math.floor((Date.now() - t) / DAY)) : null;
  };

  /*
   * Open Payments and Payouts.
   *
   * Both read their whole list once. Searching and filtering then happen here,
   * instantly; Refresh and Mark paid read the list again. What is ticked is
   * remembered by record, so a tick survives a search: find an order, tick it,
   * find the next one, tick it, and mark them all paid in one go. The server
   * still settles one seller or one store per request, so a selection across
   * several is sent as one request each.
   */

  const LIST_TTL = 5 * 60 * 1000;
  const bankAmount = (value) => Number(value || 0).toFixed(2).replace(".", ",");
  const copyButton = (value, label) => value ? `<button class="act copy" type="button" data-copy="${esc(value)}" data-copy-label="${esc(label)}">Copy</button>` : "";

  const money2 = (n) => Math.round(n * 100) / 100;

  const MONEY = {
    payments: {
      url: "/api/admin/payments",
      picked: new Set(),
      all: null,
      at: 0,
      view: null,
      rowKey: (row) => `${row.source}:${row.id}`,
      groupKey: (row) => row.store,
      groupLabel: (row) => row.store,
      unit: ["amount", "amounts"],
      who: ["store", "stores"]
    },
    payouts: {
      url: "/api/admin/payouts",
      picked: new Set(),
      all: null,
      at: 0,
      view: null,
      rowKey: (row) => row.id,
      groupKey: (row) => row.seller_record_id || `unknown:${row.seller.name}`,
      groupLabel: (row) => row.seller.name,
      unit: ["unit", "units"],
      who: ["seller", "sellers"]
    }
  };

  const allRows = (m) => (m.all ? m.all.groups.flatMap((group) => group.rows) : []);

  function filterMoney(kind) {
    const m = MONEY[kind];
    const needle = state.q.toLowerCase();

    const rows = allRows(m).filter((row) => {
      if (kind === "payments") {
        if (state.stores.length && (state.storeMode === "exclude" ? state.stores.includes(row.store) : !state.stores.includes(row.store))) return false;
        if (state.kind !== "all" && row.source !== state.kind) return false;
        return !needle || [row.store, row.label, row.number, row.product, row.sku].join(" ").toLowerCase().includes(needle);
      }

      const shippingOk = state.shipping === "shipped" ? row.shipping === "Shipped"
        : state.shipping === "delivered" ? row.shipping === "Delivered"
        : state.shipping === "shipped_or_delivered" ? row.shipping === "Shipped" || row.shipping === "Delivered"
        : state.shipping === "not_shipped" ? row.shipping !== "Shipped" && row.shipping !== "Delivered"
        : true;

      return shippingOk &&
        (!state.unitType || row.type === state.unitType) &&
        (!needle || [row.seller.name, row.seller.person, row.seller.discord, row.seller.id, row.item, row.reference, row.product, row.sku].join(" ").toLowerCase().includes(needle));
    });

    const groups = new Map();

    for (const row of rows) {
      const key = m.groupKey(row);
      if (!groups.has(key)) groups.set(key, { key, label: m.groupLabel(row), seller: row.seller, store: row.store, rows: [], total: 0, oldest: "" });
      const group = groups.get(key);
      group.rows.push(row);
      group.total = money2(group.total + row.amount);
      if (row.date && (!group.oldest || row.date < group.oldest)) group.oldest = row.date;
    }

    const list = [...groups.values()];

    if (kind === "payments") {
      for (const group of list) group.rows.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      list.sort((a, b) => (a.oldest || "9").localeCompare(b.oldest || "9"));
    } else {
      list.sort((a, b) => b.total - a.total);
    }

    return { groups: list, count: rows.length, total: money2(list.reduce((sum, group) => sum + group.total, 0)) };
  }

  // Everything ticked, over the whole list, whatever the search shows now.
  function pickedRows(kind, groupKey = null) {
    const m = MONEY[kind];
    return allRows(m).filter((row) => m.picked.has(m.rowKey(row)) && (groupKey === null || m.groupKey(row) === groupKey));
  }

  function drawSelection(kind) {
    const m = MONEY[kind];
    const rows = pickedRows(kind);
    const view = m.view;

    const listed = view && view.count
      ? kind === "payments"
        ? `<span><strong>${view.count}</strong> open ${view.count === 1 ? "amount" : "amounts"}</span><span><strong>${view.groups.length}</strong> ${view.groups.length === 1 ? "store" : "stores"}</span><span>total <strong>${esc(money.format(view.total))}</strong></span>`
        : `<span><strong>${view.count}</strong> ${view.count === 1 ? "unit" : "units"} on To Pay</span><span><strong>${view.groups.length}</strong> ${view.groups.length === 1 ? "seller" : "sellers"}</span><span>total <strong>${esc(money.format(view.total))}</strong></span>`
      : "";

    const selected = rows.length
      ? `<span class="selection"><strong>${rows.length}</strong> selected · <strong>${esc(money.format(money2(rows.reduce((sum, row) => sum + row.amount, 0))))}</strong>
          <button class="act run" type="button" data-paid-selected="${kind}">Mark selected paid</button>
          <button class="act" type="button" data-clear-selected="${kind}">Clear</button></span>`
      : "";

    $("paymentSummary").innerHTML = listed + selected;
  }

  async function loadMoney(kind, ticket, fresh) {
    const m = MONEY[kind];
    const isPayouts = kind === "payouts";

    $("crumb").textContent = "Finance";
    $("viewTitle").textContent = isPayouts ? "Payouts" : "Open Payments";
    document.title = `${isPayouts ? "Payouts" : "Open Payments"} · Lojiq Admin`;

    $("tableHead").innerHTML = isPayouts
      ? `<tr><th class="check"></th><th class="image">Picture</th><th class="id">Item ID</th><th>Type</th><th>Product</th><th>Size</th>
         <th>Order / WTB ID</th><th>Shopify</th><th class="money">Payout</th><th class="money">Shipping Deduction</th><th class="status">Verification Status</th>
         <th class="status">Shipping Status</th><th>Track</th><th class="date">Purchase Date</th></tr>`
      : `<tr><th class="check"></th><th class="image">Picture</th><th class="id">ID</th><th>Type</th><th>Shopify Order Number</th>
         <th>Product</th><th>Size</th><th class="money">Amount</th><th class="status">Status</th><th class="status">Fulfillment Status</th><th class="status">Shipping Status</th><th>Track</th>
         <th class="date">Date</th><th class="actions">Actions</th></tr>`;

    const haveList = m.all && !fresh && Date.now() - m.at < LIST_TTL;

    if (!haveList) {
      $("tableBody").innerHTML = "";
      $("rowCount").textContent = "";
      $("paymentSummary").innerHTML = "";
      setState("Loading…");
    }

    try {
      if (!haveList) {
        const all = await api(`${m.url}${fresh ? `?_=${Date.now()}` : ""}`);
        if (ticket !== state.request) return;

        m.all = all;
        m.at = Date.now();

        // A tick on something that is no longer on the list goes.
        const present = new Set(allRows(m).map(m.rowKey));
        for (const key of [...m.picked]) if (!present.has(key)) m.picked.delete(key);
      }

      if (isPayouts) {
        $("typeFilter").innerHTML = '<option value="">Every type</option>' + (m.all.types || []).map((type) => `<option value="${esc(type)}">${esc(type)}</option>`).join("");
        $("typeFilter").value = state.unitType;
      }

      const view = filterMoney(kind);
      m.view = view;

      drawMoneyRows(kind);
      drawSelection(kind);

      $("tableWrap").style.setProperty("--thead-h", `${$("tableHead").offsetHeight}px`);
      setState(view.count ? "" : isPayouts ? "Nothing to pay out with these filters." : "Nothing open with these filters.");
      $("rowCount").textContent = view.count ? `${view.count} rows` : "";
    } catch (err) {
      if (ticket !== state.request) return;
      setState(err.message, true);
    }
  }

  function drawMoneyRows(kind) {
    const m = MONEY[kind];
    const isPayouts = kind === "payouts";

    $("tableBody").innerHTML = m.view.groups.map((group) => {
      const allTicked = group.rows.every((row) => m.picked.has(m.rowKey(row)));
      const groupBox = `<input type="checkbox" data-group-key="${esc(group.key)}" data-money="${kind}"${allTicked ? " checked" : ""} aria-label="Select all of ${esc(group.label)}">`;
      const paidButton = `<button class="act run" type="button" data-group-paid="${esc(group.key)}" data-money="${kind}">Mark paid</button>`;

      let head;

      if (isPayouts) {
        const info = group.seller.payout_info;
        head = `<tr class="group-row"><td colspan="14"><div class="group-head">
          ${groupBox}
          <span class="copy-cell"><strong>${esc(group.seller.name)}</strong>${copyButton(group.seller.name, "Name")}</span>
          ${group.seller.id ? `<span class="meta">${esc(group.seller.id)}</span>` : ""}
          ${group.seller.discord ? `<span class="meta">@${esc(group.seller.discord.replace(/^@/, ""))}</span>` : ""}
          <span class="meta">${group.rows.length} ${group.rows.length === 1 ? "unit" : "units"}</span>
          <span class="copy-cell"><span class="total">${esc(money.format(group.total))}</span>${copyButton(bankAmount(group.total), "Total")}</span>
          <span class="payout-info${info ? "" : " missing"}">${info ? esc(info) : "No Payout Info"}${copyButton(info, "Payout Info")}</span>
          ${paidButton}
        </div></td></tr>`;
      } else {
        const age = daysSince(group.oldest);
        head = `<tr class="group-row"><td colspan="14"><div class="group-head">
          ${groupBox}
          <strong>${esc(group.store)}</strong>
          <span class="meta">${group.rows.length} open</span>
          <span class="total">${esc(money.format(group.total))}</span>
          ${age === null ? "" : `<span class="meta age${age >= 14 ? " old" : ""}">oldest ${age} ${age === 1 ? "day" : "days"}</span>`}
          ${paidButton}
        </div></td></tr>`;
      }

      const rows = group.rows.map((row) => {
        const key = m.rowKey(row);
        const box = `<td class="check"><input type="checkbox" data-pick-key="${esc(key)}" data-money="${kind}"${m.picked.has(key) ? " checked" : ""} aria-label="Select ${esc(isPayouts ? row.item : row.label)}"></td>`;
        const track = `<td>${row.track ? `<a class="act" href="${esc(row.track)}" target="_blank" rel="noopener noreferrer">Track ↗</a>` : '<span class="dash">—</span>'}</td>`;

        if (isPayouts) {
          return `<tr data-unit="${esc(row.id)}">
            ${box}
            <td class="image">${render("image", { value: row.picture })}</td>
            <td class="id">${render("id", { value: row.item })}</td>
            <td>${render("text", { value: row.type })}</td>
            <td>${render("text", { value: row.product })}</td>
            <td>${render("text", { value: row.size })}</td>
            <td><span class="copy-cell">${render("id", { value: row.reference_id })}${copyButton(row.reference_id, row.reference_id.startsWith("MWTB") ? "Member WTB ID" : "Order ID")}</span></td>
            <td>${render("text", { value: row.shopify })}</td>
            <td class="money"><span class="copy-cell">${render("money", { value: row.amount })}${copyButton(row.amount ? bankAmount(row.amount) : "", "Payout")}</span></td>
            <td class="money">${row.deduction ? render("money", { value: row.deduction }) : '<span class="dash">—</span>'}</td>
            <td class="status">${render("status", { value: row.verification })}</td>
            <td class="status">${render("status", { value: row.shipping })}</td>
            ${track}
            <td class="date">${render("date", { value: row.date })}</td>
          </tr>`;
        }

        return `<tr data-id="${esc(row.id)}" data-source="${esc(row.source)}">
          ${box}
          <td class="image">${render("image", { value: row.picture })}</td>
          <td class="id">${render("id", { value: row.label })}</td>
          <td><span class="kind">${row.source === "store" ? "Order" : "WTB"}</span></td>
          <td>${render("text", { value: row.number })}</td>
          <td>${render("text", { value: row.product })}</td>
          <td>${render("text", { value: row.size })}</td>
          <td class="money">${render("money", { value: row.amount })}</td>
          <td class="status">${render("status", { value: row.status })}</td>
          <td class="status">${render("status", { value: row.fulfillment })}</td>
          <td class="status">${render("status", { value: row.shipping })}</td>
          ${track}
          <td class="date">${render("date", { value: row.date })}</td>
          <td class="actions"><span class="row-actions">${row.link ? `<button class="act" type="button" data-copy="${esc(row.link)}">Copy link</button><a class="act" href="${esc(row.link)}" target="_blank" rel="noopener noreferrer">Payment link ↗</a>` : '<span class="dash">—</span>'}</span></td>
        </tr>`;
      }).join("");

      return head + rows;
    }).join("");
  }

  $("tableBody").addEventListener("change", (event) => {
    const groupBox = event.target.closest("input[data-group-key]");
    const rowBox = event.target.closest("input[data-pick-key]");
    const box = groupBox || rowBox;
    if (!box) return;

    const kind = box.dataset.money;
    const m = MONEY[kind];

    if (groupBox) {
      const group = m.view.groups.find((g) => g.key === groupBox.dataset.groupKey);
      for (const row of group?.rows || []) {
        if (groupBox.checked) m.picked.add(m.rowKey(row));
        else m.picked.delete(m.rowKey(row));
      }
      for (const input of $("tableBody").querySelectorAll("input[data-pick-key]")) input.checked = m.picked.has(input.dataset.pickKey);
    } else {
      if (rowBox.checked) m.picked.add(rowBox.dataset.pickKey);
      else m.picked.delete(rowBox.dataset.pickKey);

      const group = m.view.groups.find((g) => g.rows.some((row) => m.rowKey(row) === rowBox.dataset.pickKey));
      const head = group && [...$("tableBody").querySelectorAll("input[data-group-key]")].find((input) => input.dataset.groupKey === group.key);
      if (head) head.checked = group.rows.every((row) => m.picked.has(m.rowKey(row)));
    }

    drawSelection(kind);
  });

  // One request per seller or store, as the server settles them.
  function openMoneyPaid(kind, rows) {
    const m = MONEY[kind];

    if (!rows.length) {
      toast(kind === "payouts" ? "Tick the units you paid first." : "Tick the amounts that were paid first.");
      return;
    }

    const batches = new Map();
    for (const row of rows) {
      const key = m.groupKey(row);
      if (!batches.has(key)) batches.set(key, { label: m.groupLabel(row), rows: [] });
      batches.get(key).rows.push(row);
    }

    const list = [...batches.values()];
    const total = money2(rows.reduce((sum, row) => sum + row.amount, 0));
    const [one, many] = m.unit;
    const [who, whos] = m.who;

    pending = { money: { kind, batches: list } };

    $("actionTitle").textContent = list.length === 1 ? `Mark paid · ${list[0].label}` : `Mark paid · ${list.length} ${whos}`;
    $("actionText").classList.remove("blocked");
    $("actionText").textContent = kind === "payouts"
      ? `${rows.length} ${rows.length === 1 ? one : many}, ${money.format(total)} in total, paid to ${list.length === 1 ? "this seller" : `${list.length} sellers`}? Payment Status becomes Paid.`
      : `${rows.length} ${rows.length === 1 ? one : many}, ${money.format(total)} in total, received by bank transfer? They are marked Paid with today's date, recorded as one Bank Transfer payment per store, and any payment link they were on is cancelled.`;
    $("actionInputs").innerHTML = list.map((batch) => {
      const sum = money2(batch.rows.reduce((s, row) => s + row.amount, 0));
      const ids = batch.rows.map((row) => kind === "payouts" ? row.item : row.label).join(", ");
      return `<p class="note"><strong>${esc(batch.label)}</strong> · ${batch.rows.length} · ${esc(money.format(sum))}<br>${esc(ids)}</p>`;
    }).join("");
    $("actionError").textContent = "";
    $("actionConfirm").textContent = "Mark paid";
    $("actionConfirm").disabled = false;
    $("actionDialog").showModal();
    $("actionConfirm").focus();
  }

  async function submitMoneyPaid() {
    const { kind, batches } = pending.money;
    const m = MONEY[kind];
    const done = [];
    const failed = [];

    $("actionConfirm").disabled = true;
    $("actionError").textContent = "";

    for (const batch of batches) {
      try {
        const body = kind === "payouts"
          ? { ids: batch.rows.map((row) => row.id) }
          : { targets: batch.rows.map((row) => ({ source: row.source, id: row.id })) };

        const result = await api(kind === "payouts" ? "/api/admin/payouts/mark-paid" : "/api/admin/payments/mark-paid", { method: "POST", body: JSON.stringify(body) });

        for (const row of batch.rows) m.picked.delete(m.rowKey(row));
        done.push(result.message || `${batch.label} marked paid.`);
      } catch (err) {
        failed.push(`${batch.label}: ${err.message}`);
      }
    }

    loadList({ fresh: true });

    if (failed.length) {
      $("actionError").textContent = failed.join(" ");
      $("actionInputs").innerHTML = done.map((line) => `<p class="note">✓ ${esc(line)}</p>`).join("");
      pending = null;
      $("actionConfirm").disabled = true;
      return;
    }

    pending = null;
    $("actionDialog").close();
    toast(done.join(" "));
  }

  $("paymentSummary").addEventListener("click", (event) => {
    const paid = event.target.closest("button[data-paid-selected]");
    if (paid) return openMoneyPaid(paid.dataset.paidSelected, pickedRows(paid.dataset.paidSelected));

    const clear = event.target.closest("button[data-clear-selected]");
    if (clear) {
      MONEY[clear.dataset.clearSelected].picked.clear();
      drawMoneyRows(clear.dataset.clearSelected);
      drawSelection(clear.dataset.clearSelected);
    }
  });

  $("tableBody").addEventListener("click", (event) => {
    const groupPaid = event.target.closest("button[data-group-paid]");
    if (groupPaid) return openMoneyPaid(groupPaid.dataset.money, pickedRows(groupPaid.dataset.money, groupPaid.dataset.groupPaid));

    const copy = event.target.closest("button[data-copy]");
    if (copy) {
      const what = copy.dataset.copyLabel || "Payment link";
      navigator.clipboard?.writeText(copy.dataset.copy).then(() => toast(`${what} copied: ${copy.dataset.copy}`), () => toast("Could not copy. Select the text instead."));
      return;
    }

    if (event.target.closest("input, tr.group-row")) return;
    if (event.target.closest("tr[data-unit]")) return;

    const button = event.target.closest("button[data-action]");
    if (button) {
      const row = button.closest("tr[data-id]");
      openAction(button.dataset.action, button.dataset.source, row.dataset.id);
      return;
    }

    if (event.target.closest("a")) return;
    const row = event.target.closest("tr[data-id]");
    if (!row) return;

    const view = currentView();
    openRecord(row.dataset.source || view.source, row.dataset.id);
  });

  /* ---------------- side panel ---------------- */

  function markSelected() {
    for (const row of $("tableBody").querySelectorAll("tr[data-id]")) {
      row.classList.toggle("selected", state.selected.endsWith(row.dataset.id));
    }
  }

  async function openRecord(source, id) {
    state.selected = `${source}:${id}`;
    writeHash();
    markSelected();

    $("panel").hidden = false;
    $("panelTitle").textContent = "Loading…";
    $("panelBody").innerHTML = "";

    try {
      const data = await api(`/api/admin/record?source=${encodeURIComponent(source)}&id=${encodeURIComponent(id)}&section=${encodeURIComponent(state.section)}&view=${encodeURIComponent(state.view)}`);

      if (state.selected !== `${source}:${id}`) return;

      $("panelTitle").textContent = data.label || "Record";
      $("panelActions").innerHTML = actionButtons(source, data.actions, data.links);
      $("panelActions").dataset.id = id;

      const groups = data.groups
        .map((group) => {
          const rows = group.fields
            .filter((field) => field.type === "url" ? field.href : field.value !== null && field.value !== "")
            .map((field) => `<dt>${esc(field.label)}</dt><dd>${render(field.type === "long" ? "text" : field.type, field)}</dd>`)
            .join("");

          return rows ? `<section class="group"><h3>${esc(group.title)}</h3><dl>${rows}</dl></section>` : "";
        })
        .join("");

      const timeline = data.timeline?.length
        ? `<ul class="timeline">${data.timeline.map((item) => `<li><span><strong>${esc(item.actor_name)}</strong> · ${esc(item.action)}</span><small>${esc(dateFmt.format(new Date(item.created_at)))}</small></li>`).join("")}</ul>`
        : `<p class="dash">No admin actions on this record yet.</p>`;

      $("panelBody").innerHTML = `${groups}<section class="group"><h3>History</h3>${timeline}</section>`;
    } catch (err) {
      if (state.selected !== `${source}:${id}`) return;
      $("panelTitle").textContent = "Could not open";
      $("panelBody").innerHTML = `<p class="error">${esc(err.message)}</p>`;
    }
  }

  function closePanel(updateHash = true) {
    $("panel").hidden = true;
    state.selected = "";
    markSelected();
    if (updateHash) writeHash("");
  }

  $("panelClose").addEventListener("click", () => closePanel());

  $("panelActions").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-action]");
    if (button) openAction(button.dataset.action, button.dataset.source, $("panelActions").dataset.id);
  });

  /* ---------------- actions ---------------- */

  let pending = null;
  let toastTimer;

  function toast(message) {
    $("toast").textContent = message;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, 7000);
  }

  function inputHtml(spec, prefill, options = []) {
    const id = `action-${spec.name}`;
    const value = prefill === null || prefill === undefined ? "" : prefill;

    if (spec.type === "select") {
      return `<div class="field"><label for="${id}">${esc(spec.label)}</label><select class="select" id="${id}" name="${esc(spec.name)}">${(spec.options || []).map((option) => `<option value="${esc(option)}"${option === value ? " selected" : ""}>${esc(option)}</option>`).join("")}</select></div>`;
    }

    if (spec.type === "checkbox") {
      return `<label class="choice" for="${id}"><input type="checkbox" id="${id}" name="${esc(spec.name)}"> <span>${esc(spec.label)}</span></label>`;
    }

    // Which offer: one line per open offer, the only one already chosen.
    if (spec.type === "choice") {
      return `<fieldset class="choices" id="${id}"><legend>${esc(spec.label)}</legend>${options
        .map((option, i) => `<label class="choice"><input type="radio" name="${esc(spec.name)}" id="${id}-${i}" value="${esc(option.id)}"${options.length === 1 ? " checked" : ""}> <span>${esc(option.label)}</span></label>`)
        .join("")}</fieldset>`;
    }

    if (spec.type === "file") {
      return `<div class="field"><label for="${id}">${esc(spec.label)}</label><input id="${id}" name="${esc(spec.name)}" type="file" accept="${esc(spec.accept || "")}"></div>`;
    }

    const extra = spec.type === "money" ? ' inputmode="decimal" autocomplete="off"' : ' autocomplete="off"';
    const max = spec.max ? ` maxlength="${Number(spec.max)}"` : "";

    return `<div class="field"><label for="${id}">${esc(spec.label)}</label><input class="input" id="${id}" name="${esc(spec.name)}" type="text" value="${esc(value)}"${extra}${max}></div>`;
  }

  async function openAction(key, source, id) {
    const def = state.actions[key];
    if (!def) return;

    pending = { key, source, id, def };

    $("actionTitle").textContent = def.label;
    // Accept and Counter read the live offers from Kickz Caviar, which takes a few seconds.
    $("actionText").textContent = def.inputs.some((spec) => spec.type === "choice") ? "Loading the current offers…" : "Loading…";
    $("actionText").classList.remove("blocked");
    $("actionInputs").innerHTML = "";
    $("actionError").textContent = "";
    $("actionConfirm").disabled = true;
    $("actionConfirm").textContent = def.label;
    $("actionDialog").showModal();

    try {
      const info = await api(`/api/admin/action?action=${encodeURIComponent(key)}&source=${encodeURIComponent(source)}&id=${encodeURIComponent(id)}`);
      if (pending?.id !== id || pending?.key !== key) return;

      $("actionTitle").textContent = `${def.label} · ${info.label}`;

      if (info.blocked) {
        $("actionText").textContent = info.blocked;
        $("actionText").classList.add("blocked");
        return;
      }

      $("actionText").textContent = info.confirm || def.note || "";

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>External Sales · Lojiq Admin</title>
  <link rel="icon" href="/favicon.png">
  <script>
    try { if (localStorage.getItem("lojiq-admin-theme") === "light") document.documentElement.dataset.theme = "light"; } catch {}
  </script>
  <style>
    /* Same palette and components as admin.html, so External Sales reads as
       part of the same portal. */
    :root {
      --bg: #08080A;
      --panel: #121215;
      --panel-2: #17171B;
      --border: #26262B;
      --text: #E9E9EE;
      --muted: #8B8B95;
      --nav-item: #A8A8AF;
      --primary: #2F80ED;
      --primary-soft: #66B3FF;
      --primary-tint: rgba(102, 179, 255, 0.16);
      --red: #F04438;
      --warning: #F59E0B;
      --strong: #FFFFFF;
      --faint: #55555D;
      --nav-title: #5F5F68;
      --hover-border: #3A3A41;
      --strip: #1B1C21;
      --row-hover: rgba(102, 179, 255, 0.06);
      --pill-bg: rgba(139, 139, 149, 0.16);
      --pill-text: #CFCFD7;
      --good-bg: rgba(22, 179, 100, 0.16);
      --good-text: #4ADE9A;
      --wait-bg: rgba(245, 158, 11, 0.16);
      --wait-text: #FBBF4C;
      --move-bg: rgba(47, 128, 237, 0.18);
      --bad-bg: rgba(240, 68, 56, 0.16);
      --bad-text: #FF7A70;
      --toast-bg: #0F2A1E;
      --toast-border: rgba(22, 179, 100, 0.5);
      --toast-text: #D6F5E6;
      --shadow: rgba(0, 0, 0, 0.5);
      --backdrop: rgba(0, 0, 0, 0.6);
      --logo-plate: transparent;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #F3F5F8;
      --panel: #FFFFFF;
      --panel-2: #F0F2F6;
      --border: #DCE0E7;
      --text: #1A1D23;
      --muted: #616875;
      --nav-item: #3E4450;
      --primary-soft: #1B64C8;
      --primary-tint: rgba(47, 128, 237, 0.12);
      --red: #D63B30;
      --warning: #B86E00;
      --strong: #0C0E13;
      --faint: #A2A8B2;
      --nav-title: #8A909B;
      --hover-border: #C3C9D3;
      --strip: #F1F3F7;
      --row-hover: rgba(47, 128, 237, 0.05);
      --pill-bg: rgba(97, 104, 117, 0.12);
      --pill-text: #3E4450;
      --good-bg: rgba(18, 151, 90, 0.12);
      --good-text: #0C7446;
      --wait-bg: rgba(214, 139, 0, 0.14);
      --wait-text: #8F5500;
      --move-bg: rgba(47, 128, 237, 0.12);
      --bad-bg: rgba(214, 59, 48, 0.1);
      --bad-text: #B42E24;
      --toast-bg: #E6F5EC;
      --toast-border: rgba(18, 151, 90, 0.45);
      --toast-text: #0E4F31;
      --shadow: rgba(20, 28, 40, 0.14);
      --backdrop: rgba(20, 28, 40, 0.35);
      --logo-plate: #121215;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: var(--bg); color: var(--text); min-height: 100vh; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--primary-soft); }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--primary-soft); outline-offset: 2px; }

    .input, .select { height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); min-width: 0; }
    textarea.input { height: auto; min-height: 70px; padding: 9px 11px; resize: vertical; }
    .input:focus, .select:focus { border-color: var(--primary); outline: none; }
    .btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; font-weight: 700; white-space: nowrap; }
    .btn:hover { border-color: var(--hover-border); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn.ghost { background: none; border-color: transparent; color: var(--muted); }

    .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .logo { display: flex; align-items: baseline; gap: 8px; margin: 0 6px 14px; }
    .logo img { width: 104px; height: auto; display: block; background: var(--logo-plate); border-radius: 6px; }
    .logo span { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary-soft); }
    .nav-section { display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 10px 0 2px; padding: 6px 8px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--nav-title); text-align: left; }
    .nav-section::after { content: "▸"; font-size: 11px; letter-spacing: 0; transition: transform 0.15s ease; }
    .nav-section[aria-expanded="true"]::after { transform: rotate(90deg); }
    .nav-section:hover { color: var(--text); background: var(--primary-tint); }
    .nav-section.current { color: var(--primary-soft); }
    .nav-group { display: flex; flex-direction: column; gap: 2px; }
    @media (prefers-reduced-motion: reduce) { .nav-section::after { transition: none; } }
    .nav-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 30px; padding: 0 8px; border-radius: 7px; color: var(--nav-item); text-decoration: none; font-size: 12px; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }
    .nav-item:hover, .nav-item.active { background: var(--primary-tint); color: var(--strong); }
    .nav-item.active { font-weight: 700; }
    .nav-item small { color: var(--muted); font-variant-numeric: tabular-nums; }

    .content { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .heading { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .heading h1 { margin: 0; font-size: 20px; }
    .crumb { color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

    .totals { display: flex; flex-wrap: wrap; gap: 8px; }
    .total { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 130px; }
    .total span { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
    .total strong { font-size: 16px; color: var(--strong); font-variant-numeric: tabular-nums; }

    .table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: auto; background: var(--panel); max-height: calc(100vh - 260px); }
    table { border-collapse: collapse; width: max-content; min-width: 100%; }
    th { position: sticky; top: 0; z-index: 4; background: var(--panel-2); text-align: left; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
    tbody tr:hover td { background: var(--row-hover); }
    td.money, th.money { text-align: right; font-variant-numeric: tabular-nums; }
    td.check, th.check { width: 34px; text-align: center; }
    td.check input, th.check input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
    .id { font-weight: 700; color: var(--strong); }
    .dash { color: var(--faint); }
    .sub { color: var(--muted); font-size: 12px; }
    tbody tr[data-id] { cursor: pointer; }
    tbody tr.selected td { background: rgba(102, 179, 255, 0.12); }

    /* Side panel, as on the Store Orders and Member WTBs tabs. */
    .panel { position: fixed; top: 0; right: 0; width: min(480px, 100%); height: 100vh; background: var(--panel); border-left: 1px solid var(--border); box-shadow: -20px 0 50px var(--shadow); z-index: 40; display: flex; flex-direction: column; }
    .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .panel-head h2 { margin: 0; font-size: 16px; flex: 1 1 auto; }
    .panel-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .panel-body { overflow-y: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 18px; }
    .group h3 { margin: 0 0 8px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .group dl { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 7px 12px; }
    .group dt { color: var(--muted); }
    .group dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .pair-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .pair-list li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .pair-list img, .pair-list .no-img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 6px; }
    .pair-list .no-img { background: var(--panel-2); border: 1px dashed var(--border); }
    .pair-list strong { color: var(--strong); }
    .link-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .timeline li { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; border-left: 2px solid var(--border); }
    .timeline small { color: var(--muted); }
    .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--pill-bg); color: var(--pill-text); }
    .pill.good { background: var(--good-bg); color: var(--good-text); }
    .pill.wait { background: var(--wait-bg); color: var(--wait-text); }
    .pill.move { background: var(--move-bg); color: var(--primary-soft); }
    .pill.bad { background: var(--bad-bg); color: var(--bad-text); }
    .row-actions { display: inline-flex; gap: 6px; }
    .act { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); font-size: 12px; font-weight: 700; cursor: pointer; }
    .act:hover { border-color: var(--primary); color: var(--strong); }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

    tr.group-row td { background: var(--strip); padding: 10px 12px; }
    tbody tr.group-row:hover td { background: var(--strip); }
    .group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    .group-head strong { color: var(--strong); font-variant-numeric: tabular-nums; }
    .group-head .old { color: var(--warning); font-weight: 700; }
    .actionbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .actionbar[hidden] { display: none !important; }

    dialog { width: min(520px, calc(100vw - 32px)); background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 0; box-shadow: 0 30px 80px var(--shadow); }
    dialog::backdrop { background: var(--backdrop); }
    .dialog-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .dialog-body h2 { margin: 0; font-size: 17px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .field .hint { color: var(--muted); font-size: 12px; }
    .label-list { display: flex; flex-direction: column; gap: 6px; }
    .label-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
    .label-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .label-add input[type=file] { color: var(--muted); min-width: 0; }
    .label-rows { display: flex; flex-direction: column; gap: 6px; }
    .label-rows:empty { display: none; }
    .label-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; align-items: center; }
    .label-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100vw - 32px)); background: var(--toast-bg); border: 1px solid var(--toast-border); color: var(--toast-text); padding: 12px 16px; border-radius: 10px; box-shadow: 0 16px 40px var(--shadow); }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
      .label-add { grid-template-columns: 1fr; }
    }

    /* ----- External Sales on Supabase ----- */
    .panel { width: min(620px, 100%); }
    .syncline { display: flex; align-items: center; gap: 10px; color: var(--muted); flex-wrap: wrap; }
    .syncline .bad { color: var(--bad-text); font-weight: 700; }
    .total.neg strong { color: var(--bad-text); }
    .total small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    td.neg { color: var(--bad-text); font-weight: 700; }
    .parcels { display: flex; flex-direction: column; gap: 8px; }
    .parcel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
    .parcel .label-cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .parcel input.input { height: 30px; width: 100%; }
    .file-btn { position: relative; overflow: hidden; }
    .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .new-parcels { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px dashed var(--border); border-radius: 8px; }
    .new-parcels .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .money-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .money-grid div { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .money-grid span { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
    .money-grid strong { font-variant-numeric: tabular-nums; color: var(--strong); }
    .pairs-table { width: 100%; }
    .pairs-table td, .pairs-table th { padding: 6px 8px; white-space: normal; }
    .pairs-table th { position: static; }
    .pairs-table img, .pairs-table .no-img { width: 38px; height: 38px; object-fit: contain; background: #fff; border-radius: 6px; display: block; }
    .pairs-table .no-img { background: var(--panel-2); border: 1px dashed var(--border); }
    .pairs-table input { width: 90px; height: 30px; text-align: right; }
    .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .check-group { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .check-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .check-head strong { color: var(--strong); font-size: 14px; }
    .check-head .sub { flex-basis: 100%; }
    .check-items { list-style: none; margin: 0; padding: 0; }
    .check-items li { display: flex; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); align-items: baseline; }
    .check-items li:last-child { border-bottom: 0; }
    .check-items li[data-id]:not([data-id=""]) { cursor: pointer; }
    .check-items li[data-id]:not([data-id=""]):hover { background: var(--row-hover); }
    .checks { display: flex; flex-direction: column; gap: 12px; }
    textarea.notes { width: 100%; min-height: 70px; }

    @media (max-width: 860px) {
      .parcel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Admin navigation">
      <div class="logo"><img src="/logo.png" alt="Lojiq"><span>Admin</span></div>
      <button class="nav-section" type="button" data-nav-section="store" aria-controls="navStore" aria-expanded="false">Store Orders</button>
      <div class="nav-group" id="navStore" hidden></div>

      <button class="nav-section" type="button" data-nav-section="mwtb" aria-controls="navMwtb" aria-expanded="false">Member WTBs</button>
      <div class="nav-group" id="navMwtb" hidden></div>

      <button class="nav-section" type="button" data-nav-section="money" aria-controls="navMoney" aria-expanded="false">Finance</button>
      <div class="nav-group" id="navMoney" hidden></div>

      <button class="nav-section" type="button" data-nav-section="forwarding" aria-controls="navForwarding" aria-expanded="false">Forward Service</button>
      <div class="nav-group" id="navForwarding" hidden>
        <a class="nav-item" href="/admin/forwarding?tab=awaiting_label">Awaiting label <small data-nav-count="forwarding/awaiting_label"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=ready_to_ship">Ready to Ship <small data-nav-count="forwarding/ready_to_ship"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=shipped">Shipped <small data-nav-count="forwarding/shipped"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=all">All forwards</a>
      </div>

      <button class="nav-section" type="button" data-nav-section="external" aria-controls="navExternal" aria-expanded="false">External Sales</button>
      <div class="nav-group" id="navExternal" hidden>
        <button class="nav-item" type="button" data-tab="pending">Pending <small data-nav-count="external/pending"></small></button>
        <button class="nav-item" type="button" data-tab="ready">Ready to Ship <small data-nav-count="external/ready"></small></button>
        <button class="nav-item" type="button" data-tab="shipped">Shipped</button>
        <button class="nav-item" type="button" data-tab="all">All sales &amp; earnings</button>
        <button class="nav-item" type="button" data-tab="checks">Checks <small data-nav-count="external/checks"></small></button>
      </div>

      <button class="nav-section" type="button" data-nav-section="marketplaces" aria-controls="navMarketplaces" aria-expanded="false">Marketplaces</button>
      <div class="nav-group" id="navMarketplaces" hidden>
        <a class="nav-item" href="/admin/bol-pages">bol pages <small data-nav-count="marketplaces/bol_pages"></small></a>
      </div>
    </nav>

    <main class="content">
      <div class="heading">
        <span class="crumb">External Sales</span>
        <h1 id="viewTitle">Pending</h1>
      </div>

      <div class="syncline">
        <span id="syncText">Not synced with Airtable yet.</span>
        <button class="act" id="syncBtn" type="button">Sync now</button>
      </div>

      <div class="filters" id="listFilters">
        <input class="input" id="searchInput" type="search" placeholder="Search deal, buyer, SKU, tracking…" style="width:280px">
        <select class="select" id="monthSelect" aria-label="Month" hidden></select>
        <select class="select" id="statusSelect" aria-label="Status" hidden>
          <option value="">Every status</option>
          <option value="pending">Pending</option>
          <option value="ready_to_ship">Ready to Ship</option>
          <option value="shipped">Shipped</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <span class="count" id="count"></span>
      </div>

      <div class="totals" id="totals" hidden></div>

      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Deal</th>
              <th>Buyer</th>
              <th>Sale date</th>
              <th class="money">Pairs</th>
              <th>SKUs</th>
              <th class="money">Selling</th>
              <th class="money">Profit</th>
              <th>Parcels</th>
              <th>Shipping</th>
              <th>Payment</th>
              <th>Books</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td class="empty" colspan="11">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="checks" id="checks" hidden></div>
    </main>
  </div>

  <aside class="panel" id="panel" hidden aria-label="Deal details">
    <div class="panel-head">
      <h2 id="panelTitle"></h2>
      <button class="btn ghost" id="panelClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <div class="toast" id="toast" hidden role="status"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    const esc = (value) => String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    const euro = (value) => value === null || value === undefined ? "—" : `€ ${Number(value).toLocaleString("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const dayFmt = new Intl.DateTimeFormat("nl-NL", { day: "2-digit", month: "2-digit", year: "numeric" });
    const dateFmt = new Intl.DateTimeFormat("nl-NL", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const monthFmt = new Intl.DateTimeFormat("en-GB", { month: "long", year: "numeric" });
    const day = (value) => { const d = new Date(value); return value && !isNaN(d) ? dayFmt.format(d) : "—"; };

    const TABS = {
      pending: "Pending",
      ready: "Ready to Ship",
      shipped: "Shipped",
      all: "All sales & earnings",
      checks: "Checks"
    };

    const SHIPPING = { pending: ["Pending", "wait"], ready_to_ship: ["Ready to Ship", "move"], shipped: ["Shipped", "good"], cancelled: ["Cancelled", "bad"] };
    const PAYMENT = { pending: ["Unpaid", "wait"], partially_paid: ["Partially paid", "wait"], paid: ["Paid", "good"], cancelled: ["Cancelled", "bad"] };
    const BOOKS = { to_invoice: ["To invoice", "wait"], invoiced: ["Invoiced", "good"], credited: ["Credited", ""], not_invoiced: ["Not invoiced", ""] };
    const SEVERITY = { error: ["Error", "bad"], warning: ["To do", "wait"], info: ["Info", ""] };

    const pill = (map, key) => { const [label, cls] = map[key] || [key || "—", ""]; return `<span class="pill ${cls}">${esc(label)}</span>`; };

    const params = new URLSearchParams(location.search);
    const state = { tab: TABS[params.get("tab")] ? params.get("tab") : "pending", sales: [], selected: null, detail: null, sync: null };

    async function api(url, options = {}) {
      const response = await fetch(url, { credentials: "same-origin", ...options });

      if (response.status === 401) {
        location.href = "/admin";
        throw new Error("Not signed in");
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `The server answered ${response.status}.`);
      return data;
    }

    const postJson = (url, body) => api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

    let toastTimer = null;
    function toast(message) {
      $("toast").textContent = message;
      $("toast").hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { $("toast").hidden = true; }, 5000);
    }

    /* ---------------- sidebar ---------------- */

    const NAV_GROUPS = { store: "navStore", mwtb: "navMwtb", money: "navMoney", forwarding: "navForwarding", external: "navExternal", marketplaces: "navMarketplaces" };
    const NAV_OPEN_KEY = "lojiq-admin-nav-open";
    const openNavSections = new Set();

    try {
      const saved = JSON.parse(localStorage.getItem(NAV_OPEN_KEY) || "null");
      if (Array.isArray(saved)) saved.forEach((section) => openNavSections.add(section));
    } catch {}

    openNavSections.add("external");

    const saveNavSections = () => { try { localStorage.setItem(NAV_OPEN_KEY, JSON.stringify([...openNavSections])); } catch {} };
    saveNavSections();

    function drawNavSections() {
      for (const [section, groupId] of Object.entries(NAV_GROUPS)) {
        const header = document.querySelector(`[data-nav-section="${section}"]`);
        $(groupId).hidden = !openNavSections.has(section);
        header.setAttribute("aria-expanded", String(openNavSections.has(section)));
        header.classList.toggle("current", section === "external");
      }

      document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
    }

    let navCounts = {};
    let navViews = [];
    const navCount = (key) => { const n = navCounts[key]; return `<small>${typeof n === "number" && n > 0 ? n : ""}</small>`; };

    function drawOtherSections(views) {
      navViews = views || [];
      const link = (view) => `<a class="nav-item" href="/admin#/${esc(view.section)}/${esc(view.key)}">${esc(view.label)} ${navCount(`${view.section}/${view.key}`)}</a>`;
      const finance = [{ key: "payments", section: "money", label: "Open Payments" }, { key: "payouts", section: "money", label: "Payouts" }];

      $("navStore").innerHTML = navViews.filter((v) => v.section === "store").map(link).join("");
      $("navMwtb").innerHTML = navViews.filter((v) => v.section === "mwtb").map(link).join("");
      $("navMoney").innerHTML = finance.map(link).join("") + `<a class="nav-item" href="/admin/forwarding?view=payments">Forwarding Payments ${navCount("money/forwarding_payments")}</a>`;

      document.querySelectorAll("[data-nav-count]").forEach((el) => {
        const n = navCounts[el.dataset.navCount];
        el.textContent = typeof n === "number" && n > 0 ? String(n) : "";
      });
    }

    async function loadNavCounts(fresh = false) {
      try {
        navCounts = (await api(`/api/admin/counts${fresh ? "?fresh=1" : ""}`)).tabs || {};
        drawOtherSections(navViews);
      } catch {}
    }

    document.querySelector(".sidebar").addEventListener("click", (event) => {
      const header = event.target.closest("[data-nav-section]");

      if (header) {
        const section = header.dataset.navSection;
        if (openNavSections.has(section)) openNavSections.delete(section);
        else openNavSections.add(section);
        saveNavSections();
        drawNavSections();
        return;
      }

      const tab = event.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        history.replaceState(null, "", `/admin/external-sales?tab=${state.tab}`);
        closePanel();
        drawNavSections();
        load();
      }
    });

    /* ---------------- sync ---------------- */

    function drawSync() {
      const s = state.sync;
      if (!s?.at && !s?.error) {
        $("syncText").textContent = "Not synced with Airtable since the service started - it runs every five minutes.";
        return;
      }

      const ago = s.at ? Math.max(0, Math.round((Date.now() - new Date(s.at).getTime()) / 60000)) : null;
      const parts = [];
      if (s.error) parts.push(`<span class="bad">Sync failed: ${esc(s.error)}</span>`);
      if (s.at) parts.push(`Synced with Airtable ${ago === 0 ? "just now" : `${ago} min ago`} (${esc(s.deals)} deals)`);
      if (s.errors?.length) parts.push(`<span class="bad">${s.errors.length} deal(s) could not be read - see Checks</span>`);
      $("syncText").innerHTML = parts.join(" · ");
    }

    $("syncBtn").addEventListener("click", async () => {
      $("syncBtn").disabled = true;
      $("syncBtn").textContent = "Syncing…";
      try {
        const out = await postJson("/api/admin/external-sales/sync", {});
        state.sync = out.sync;
        toast(`Synced: ${out.changed} deal(s) changed${out.errors ? `, ${out.errors} could not be read` : ""}.`);
        await load();
        loadNavCounts(true);
      } catch (err) {
        toast(err.message);
      } finally {
        $("syncBtn").disabled = false;
        $("syncBtn").textContent = "Sync now";
      }
    });

    /* ---------------- list ---------------- */

    function visibleSales() {
      const query = $("searchInput").value.trim().toLowerCase();
      const month = state.tab === "all" ? $("monthSelect").value : "";
      const status = state.tab === "all" ? $("statusSelect").value : "";

      return state.sales.filter((s) =>
        (!month || String(s.sale_date || "").startsWith(month)) &&
        (!status || s.shipping_status === status) &&
        (!query || [s.deal, s.buyer_name, s.buyer_company, s.skus, ...(s.tracking || []), ...(s.invoices || [])].join(" ").toLowerCase().includes(query)));
    }

    function drawMonths() {
      const months = [...new Set(state.sales.map((s) => String(s.sale_date || "").slice(0, 7)).filter(Boolean))].sort().reverse();
      const current = $("monthSelect").value;
      $("monthSelect").innerHTML = `<option value="">All time</option>` + months.map((m) => `<option value="${esc(m)}">${esc(monthFmt.format(new Date(`${m}-01T12:00:00`)))}</option>`).join("");
      if (months.includes(current)) $("monthSelect").value = current;
    }

    function drawTotals(sales) {
      if (state.tab !== "all") { $("totals").hidden = true; return; }

      // Earnings: cancelled deals left out, and a deal without a known profit
      // (mixed VAT, no price per pair) counted apart instead of guessed.
      const live = sales.filter((s) => s.payment_status !== "cancelled");
      const known = live.filter((s) => s.money.profit !== null);
      const sum = (rows, key) => rows.reduce((total, s) => total + Number(s.money[key] || 0), 0);
      const profit = sum(known, "profit");
      const unknown = live.length - known.length;

      $("totals").hidden = false;
      $("totals").innerHTML = `
        <div class="total"><span>Deals</span><strong>${live.length}</strong><small>${sum(live, "pairs")} pairs</small></div>
        <div class="total"><span>Selling incl. VAT</span><strong>${euro(sum(live, "selling"))}</strong></div>
        <div class="total"><span>Selling excl. VAT</span><strong>${euro(sum(known, "selling_ex_vat"))}</strong></div>
        <div class="total"><span>Purchase excl. VAT</span><strong>${euro(sum(known, "purchase"))}</strong></div>
        <div class="total"><span>Shipping</span><strong>${euro(sum(known, "shipping"))}</strong></div>
        <div class="total ${profit < 0 ? "neg" : ""}"><span>Profit</span><strong>${euro(profit)}</strong>${unknown ? `<small>${unknown} deal(s) without a profit yet - see Checks</small>` : ""}</div>`;
    }

    function render() {
      const sales = visibleSales();
      $("viewTitle").textContent = TABS[state.tab];
      document.title = `${TABS[state.tab]} · External Sales · Lojiq Admin`;
      $("count").textContent = `${sales.length} ${sales.length === 1 ? "deal" : "deals"}`;
      drawTotals(sales);

      if (!sales.length) {
        $("rows").innerHTML = `<tr><td class="empty" colspan="11">${state.sales.length ? "Nothing matches." : "Nothing here."}</td></tr>`;
        return;
      }

      $("rows").innerHTML = sales.map((s) => {
        const parcels = s.labels_needed
          ? `${s.labels}/${s.labels_needed} labels`
          : s.labels ? `${s.labels} label${s.labels === 1 ? "" : "s"}` : "";
        const tracking = s.tracking.length ? `${s.tracking.length} tracking` : "";
        return `
        <tr data-id="${esc(s.id)}" class="${s.id === state.selected ? "selected" : ""}">
          <td class="id">${esc(s.deal)}</td>
          <td>${esc(s.buyer_name || "—")}${s.buyer_country ? `<div class="sub">${esc(s.buyer_country)}</div>` : ""}</td>
          <td>${esc(day(s.sale_date))}</td>
          <td class="money">${esc(s.money.pairs)}</td>
          <td style="white-space:normal;max-width:240px">${esc(s.skus || "—")}</td>
          <td class="money">${esc(euro(s.money.selling))}</td>
          <td class="money ${s.money.profit !== null && s.money.profit < 0 ? "neg" : ""}">${s.money.profit === null ? '<span class="dash" title="Mixed VAT: enter the price per pair">?</span>' : esc(euro(s.money.profit))}</td>
          <td>${[parcels, tracking].filter(Boolean).map(esc).join(" · ") || '<span class="dash">—</span>'}</td>
          <td>${pill(SHIPPING, s.shipping_status)}</td>
          <td>${pill(PAYMENT, s.payment_status)}</td>
          <td>${pill(BOOKS, s.bookkeeping_status)}${s.invoices.length ? `<div class="sub">${esc(s.invoices.join(", "))}</div>` : ""}</td>
        </tr>`;
      }).join("");
    }

    async function loadChecks() {
      $("checks").innerHTML = `<p class="sub">Loading…</p>`;
      try {
        const out = await api("/api/admin/external-sales/checks");
        state.sync = out.sync;
        drawSync();

        if (!out.checks.length) {
          $("checks").innerHTML = `<div class="empty">Everything adds up.</div>`;
          return;
        }

        $("checks").innerHTML = out.checks.map((c) => `
          <section class="check-group">
            <div class="check-head">${pill(SEVERITY, c.severity)} <strong>${esc(c.title)}</strong> <span class="sub">${esc(c.items.length)}</span><span class="sub">${esc(c.hint)}</span></div>
            <ul class="check-items">${c.items.map((i) => `
              <li data-id="${esc(i.id)}"><span class="id">${esc(i.deal || "—")}</span><span>${esc(i.buyer)}</span><span class="sub">${esc(i.detail)}</span></li>`).join("")}
            </ul>
          </section>`).join("");
      } catch (err) {
        $("checks").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
      }
    }

    async function load() {
      const checks = state.tab === "checks";
      $("checks").hidden = !checks;
      $("tableWrap").hidden = checks;
      $("listFilters").hidden = checks;
      $("monthSelect").hidden = state.tab !== "all";
      $("statusSelect").hidden = state.tab !== "all";
      $("viewTitle").textContent = TABS[state.tab];

      if (checks) {
        $("totals").hidden = true;
        return loadChecks();
      }

      $("rows").innerHTML = `<tr><td class="empty" colspan="11">Loading…</td></tr>`;

      try {
        const out = await api(`/api/admin/external-sales?tab=${encodeURIComponent(state.tab)}`);
        state.sales = out.sales || [];
        state.sync = out.sync;
        drawSync();
        drawMonths();
        render();
      } catch (err) {
        $("rows").innerHTML = `<tr><td class="empty" colspan="11">${esc(err.message)}</td></tr>`;
      }
    }

    $("rows").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-id]");
      if (row) openPanel(row.dataset.id);
    });

    $("checks").addEventListener("click", (event) => {
      const item = event.target.closest("li[data-id]");
      if (item?.dataset.id) openPanel(item.dataset.id);
    });

    $("searchInput").addEventListener("input", render);
    $("monthSelect").addEventListener("change", render);
    $("statusSelect").addEventListener("change", render);

    /* ---------------- side panel ---------------- */

    function closePanel() {
      state.selected = null;
      state.detail = null;
      $("panel").hidden = true;
      if (state.tab !== "checks") render();
    }

    async function openPanel(id) {
      state.selected = id;
      if (state.tab !== "checks") render();
      $("panel").hidden = false;
      $("panelTitle").textContent = state.sales.find((s) => s.id === id)?.deal || "Deal";
      $("panelBody").innerHTML = `<p class="sub">Loading…</p>`;

      try {
        state.detail = await api(`/api/admin/external-sales/get?id=${encodeURIComponent(id)}`);
        drawPanel();
      } catch (err) {
        $("panelBody").innerHTML = `<p class="sub">${esc(err.message)}</p>`;
      }
    }

    // After an edit: the answer is the deal as it is now.
    function applyDetail(detail, message) {
      state.detail = { ...detail, history: state.detail?.history || [] };
      drawPanel();
      if (message) toast(message);
      refreshAfterEdit();
    }

    let refreshTimer = null;
    function refreshAfterEdit() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(async () => {
        if (state.tab === "checks") loadChecks();
        else {
          try {
            const out = await api(`/api/admin/external-sales?tab=${encodeURIComponent(state.tab)}`);
            state.sales = out.sales || [];
            render();
          } catch {}
        }
        loadNavCounts(true);
        if (state.selected) {
          try { state.detail.history = (await api(`/api/admin/external-sales/get?id=${encodeURIComponent(state.selected)}`)).history || []; drawHistory(); } catch {}
        }
      }, 400);
    }

    /*
     * The tracking number a label file is named after, if it is one
     * ("1ZG223389130065859.jpeg"). Letters and digits only, 8 to 35 long, at
     * least six digits: UPS 1Z..., DPD and DHL numbers - not "label-1".
     */
    const trackingFromFileName = (name) => {
      const base = String(name || "").replace(/\.[^.]+$/, "").trim();
      return /^[A-Za-z0-9]{8,35}$/.test(base) && (base.match(/\d/g) || []).length >= 6 ? base : "";
    };

    const labelContentType = (file) =>
      ["application/pdf", "image/jpeg", "image/png"].includes(file.type) ? file.type : "application/pdf";

    function drawHistory() {
      const el = $("historyBox");
      if (!el) return;
      const history = state.detail.history || [];
      el.innerHTML = history.length
        ? `<ul class="timeline">${history.map((h) => `<li><span>${esc(h.action)}</span><small>${esc(h.actor_name || "")} · ${h.created_at ? esc(dateFmt.format(new Date(h.created_at))) : ""}</small></li>`).join("")}</ul>`
        : '<p class="sub">Nothing changed here yet.</p>';
    }

    function drawPanel() {
      const { sale: s, pairs, parcels, invoices, money } = state.detail;
      const locked = ["invoiced", "credited"].includes(s.bookkeeping_status);
      const closed = ["shipped", "cancelled"].includes(s.shipping_status);

      $("panelTitle").textContent = s.deal;

      const parcelRows = parcels.length
        ? parcels.map((p, i) => `
          <div class="parcel">
            <span class="label-cell">${p.label_url
              ? `<a href="${esc(p.label_url)}" target="_blank" rel="noopener">Label ${i + 1}</a> <span class="sub">${esc(p.label_filename || "")}</span>`
              : `<label class="act file-btn">Add label<input type="file" accept="application/pdf,image/jpeg,image/png" data-parcel-label="${esc(p.id)}"></label>`}</span>
            <input class="input" type="text" value="${esc(p.tracking_number || "")}" placeholder="Tracking number" data-parcel-tracking="${esc(p.id)}" data-was="${esc(p.tracking_number || "")}" autocomplete="off" aria-label="Tracking number for parcel ${i + 1}">
            <span class="row-actions">
              <button class="act" type="button" data-parcel-save="${esc(p.id)}">Save</button>
              <button class="act" type="button" data-parcel-remove="${esc(p.id)}" aria-label="Remove parcel ${i + 1}">✕</button>
            </span>
          </div>`).join("")
        : '<p class="sub">No parcels yet.</p>';

      const pairRows = pairs.map((p) => `
        <tr>
          <td>${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : '<span class="no-img"></span>'}</td>
          <td><strong>${esc(p.product_name || p.sku || "—")}</strong><div class="sub">${esc(p.sku || "")} · ${esc(p.size || "")} · ${esc(p.item_id || "")}</div></td>
          <td class="money">${p.purchase_vat_type ? esc(p.purchase_vat_type) : '<span class="pill bad">no VAT type</span>'}<div class="sub">${Number(p.purchase_price_ex_vat) > 0 ? esc(euro(p.purchase_price_ex_vat)) : '<span class="pill bad">no price</span>'}</div></td>
          <td class="money">${esc(p.selling_vat_type || "—")}<div>${locked
            ? esc(p.selling_price === null ? "—" : euro(p.selling_price))
            : `<input class="input" type="text" inputmode="decimal" value="${p.selling_price === null ? "" : esc(String(p.selling_price).replace(".", ","))}" placeholder="—" data-pair-price="${esc(p.id)}" aria-label="Selling price">`}</div></td>
        </tr>`).join("");

      const invoiceRows = invoices.length
        ? `<ul class="link-list">${invoices.map((i) => `<li>${esc(i.kind === "credit" ? "Credit " : "")}<strong>${esc(i.invoice_number || i.rompslomp_invoice_id)}</strong> · ${esc(i.vat_route || "—")} · ${esc(euro(i.amount_incl_vat))} · ${i.journal_entry_id ? '<span class="pill good">journal</span>' : '<span class="pill bad">no journal</span>'}</li>`).join("")}</ul>`
        : '<p class="sub">No invoice yet.</p>';

      $("panelBody").innerHTML = `
        <div class="inline">${pill(SHIPPING, s.shipping_status)} ${pill(PAYMENT, s.payment_status)} ${pill(BOOKS, s.bookkeeping_status)}</div>

        <div class="group">
          <h3>Parcels${s.labels_needed ? ` · ${parcels.filter((p) => p.label_url).length} of ${s.labels_needed} labels` : ""}</h3>
          <div class="parcels">${parcelRows}</div>
          ${s.items_per_parcel ? `<p class="sub">Items per parcel: ${esc(s.items_per_parcel)}</p>` : ""}
          ${s.shipping_status === "cancelled" ? "" : `
          <div class="new-parcels" style="margin-top:8px">
            <div class="row">
              <label class="btn file-btn">Add labels…<input id="newLabels" type="file" multiple accept="application/pdf,image/jpeg,image/png"></label>
              <span class="sub">or a tracking number alone:</span>
              <input class="input" id="newTracking" type="text" placeholder="Tracking number" autocomplete="off" style="width:200px">
              <button class="btn" id="addTrackingBtn" type="button">Add</button>
            </div>
            <div id="newLabelRows" class="parcels"></div>
            <span class="sub">A label or a tracking number puts the deal on Ready to Ship, so it shows in Pack &amp; Ship. Each label is its own parcel; its tracking number is filled in when the file is named after it.</span>
          </div>`}
          ${closed ? "" : `<div class="inline" style="margin-top:8px"><button class="btn" id="markShippedBtn" type="button">Mark as shipped</button><span class="sub">Normally Pack &amp; Ship does this.</span></div>`}
        </div>

        <div class="group">
          <h3>Money</h3>
          <div class="money-grid">
            <div><span>Selling incl. VAT</span><strong>${esc(euro(money.selling))}</strong></div>
            <div><span>Selling excl. VAT</span><strong>${money.selling_ex_vat === null ? "?" : esc(euro(money.selling_ex_vat))}</strong></div>
            <div><span>Purchase excl. VAT</span><strong>${esc(euro(money.purchase))}</strong></div>
            <div><span>Shipping</span><strong>${esc(euro(money.shipping))}</strong></div>
            <div><span>Profit</span><strong style="${money.profit !== null && money.profit < 0 ? "color:var(--bad-text)" : ""}">${money.profit === null ? "?" : esc(euro(money.profit))}</strong></div>
          </div>
          ${money.selling_ex_vat === null ? '<p class="sub">This deal mixes VAT types. Enter the selling price of every pair below to get its profit - the invoice needs them too.</p>' : ""}
          <div class="inline" style="margin-top:8px">
            <label class="sub" for="shippingInput">Shipping costs (€)</label>
            <input class="input" id="shippingInput" type="text" inputmode="decimal" value="${esc(String(Number(s.shipping_costs || 0)).replace(".", ","))}" style="width:100px">
            <button class="act" id="shippingSave" type="button">Save</button>
          </div>
        </div>

        <div class="group">
          <h3>Pairs (${pairs.length})</h3>
          ${pairs.length ? `<div style="overflow-x:auto"><table class="pairs-table"><thead><tr><th></th><th>Pair</th><th class="money">Purchase</th><th class="money">Selling</th></tr></thead><tbody>${pairRows}</tbody></table></div>` : '<p class="sub">No pairs linked.</p>'}
          ${locked ? '<p class="sub">Invoiced: prices and purchase are booked and no longer change here.</p>' : `
          <div class="inline" style="margin-top:8px">
            <button class="act" id="pricesSave" type="button">Save prices per pair</button>
            <button class="act" id="refreshPurchase" type="button">Read purchase again from Airtable</button>
          </div>`}
        </div>

        <div class="group">
          <h3>Books</h3>
          ${invoiceRows}
          <div class="inline" style="margin-top:8px">
            ${s.bookkeeping_status === "to_invoice" ? '<button class="act" id="notInvoicedBtn" type="button">Not to be invoiced…</button>' : ""}
            ${s.bookkeeping_status === "not_invoiced" ? '<button class="act" id="toInvoiceBtn" type="button">Back to "to invoice"</button>' : ""}
          </div>
        </div>

        <div class="group">
          <h3>Buyer</h3>
          <dl>
            <dt>Name</dt><dd>${esc(s.buyer_name || "—")}${s.buyer_id ? ` (${esc(s.buyer_id)})` : ""}</dd>
            ${s.buyer_company ? `<dt>Company</dt><dd>${esc(s.buyer_company)}</dd>` : ""}
            <dt>Email</dt><dd>${esc(s.buyer_email || "—")}</dd>
            <dt>Country</dt><dd>${esc(s.buyer_country || "—")}${s.buyer_country_code ? ` (${esc(s.buyer_country_code)})` : ""}</dd>
            <dt>VAT ID</dt><dd>${esc(s.buyer_vat_id || "—")}</dd>
            <dt>Sale date</dt><dd>${esc(day(s.sale_date))}</dd>
            ${s.paid_at ? `<dt>Paid</dt><dd>${esc(day(s.paid_at))}</dd>` : ""}
            ${s.shipped_at ? `<dt>Shipped</dt><dd>${esc(day(s.shipped_at))}</dd>` : ""}
            ${s.payment_note ? `<dt>Payment note</dt><dd>${esc(s.payment_note)}</dd>` : ""}
          </dl>
        </div>

        <div class="group">
          <h3>Notes</h3>
          <textarea class="input notes" id="notesInput" aria-label="Notes">${esc(s.notes || "")}</textarea>
          <div class="inline" style="margin-top:6px"><button class="act" id="notesSave" type="button">Save notes</button></div>
        </div>

        <div class="group"><h3>History</h3><div id="historyBox"></div></div>`;

      drawHistory();
    }

    $("panelClose").addEventListener("click", closePanel);

    async function busy(button, work) {
      if (button) button.disabled = true;
      try {
        await work();
      } catch (err) {
        toast(err.message);
      } finally {
        if (button && document.body.contains(button)) button.disabled = false;
      }
    }

    const update = (body, message) => postJson("/api/admin/external-sales/update", { id: state.detail.sale.id, ...body }).then((d) => applyDetail(d, message));

    function drawNewLabelRows(files) {
      $("newLabelRows").innerHTML = files.map((file, i) => `
        <div class="parcel">
          <span class="label-cell" title="${esc(file.name)}">${esc(file.name)}</span>
          <input class="input" type="text" data-new-tracking="${i}" value="${esc(trackingFromFileName(file.name))}" placeholder="Tracking number (optional)" autocomplete="off">
          <span></span>
        </div>`).join("") + (files.length ? `<div class="inline"><button class="btn primary" id="uploadLabelsBtn" type="button">Upload ${files.length} label${files.length === 1 ? "" : "s"}</button><button class="btn ghost" id="clearLabelsBtn" type="button">Cancel</button></div>` : "");
    }

    $("panelBody").addEventListener("change", async (event) => {
      if (event.target.id === "newLabels") {
        drawNewLabelRows([...event.target.files]);
        return;
      }

      const labelInput = event.target.closest("[data-parcel-label]");
      if (labelInput?.files?.[0]) {
        const file = labelInput.files[0];
        await busy(null, async () => {
          const d = await api(`/api/admin/external-sales/parcel/label?id=${encodeURIComponent(labelInput.dataset.parcelLabel)}`, { method: "POST", headers: { "Content-Type": labelContentType(file) }, body: file });
          applyDetail(d, "Label added.");
        });
      }
    });

    $("panelBody").addEventListener("click", async (event) => {
      const target = event.target;
      const id = state.detail?.sale?.id;
      if (!id) return;

      if (target.id === "uploadLabelsBtn") {
        const files = [...$("newLabels").files];
        const trackings = files.map((_, i) => (document.querySelector(`[data-new-tracking="${i}"]`)?.value || "").trim());
        return busy(target, async () => {
          let added = 0;
          try {
            for (const [i, file] of files.entries()) {
              target.textContent = `Uploading ${i + 1}/${files.length}…`;
              const d = await api(`/api/admin/external-sales/parcel?sale=${encodeURIComponent(id)}&tracking=${encodeURIComponent(trackings[i])}`, { method: "POST", headers: { "Content-Type": labelContentType(file) }, body: file });
              state.detail = { ...d, history: state.detail.history };
              added += 1;
            }
            applyDetail(state.detail, `${added === 1 ? "Label" : `${added} labels`} added.`);
          } catch (err) {
            if (added) applyDetail(state.detail, `${added} added, then: ${err.message}`);
            else throw err;
          }
        });
      }

      if (target.id === "clearLabelsBtn") {
        $("newLabels").value = "";
        $("newLabelRows").innerHTML = "";
        return;
      }

      if (target.id === "addTrackingBtn") {
        const tracking = $("newTracking").value.trim();
        if (!tracking) return toast("Type the tracking number first.");
        return busy(target, async () => {
          const d = await api(`/api/admin/external-sales/parcel?sale=${encodeURIComponent(id)}&tracking=${encodeURIComponent(tracking)}`, { method: "POST", headers: { "Content-Type": "application/octet-stream" } });
          applyDetail(d, "Parcel added.");
        });
      }

      if (target.dataset.parcelSave) {
        const input = document.querySelector(`[data-parcel-tracking="${target.dataset.parcelSave}"]`);
        if (input.value.trim() === input.dataset.was) return toast("Nothing changed.");
        return busy(target, async () => {
          const d = await postJson("/api/admin/external-sales/parcel/tracking", { id: target.dataset.parcelSave, tracking_number: input.value });
          applyDetail(d, "Tracking saved.");
        });
      }

      if (target.dataset.parcelRemove) {
        if (!confirm("Remove this parcel, with its label and tracking number?")) return;
        return busy(target, async () => {
          const d = await postJson("/api/admin/external-sales/parcel/remove", { id: target.dataset.parcelRemove });
          applyDetail(d, "Parcel removed.");
        });
      }

      if (target.id === "markShippedBtn") {
        if (!confirm(`Mark ${state.detail.sale.deal} as shipped? Normally Pack & Ship does this.`)) return;
        return busy(target, () => update({ mark_shipped: true }, "Marked as shipped."));
      }

      if (target.id === "shippingSave") return busy(target, () => update({ shipping_costs: $("shippingInput").value }, "Shipping costs saved (in Airtable too)."));
      if (target.id === "notesSave") return busy(target, () => update({ notes: $("notesInput").value }, "Notes saved."));

      if (target.id === "pricesSave") {
        const prices = [...document.querySelectorAll("[data-pair-price]")].map((input) => ({ id: input.dataset.pairPrice, selling_price: input.value.trim() }));
        return busy(target, () => update({ pair_prices: prices }, "Prices saved."));
      }

      if (target.id === "refreshPurchase") return busy(target, () => update({ refresh_purchase: true }, "Purchase read again."));

      if (target.id === "notInvoicedBtn") {
        const reason = prompt("Why is this deal not invoiced? (for example: APLUG self-billing, test deal)");
        if (!reason?.trim()) return;
        return busy(target, () => update({ bookkeeping_status: "not_invoiced", reason }, "Marked as not invoiced."));
      }

      if (target.id === "toInvoiceBtn") return busy(target, () => update({ bookkeeping_status: "to_invoice" }, "Back on to invoice."));
    });

    drawNavSections();

    api("/api/admin/me")
      .then((me) => {
        drawOtherSections(me.views);
        load();
        setTimeout(loadNavCounts, 500);
        setInterval(loadNavCounts, 300_000);
      })
      .catch(() => {});
  </script>
</body>
</html>

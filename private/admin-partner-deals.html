<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Partner Deals · Lojiq Admin</title>
  <link rel="icon" href="/favicon.png">
  <script>
    try { if (localStorage.getItem("lojiq-admin-theme") === "light") document.documentElement.dataset.theme = "light"; } catch {}
  </script>
  <style>
    /* Same palette and components as admin.html, so Forward Service reads as
       part of the same portal. */
    :root {
      --bg: #08080A;
      --panel: #121215;
      --panel-2: #17171B;
      --border: #26262B;
      --text: #E9E9EE;
      --muted: #8B8B95;
      --nav-item: #A8A8AF;
      --primary: #2F80ED;
      --primary-soft: #66B3FF;
      --primary-tint: rgba(102, 179, 255, 0.16);
      --red: #F04438;
      --warning: #F59E0B;
      --strong: #FFFFFF;
      --faint: #55555D;
      --nav-title: #5F5F68;
      --hover-border: #3A3A41;
      --strip: #1B1C21;
      --row-hover: rgba(102, 179, 255, 0.06);
      --pill-bg: rgba(139, 139, 149, 0.16);
      --pill-text: #CFCFD7;
      --good-bg: rgba(22, 179, 100, 0.16);
      --good-text: #4ADE9A;
      --wait-bg: rgba(245, 158, 11, 0.16);
      --wait-text: #FBBF4C;
      --move-bg: rgba(47, 128, 237, 0.18);
      --bad-bg: rgba(240, 68, 56, 0.16);
      --bad-text: #FF7A70;
      --toast-bg: #0F2A1E;
      --toast-border: rgba(22, 179, 100, 0.5);
      --toast-text: #D6F5E6;
      --shadow: rgba(0, 0, 0, 0.5);
      --backdrop: rgba(0, 0, 0, 0.6);
      --logo-plate: transparent;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #F3F5F8;
      --panel: #FFFFFF;
      --panel-2: #F0F2F6;
      --border: #DCE0E7;
      --text: #1A1D23;
      --muted: #616875;
      --nav-item: #3E4450;
      --primary-soft: #1B64C8;
      --primary-tint: rgba(47, 128, 237, 0.12);
      --red: #D63B30;
      --warning: #B86E00;
      --strong: #0C0E13;
      --faint: #A2A8B2;
      --nav-title: #8A909B;
      --hover-border: #C3C9D3;
      --strip: #F1F3F7;
      --row-hover: rgba(47, 128, 237, 0.05);
      --pill-bg: rgba(97, 104, 117, 0.12);
      --pill-text: #3E4450;
      --good-bg: rgba(18, 151, 90, 0.12);
      --good-text: #0C7446;
      --wait-bg: rgba(214, 139, 0, 0.14);
      --wait-text: #8F5500;
      --move-bg: rgba(47, 128, 237, 0.12);
      --bad-bg: rgba(214, 59, 48, 0.1);
      --bad-text: #B42E24;
      --toast-bg: #E6F5EC;
      --toast-border: rgba(18, 151, 90, 0.45);
      --toast-text: #0E4F31;
      --shadow: rgba(20, 28, 40, 0.14);
      --backdrop: rgba(20, 28, 40, 0.35);
      --logo-plate: #121215;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: var(--bg); color: var(--text); min-height: 100vh; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--primary-soft); }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--primary-soft); outline-offset: 2px; }

    .input, .select { height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); min-width: 0; }
    textarea.input { height: auto; min-height: 70px; padding: 9px 11px; resize: vertical; }
    .input:focus, .select:focus { border-color: var(--primary); outline: none; }
    .btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; font-weight: 700; white-space: nowrap; }
    .btn:hover { border-color: var(--hover-border); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn.ghost { background: none; border-color: transparent; color: var(--muted); }

    .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .logo { display: flex; align-items: baseline; gap: 8px; margin: 0 6px 14px; }
    .logo img { width: 104px; height: auto; display: block; background: var(--logo-plate); border-radius: 6px; }
    .logo span { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary-soft); }
    .nav-section { display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 10px 0 2px; padding: 6px 8px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--nav-title); text-align: left; }
    .nav-section::after { content: "▸"; font-size: 11px; letter-spacing: 0; transition: transform 0.15s ease; }
    .nav-section[aria-expanded="true"]::after { transform: rotate(90deg); }
    .nav-section:hover { color: var(--text); background: var(--primary-tint); }
    .nav-section.current { color: var(--primary-soft); }
    .nav-group { display: flex; flex-direction: column; gap: 2px; }
    @media (prefers-reduced-motion: reduce) { .nav-section::after { transition: none; } }
    .nav-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 30px; padding: 0 8px; border-radius: 7px; color: var(--nav-item); text-decoration: none; font-size: 12px; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }
    .nav-item:hover, .nav-item.active { background: var(--primary-tint); color: var(--strong); }
    .nav-item.active { font-weight: 700; }
    .nav-item small { color: var(--muted); font-variant-numeric: tabular-nums; }

    .content { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .heading { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .heading h1 { margin: 0; font-size: 20px; }
    .crumb { color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

    .totals { display: flex; flex-wrap: wrap; gap: 8px; }
    .total { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 130px; }
    .total span { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
    .total strong { font-size: 16px; color: var(--strong); font-variant-numeric: tabular-nums; }

    .table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: auto; background: var(--panel); max-height: calc(100vh - 260px); }
    table { border-collapse: collapse; width: max-content; min-width: 100%; }
    th { position: sticky; top: 0; z-index: 4; background: var(--panel-2); text-align: left; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
    tbody tr:hover td { background: var(--row-hover); }
    td.money, th.money { text-align: right; font-variant-numeric: tabular-nums; }
    td.check, th.check { width: 34px; text-align: center; }
    td.check input, th.check input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
    .id { font-weight: 700; color: var(--strong); }
    .dash { color: var(--faint); }
    .sub { color: var(--muted); font-size: 12px; }
    tbody tr[data-id] { cursor: pointer; }
    tbody tr.selected td { background: rgba(102, 179, 255, 0.12); }

    /* Side panel, as on the Store Orders and Member WTBs tabs. */
    .panel { position: fixed; top: 0; right: 0; width: min(480px, 100%); height: 100vh; background: var(--panel); border-left: 1px solid var(--border); box-shadow: -20px 0 50px var(--shadow); z-index: 40; display: flex; flex-direction: column; }
    .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .panel-head h2 { margin: 0; font-size: 16px; flex: 1 1 auto; }
    .panel-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .panel-body { overflow-y: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 18px; }
    .group h3 { margin: 0 0 8px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .group dl { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 7px 12px; }
    .group dt { color: var(--muted); }
    .group dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .pair-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .pair-list li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .pair-list img, .pair-list .no-img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 6px; }
    .pair-list .no-img { background: var(--panel-2); border: 1px dashed var(--border); }
    .pair-list strong { color: var(--strong); }
    .link-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .timeline li { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; border-left: 2px solid var(--border); }
    .timeline small { color: var(--muted); }
    .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--pill-bg); color: var(--pill-text); }
    .pill.good { background: var(--good-bg); color: var(--good-text); }
    .pill.wait { background: var(--wait-bg); color: var(--wait-text); }
    .pill.move { background: var(--move-bg); color: var(--primary-soft); }
    .pill.bad { background: var(--bad-bg); color: var(--bad-text); }
    .row-actions { display: inline-flex; gap: 6px; }
    .act { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); font-size: 12px; font-weight: 700; cursor: pointer; }
    .act:hover { border-color: var(--primary); color: var(--strong); }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

    tr.group-row td { background: var(--strip); padding: 10px 12px; }
    tbody tr.group-row:hover td { background: var(--strip); }
    .group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    .group-head strong { color: var(--strong); font-variant-numeric: tabular-nums; }
    .group-head .old { color: var(--warning); font-weight: 700; }
    .actionbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .actionbar[hidden] { display: none !important; }

    dialog { width: min(520px, calc(100vw - 32px)); background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 0; box-shadow: 0 30px 80px var(--shadow); }
    dialog::backdrop { background: var(--backdrop); }
    .dialog-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .dialog-body h2 { margin: 0; font-size: 17px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .field .hint { color: var(--muted); font-size: 12px; }
    .label-list { display: flex; flex-direction: column; gap: 6px; }
    .label-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
    .label-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
    .label-add input[type=file] { color: var(--muted); min-width: 0; }
    .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100vw - 32px)); background: var(--toast-bg); border: 1px solid var(--toast-border); color: var(--toast-text); padding: 12px 16px; border-radius: 10px; box-shadow: 0 16px 40px var(--shadow); }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
      .label-add { grid-template-columns: 1fr; }
    }
  </style>
  <style>
    /* Only this page: a payout is a list of payments, each with what it paid. */
    .payout-note { display: flex; flex-direction: column; gap: 6px; }
    .pay-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .pay { border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .pay.unknown { border-color: var(--warning); }
    .pay-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .pay-head strong { color: var(--strong); font-variant-numeric: tabular-nums; }
    .pay-head .sub { margin-left: auto; }
    .pay-lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .pay-lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .pay-lines .inv { color: var(--primary-soft); }
    .sum { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
    .sum span:nth-child(even) { font-variant-numeric: tabular-nums; text-align: right; }
    .sum .big { color: var(--strong); font-weight: 700; }
    .off { color: var(--warning); }

    /* Same foot as the main admin page: who is signed in, the theme switch
       and Log out. Without it those two disappear the moment you open a tab
       that has its own page. */
    .sidebar-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
    .sidebar-foot strong { color: var(--text); }
    .theme-switch { justify-content: flex-start; padding: 0; height: auto; }

    /* ---- Inbound Scans ---- */
    .meta { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin: 0; font-size: 13px; }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; color: var(--text); }
    .sec { display: flex; flex-direction: column; gap: 10px; }
    .sec + .sec { margin-top: 20px; }
    .sec h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .line-what { display: flex; flex-direction: column; gap: 2px; }
    .line-what .sub { font-size: 11px; }

    /*
     * The panel is narrower than the page: what is in the box wraps there
     * rather than pushing the table sideways.
     */
    .panel-body table { width: 100%; }
    .panel-body td { white-space: normal; vertical-align: top; }

    /* Inventory: the view tabs and the reasons a pair is held back. */
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 0; }
    .tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
    .tab:hover { color: var(--strong); background: var(--primary-tint); }
    .tab[aria-selected="true"] { border-color: transparent; background: var(--primary-tint); color: var(--primary-soft); }
    .tab small { font-variant-numeric: tabular-nums; font-weight: 600; opacity: 0.8; }

    /*
     * The reasons wrap instead of widening the table. Without a width of
     * their own "Already shipped on order 11629" pushed the column off the
     * screen and the sentence was cut in half, which is the half that says
     * where to go and look.
     */
    table:not(.with-why) .col-why { display: none; }

    .why { display: flex; flex-direction: column; gap: 3px; white-space: normal; min-width: 210px; max-width: 340px; }
    .why span { font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; }
    .why .block { color: var(--bad-text); }
    .why .note { color: var(--muted); }

    /*
     * Status, and underneath it where the pair lies if that is not here.
     * Stacked rather than left to flow: side by side the column grew to the
     * width of both pills together on the few rows that have a location.
     *
     * The stacking goes on a box INSIDE the cell. Putting display:flex on
     * the td itself takes it out of display:table-cell, so the cell stops
     * lining up with its own row - in light mode that showed as a white
     * block sitting half a row low behind every status.
     */
    tbody tr[data-pair] { cursor: pointer; }

    /* Where the next page is asked for; see the observer below. */
    .sentinel { height: 1px; }

    .thumb { width: 38px; height: 38px; object-fit: contain; background: #fff; border-radius: 6px; display: block; }
    /* Not "empty": that class is the padded "nothing here" cell, and its
       40px of padding stretched the placeholder to twice the row height. */
    .thumb.blank { background: var(--panel-2); border: 1px dashed var(--border); }

    td.kind { color: var(--muted); white-space: nowrap; }

    td.date, th.date { white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* The one header that needs explaining carries its own note on hover. */
    th[title] { cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }

    .where { white-space: normal; }
    /*
     * Side by side, never stacked: a second badge underneath made that row
     * taller than the ones around it. nowrap keeps it on one line, and the
     * column sizes itself to the widest pair - both values here are short.
     */
    .where .stack { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }

    /*
     * One line each, cut off rather than wrapped.
     *
     * A product name that wrapped made its row taller than the ones around
     * it, so the table stepped up and down with the length of a shoe's
     * name. The whole name is on the cell's title attribute, so nothing is
     * lost - it is one hover away.
     */
    .what { display: flex; flex-direction: column; gap: 1px; min-width: 0; max-width: 340px; }
    .what strong, .what .sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .what strong { font-weight: 700; color: var(--strong); }

    /*
     * Search sits above the tabs, the way Store Orders has it, so the row
     * under them is free for the buttons and filters that come later.
     */
    .searchbar { display: flex; }
    .searchbar .input { flex: 1; max-width: 520px; }

    /* The check groups above the table, one per kind of disagreement. */
    .groups { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 0; }
    .group { display: flex; flex-direction: column; gap: 1px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: none; cursor: pointer; text-align: left; min-width: 150px; }
    .group:hover { background: var(--primary-tint); }
    .group[aria-pressed="true"] { border-color: transparent; background: var(--primary-tint); }
    .group b { font-size: 12px; color: var(--strong); font-weight: 700; }
    .group span { font-size: 11px; color: var(--muted); }
    .group[aria-pressed="true"] b { color: var(--primary-soft); }
    .group-todo { margin: 0; font-size: 12px; color: var(--muted); }
    .group-todo strong { color: var(--strong); }
  </style>
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Admin navigation">
      <div class="logo"><img src="/logo.png" alt="Lojiq"><span>Admin</span></div>
      <button class="nav-section" type="button" data-nav-section="store" aria-controls="navStore" aria-expanded="false">Store Orders</button>
      <div class="nav-group" id="navStore" hidden></div>

      <button class="nav-section" type="button" data-nav-section="mwtb" aria-controls="navMwtb" aria-expanded="false">Member WTBs</button>
      <div class="nav-group" id="navMwtb" hidden></div>

      <button class="nav-section" type="button" data-nav-section="money" aria-controls="navMoney" aria-expanded="false">Finance</button>
      <div class="nav-group" id="navMoney" hidden></div>

      <button class="nav-section" type="button" data-nav-section="forwarding" aria-controls="navForwarding" aria-expanded="false">Forward Service</button>
      <div class="nav-group" id="navForwarding" hidden>
        <a class="nav-item" href="/admin/forwarding?tab=awaiting_label">Awaiting label <small data-nav-count="forwarding/awaiting_label"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=ready_to_ship">Ready to Ship <small data-nav-count="forwarding/ready_to_ship"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=shipped">Shipped <small data-nav-count="forwarding/shipped"></small></a>
        <a class="nav-item" href="/admin/forwarding?tab=all">All forwards</a>
      </div>

      <button class="nav-section" type="button" data-nav-section="external" aria-controls="navExternal" aria-expanded="false">External Sales</button>
      <div class="nav-group" id="navExternal" hidden>
        <a class="nav-item" href="/admin/external-sales?tab=pending">Pending <small class="nav-count" data-nav-count="external/pending"></small></a>
        <a class="nav-item" href="/admin/external-sales?tab=ready">Ready to Ship <small class="nav-count" data-nav-count="external/ready"></small></a>
        <a class="nav-item" href="/admin/external-sales?tab=shipped">Shipped</a>
        <a class="nav-item" href="/admin/external-sales?tab=all">All</a>
        <a class="nav-item" href="/admin/external-sales?tab=checks">Checks <small class="nav-count" data-nav-count="external/checks"></small></a>
      </div>

      <button class="nav-section" type="button" data-nav-section="partner" aria-controls="navPartner" aria-expanded="false">Partner</button>
      <div class="nav-group" id="navPartner" hidden></div>

      <button class="nav-section" type="button" data-nav-section="marketplaces" aria-controls="navMarketplaces" aria-expanded="false">Marketplaces</button>
      <div class="nav-group" id="navMarketplaces" hidden>
        <a class="nav-item" href="/admin/bol-pages">bol pages <small data-nav-count="marketplaces/bol_pages"></small></a>
      </div>

      <button class="nav-section" type="button" data-nav-section="warehouse" aria-controls="navWarehouse" aria-expanded="false">Warehouse</button>
      <div class="nav-group" id="navWarehouse" hidden></div>

      <div class="sidebar-foot">
        <span>Signed in as <strong id="userName">…</strong></span>
        <button class="btn ghost theme-switch" id="themeSwitch" type="button" aria-pressed="false">Light mode</button>
        <button class="btn ghost" id="logoutButton" type="button">Log out</button>
      </div>
    </nav>

    <main class="content">
      <div class="heading">
        <span class="crumb">Partner</span>
        <h1>Partner Deals</h1>
      </div>

      <div class="searchbar">
        <input class="input" id="search" type="search" placeholder="SKU, product, consignor or MWTB…" autocomplete="off" aria-label="Search partner deals">
      </div>

      <div class="tabs" id="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-view="yours" aria-selected="false">Needs you <small></small></button>
        <button class="tab" type="button" role="tab" data-view="waiting" aria-selected="false">Waiting on him <small></small></button>
        <button class="tab" type="button" role="tab" data-view="settled" aria-selected="false">Settled <small></small></button>
        <button class="tab" type="button" role="tab" data-view="all" aria-selected="false">All <small></small></button>
      </div>

      <div class="filters">
        <span class="count" id="count"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Size</th>
              <th>Consignor</th>
              <th class="money">He asks</th>
              <th class="money">You offered</th>
              <th class="money">He wants</th>
              <th class="money">Buyer pays</th>
              <th class="money">Margin</th>
              <th>State</th>
              <th>Answer</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td class="empty" colspan="10">Loading…</td></tr>
          </tbody>
          <tfoot><tr><td colspan="10" style="padding:0;border:0"><div class="sentinel" id="sentinel" aria-hidden="true"></div></td></tr></tfoot>
        </table>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" hidden role="status"></div>
  <script>
    const $ = (id) => document.getElementById(id);

    const esc = (value) => String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    const money = (value) => Number(value || 0).toLocaleString("nl-NL", { style: "currency", currency: "EUR" });

    const dayFmt = new Intl.DateTimeFormat("nl-NL", { day: "2-digit", month: "2-digit", year: "numeric" });
    const day = (value) => (value ? dayFmt.format(new Date(value)) : "—");

    const VIEWS = ["yours", "waiting", "settled", "all"];
    const PAGE = 300;

    function startingView() {
      const asked = new URLSearchParams(location.search).get("view");
      return VIEWS.includes(asked) ? asked : "yours";
    }

    const state = { offers: [], counts: {}, totals: { offers: 0, shown: 0, deals: 0 }, view: startingView(), q: "", limit: PAGE };

    async function api(url, options = {}) {
      const response = await fetch(url, { credentials: "same-origin", ...options });
      if (response.status === 401) {
        location.href = "/admin";
        throw new Error("Not signed in");
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `The server answered ${response.status}.`);
      return data;
    }

    let toastTimer = null;

    function toast(message) {
      $("toast").textContent = message;
      $("toast").hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { $("toast").hidden = true; }, 5000);
    }

    /* ---------------- sidebar ---------------- */

    const NAV_GROUPS = { store: "navStore", mwtb: "navMwtb", money: "navMoney", forwarding: "navForwarding", external: "navExternal", partner: "navPartner", marketplaces: "navMarketplaces", warehouse: "navWarehouse" };
    const NAV_OPEN_KEY = "lojiq-admin-nav-open";
    const openNavSections = new Set();

    try {
      const saved = JSON.parse(localStorage.getItem(NAV_OPEN_KEY) || "null");
      if (Array.isArray(saved)) saved.forEach((section) => openNavSections.add(section));
    } catch {}

    openNavSections.add("partner");

    function saveNavSections() {
      try { localStorage.setItem(NAV_OPEN_KEY, JSON.stringify([...openNavSections])); } catch {}
    }

    saveNavSections();

    function drawNavSections() {
      for (const [section, groupId] of Object.entries(NAV_GROUPS)) {
        const expanded = openNavSections.has(section);
        const header = document.querySelector(`[data-nav-section="${section}"]`);
        $(groupId).hidden = !expanded;
        header.setAttribute("aria-expanded", String(expanded));
        header.classList.toggle("current", section === "partner");
      }
    }

    let navCounts = {};
    let navViews = [];

    const navCount = (key) => {
      const n = navCounts[key];
      return `<small>${typeof n === "number" && n > 0 ? n : ""}</small>`;
    };

    function drawOtherSections(views) {
      navViews = views || [];
      const link = (view) => `<a class="nav-item" href="/admin#/${esc(view.section)}/${esc(view.key)}">${esc(view.label)} ${navCount(`${view.section}/${view.key}`)}</a>`;

      $("navStore").innerHTML = navViews.filter((view) => view.section === "store").map(link).join("");
      $("navMwtb").innerHTML = navViews.filter((view) => view.section === "mwtb").map(link).join("");
      const finance = [{ key: "payments", section: "money", label: "Open Payments" }, { key: "payouts", section: "money", label: "Seller Payouts" }];
      $("navMoney").innerHTML = finance.map(link).join("") +
        `<a class="nav-item" href="/admin/forwarding?view=payments">Forwarding Payments ${navCount("money/forwarding_payments")}</a>` +
        `<a class="nav-item" href="/admin/mollie-payouts">Mollie Payouts</a>`;

      $("navPartner").innerHTML =
        `<a class="nav-item active" href="/admin/partner-deals">Deals ${navCount("partner/deals_yours")}</a>`;

      $("navWarehouse").innerHTML =
        `<a class="nav-item" href="/admin/inbound-scans">Inbound Scans</a>` +
        `<a class="nav-item" href="/admin/inventory">Inventory ${navCount("warehouse/inventory_checks")}</a>` +
        `<a class="nav-item" href="/admin/partner-stock">Partner Stock ${navCount("warehouse/partner_stock")}</a>` +
        `<a class="nav-item" href="/admin/consignment-stock">Consignment Stock</a>`;

      document.querySelectorAll("[data-nav-count]").forEach((el) => {
        const n = navCounts[el.dataset.navCount];
        el.textContent = typeof n === "number" && n > 0 ? String(n) : "";
      });
    }

    async function loadNavCounts() {
      try {
        const data = await api("/api/admin/counts");
        navCounts = data.tabs || {};
        drawOtherSections(navViews);
      } catch {}
    }

    document.querySelector(".sidebar").addEventListener("click", (event) => {
      const header = event.target.closest("[data-nav-section]");
      if (!header) return;

      const section = header.dataset.navSection;
      if (openNavSections.has(section)) openNavSections.delete(section);
      else openNavSections.add(section);
      saveNavSections();
      drawNavSections();
    });

    /* ---------------- the offers ---------------- */

    const STATE_PILL = {
      store_pending: "wait",
      open: "move",
      accepted: "good",
      denied: "bad",
      store_denied: "bad",
      closed: "",
      cancelled: "",
      expired: ""
    };

    function drawTabs() {
      for (const tab of document.querySelectorAll("#tabs .tab")) {
        const view = tab.dataset.view;
        tab.setAttribute("aria-selected", String(view === state.view));
        const n = state.counts[view];
        tab.querySelector("small").textContent = typeof n === "number" ? String(n) : "";
      }
    }

    function drawList() {
      const offers = state.offers;

      $("sentinel").hidden = state.totals.shown >= state.totals.offers;

      $("count").textContent = state.totals.offers
        ? `${state.totals.offers} offer${state.totals.offers === 1 ? "" : "s"} over ${state.totals.deals} deal${state.totals.deals === 1 ? "" : "s"}` +
          (state.totals.shown < state.totals.offers ? ` · showing ${state.totals.shown}` : "")
        : "";

      if (!offers.length) {
        const nothing = state.q
          ? "Nothing here under that."
          : state.view === "yours"
            ? "Nobody is waiting on you."
            : "Nothing here.";
        $("rows").innerHTML = `<tr><td class="empty" colspan="10">${nothing}</td></tr>`;
        return;
      }

      $("rows").innerHTML = offers.map((o) => `
        <tr${o.yours ? ' class="selected"' : ""}>
          <td>
            <div class="what" title="${esc([o.product_name, o.sku, o.wtb_id].filter(Boolean).join(" · "))}">
              <strong>${esc(o.product_name || "—")}</strong>
              <span class="sub">${esc(o.sku || "no SKU")}${o.wtb_id ? ` · ${esc(o.wtb_id)}` : ""}</span>
            </div>
          </td>
          <td>${esc(o.size || "—")}</td>
          <td>
            <div class="what" title="${esc(o.seller_id)}">
              <strong>${esc(o.party || o.seller_id || "—")}</strong>
              <span class="sub">${esc(o.vat_type || "")}${o.countered_at ? ` · countered ${esc(day(o.countered_at))}` : ` · sent ${esc(day(o.created_at))}`}</span>
            </div>
          </td>
          <td class="money">${o.asks > 0 ? esc(money(o.asks)) : "—"}</td>
          <td class="money">${o.offered > 0 ? esc(money(o.offered)) : "—"}</td>
          <td class="money">${o.countered ? `<strong>${esc(money(o.countered))}</strong>` : "—"}</td>
          <td class="money">${o.buyer_price > 0 ? esc(money(o.buyer_price)) : "—"}</td>
          <td class="money" style="${o.margin !== null && o.margin < 0 ? "color:var(--bad-text)" : ""}">${o.margin === null ? "—" : esc(money(o.margin))}</td>
          <td><span class="pill ${STATE_PILL[o.status] ?? ""}">${esc(o.state)}</span></td>
          <td class="answer">${o.yours
            ? `<button class="btn primary" type="button" data-do="accept" data-id="${esc(o.id)}">Accept</button>
               <button class="btn" type="button" data-do="counter" data-id="${esc(o.id)}">Counter</button>
               <button class="btn ghost" type="button" data-do="deny" data-id="${esc(o.id)}">Decline</button>`
            : "—"}</td>
        </tr>`).join("");
    }

    /*
     * Answering, with the number spelled out before it goes.
     *
     * Accepting and declining are one click because the amount is already on
     * the row; a counter asks for the figure, in whole euros - the portal
     * takes nothing else.
     */
    async function answer(id, what) {
      const offer = state.offers.find((o) => o.id === id);
      if (!offer) return;

      let price;

      if (what === "counter") {
        const typed = window.prompt(
          `Counter ${offer.party || offer.seller_id} on ${offer.sku} ${offer.size}.\n\n` +
          `He wants ${money(offer.countered ?? offer.asks)}, you offered ${money(offer.offered)}.\n` +
          `Whole euros only.`,
          String(Math.round(offer.offered || 0))
        );

        if (typed === null) return;

        price = Number(typed);

        if (!Number.isInteger(price) || price <= 0) {
          toast("A counter is a whole number of euros.");
          return;
        }
      }

      if (what === "accept" && !window.confirm(
        `Accept ${money(offer.countered ?? offer.offered)} to ${offer.party || offer.seller_id}?\n\n` +
        `Your buyer pays ${money(offer.buyer_price)}, so you keep ${money(offer.buyer_price - (offer.countered ?? offer.offered))}.`
      )) return;

      if (what === "deny" && !window.confirm(
        `Decline ${offer.party || offer.seller_id} on ${offer.sku} ${offer.size}?`
      )) return;

      for (const button of document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`)) button.disabled = true;

      try {
        const out = await api("/api/admin/partner-deals/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, action: what, price })
        });

        toast(out.did === "countered"
          ? `${money(out.payout)} countered to ${out.seller_id}.`
          : out.did === "accepted"
            ? `${money(out.payout)} accepted for ${out.seller_id}.`
            : `${out.seller_id} declined.`);

        await load();
        loadNavCounts();
      } catch (err) {
        toast(err.message);
        for (const button of document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`)) button.disabled = false;
      }
    }

    $("rows").addEventListener("click", (event) => {
      const button = event.target.closest("[data-do]");
      if (!button) return;

      answer(button.dataset.id, button.dataset.do);
    });

    /* ---------------- loading ---------------- */

    async function load() {
      try {
        const query = new URLSearchParams({ view: state.view, limit: String(state.limit) });
        if (state.q) query.set("q", state.q);

        const data = await api(`/api/admin/partner-deals?${query}`);
        state.offers = data.offers || [];
        state.counts = data.counts || state.counts;
        state.totals = data.totals || state.totals;
        drawTabs();
        drawList();
      } catch (err) {
        $("rows").innerHTML = `<tr><td class="empty" colspan="10">${esc(err.message)}</td></tr>`;
      }
    }

    const looking = () => { $("rows").innerHTML = `<tr><td class="empty" colspan="10">Looking…</td></tr>`; };

    let loadingMore = false;

    new IntersectionObserver(async (entries) => {
      if (!entries.some((entry) => entry.isIntersecting)) return;
      if (loadingMore || state.totals.shown >= state.totals.offers) return;

      loadingMore = true;
      state.limit += PAGE;
      await load();
      loadingMore = false;
    }, { root: document.querySelector(".table-wrap"), rootMargin: "600px" }).observe($("sentinel"));

    $("tabs").addEventListener("click", (event) => {
      const tab = event.target.closest(".tab");
      if (!tab || tab.dataset.view === state.view) return;

      state.view = tab.dataset.view;
      state.limit = PAGE;
      drawTabs();
      looking();

      const url = new URL(location.href);
      url.searchParams.set("view", state.view);
      history.replaceState(null, "", url);

      load();
    });

    let searchTimer = null;

    $("search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.q = $("search").value.trim();
        state.limit = PAGE;
        looking();
        load();
      }, 350);
    });

    drawNavSections();
    drawOtherSections([]);
    drawTabs();
    load();
    loadNavCounts();

    // A counter can land while he is looking at the screen.
    setInterval(() => { if (!document.hidden) load(); }, 60_000);

    /* ---------------- who is signed in, theme, log out ---------------- */

    function syncThemeSwitch() {
      const light = document.documentElement.dataset.theme === "light";
      $("themeSwitch").textContent = light ? "Dark mode" : "Light mode";
      $("themeSwitch").setAttribute("aria-pressed", String(light));
    }

    $("themeSwitch").addEventListener("click", () => {
      const light = document.documentElement.dataset.theme !== "light";

      if (light) document.documentElement.dataset.theme = "light";
      else delete document.documentElement.dataset.theme;

      try { localStorage.setItem("lojiq-admin-theme", light ? "light" : "dark"); } catch { /* not remembered, still switched */ }
      syncThemeSwitch();
    });

    syncThemeSwitch();

    $("logoutButton").addEventListener("click", async () => {
      await api("/api/admin/logout", { method: "POST", body: "{}" }).catch(() => {});
      location.href = "/admin";
    });

    api("/api/admin/me")
      .then((me) => {
        $("userName").textContent = me.user?.name || me.user?.email || "";
        drawOtherSections(me.views);
      })
      .catch(() => { $("userName").textContent = ""; });
  </script>
</body>
</html>
